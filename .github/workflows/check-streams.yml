                  report += f"| **Failed** | {total_checked - total_working} | {((total_checked - total_working)/total_checked*100) if total_checked > 0 else 0:.1f}% |\n"
                  report += f"| **Skipped** | {total_skipped} | {(total_skipped/total_streams*100) if total_streams > 0 else 0:.1f}% |\n\n"
                  
                  # Stream Type Analysis
                  report += "## 🎯 Stream Type Analysis\n\n"
                  for stream_type, counts in self.by_type.items():
                      if counts['total'] > 0:
                          success_rate = (counts['working']/counts['checked']*100) if counts['checked'] > 0 else 0
