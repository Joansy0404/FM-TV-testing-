                          report += f"- **{emoji} {stream_type}:** {counts['working']}/{counts['checked']} working ({success_rate:.1f}%) | {counts['total']} total\n"
                  report += "\n"
                  
                  # Detailed Status Breakdown
                  report += "## 🔍 Detailed Status Classification\n\n"
                  
                  for category, streams in self.results_by_category.items():
                      if streams:
