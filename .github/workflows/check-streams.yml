name: VPN Stream Test (UK/US Auto-Alternating)

on:
  workflow_dispatch:
    inputs:
      sample_size:
        description: 'Sample size (0=all streams)'
        required: false
        default: '0'
        type: string
      check_vods:
        description: 'Check VOD files (URLs ending with #.mkv)'
        required: false
        default: false
        type: boolean
      check_ppv:
        description: 'Check PPV channels (may be offline)'
        required: false
        default: false
        type: boolean
      check_fast:
        description: 'Check FAST channels'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '15 1,7,13,19 * * *'

permissions:
  contents: write

jobs:
  alternating-vpn-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -version

      - name: Determine next VPN country (auto-alternating)
        run: |
          echo "Checking last test location..."
          if [ -f "report.md" ]; then
            LAST=$(grep -oP "Last tested: \K(UK|US)" report.md | head -1 || echo "US")
            echo "Last test was: $LAST"
          else
            LAST="US"
            echo "No previous report, defaulting to US as last"
          fi
          
          if [ "$LAST" = "UK" ]; then
            echo "COUNTRY_CODE=us" >> $GITHUB_ENV
            echo "COUNTRY_NAME=United States" >> $GITHUB_ENV
            echo "✅ Next test: US (alternating from UK)"
          else
            echo "COUNTRY_CODE=uk" >> $GITHUB_ENV
            echo "COUNTRY_NAME=United Kingdom" >> $GITHUB_ENV
            echo "✅ Next test: UK (alternating from US)"
          fi

      - name: Start ProtonVPN via Gluetun
        run: |
          docker network create vpn-network || true
          
          echo "Starting Gluetun with ProtonVPN (${{ env.COUNTRY_NAME }})..."
          docker run -d \
            --name gluetun \
            --cap-add=NET_ADMIN \
            --device /dev/net/tun \
            --network vpn-network \
            -p 8888:8888 \
            -p 8000:8000 \
            -e VPN_SERVICE_PROVIDER=protonvpn \
            -e OPENVPN_USER="${{ secrets.VPN_USER }}" \
            -e OPENVPN_PASSWORD="${{ secrets.VPN_PASSWORD }}" \
            -e SERVER_COUNTRIES="${{ env.COUNTRY_NAME }}" \
            -e FREE_ONLY=off \
            -e LOG_LEVEL=info \
            -e HTTPPROXY=on \
            -e HTTPPROXY_LISTENING_ADDRESS=:8888 \
            qmcgaw/gluetun:latest
          
          echo "Waiting for initial connection..."
          sleep 30

      - name: Verify VPN Connection
        run: |
          echo "=== VPN Connection Verification ==="
          
          VPN_SUCCESS=false
          
          for i in {1..20}; do
            echo "Verification attempt $i/20..."
            sleep 10
            
            if curl -x localhost:8888 -s --connect-timeout 10 https://ipinfo.io/json > /tmp/vpn.json 2>/dev/null; then
              COUNTRY=$(jq -r '.country' /tmp/vpn.json 2>/dev/null || echo "Unknown")
              IP=$(jq -r '.ip' /tmp/vpn.json 2>/dev/null || echo "Unknown")
              ORG=$(jq -r '.org' /tmp/vpn.json 2>/dev/null || echo "Unknown")
              CITY=$(jq -r '.city' /tmp/vpn.json 2>/dev/null || echo "Unknown")
              
              echo "  IP: $IP"
              echo "  Country: $COUNTRY"
              echo "  City: $CITY"
              echo "  ISP: $ORG"
              
              if [[ "$COUNTRY" != "null" && "$COUNTRY" != "Unknown" && "$IP" != "Unknown" ]]; then
                echo "✅ VPN connection successful!"
                echo "VPN_READY=true" >> $GITHUB_ENV
                echo "CONNECTED_IP=$IP" >> $GITHUB_ENV
                echo "CONNECTED_ORG=$ORG" >> $GITHUB_ENV
                echo "CONNECTED_CITY=$CITY" >> $GITHUB_ENV
                echo "CONNECTED_COUNTRY=$COUNTRY" >> $GITHUB_ENV
                
                VPN_SUCCESS=true
                break
              fi
            fi
          done
          
          if [[ "$VPN_SUCCESS" != "true" ]]; then
            echo "❌ VPN connection failed"
            docker logs gluetun --tail 50
            exit 1
          fi

      - name: Run Stream Tests with ffprobe
        env:
          SAMPLE_SIZE: ${{ github.event.inputs.sample_size || '0' }}
          CHECK_VODS: ${{ github.event.inputs.check_vods || 'false' }}
          CHECK_PPV: ${{ github.event.inputs.check_ppv || 'false' }}
          CHECK_FAST: ${{ github.event.inputs.check_fast || 'false' }}
          COUNTRY_CODE: ${{ env.COUNTRY_CODE }}
          CONNECTED_IP: ${{ env.CONNECTED_IP }}
          CONNECTED_ORG: ${{ env.CONNECTED_ORG }}
          CONNECTED_CITY: ${{ env.CONNECTED_CITY }}
          CONNECTED_COUNTRY: ${{ env.CONNECTED_COUNTRY }}
        run: |
          python << 'ENDPYTHON'
          import requests
          import os
          import re
          import time
          import random
          import json
          import subprocess
          from datetime import datetime, timezone

          SAMPLE_SIZE = int(os.getenv('SAMPLE_SIZE', '0'))
          CHECK_VODS = os.getenv('CHECK_VODS', 'false').lower() == 'true'
          CHECK_PPV = os.getenv('CHECK_PPV', 'false').lower() == 'true'
          CHECK_FAST = os.getenv('CHECK_FAST', 'false').lower() == 'true'
          COUNTRY = os.getenv('COUNTRY_CODE', 'uk').upper()
          CONNECTED_IP = os.getenv('CONNECTED_IP', 'Unknown')
          CONNECTED_ORG = os.getenv('CONNECTED_ORG', 'Unknown')
          CONNECTED_CITY = os.getenv('CONNECTED_CITY', 'Unknown')
          CONNECTED_COUNTRY = os.getenv('CONNECTED_COUNTRY', 'Unknown')

          class AlternatingVPNTester:
              def __init__(self):
                  self.start_time = time.time()
                  self.results = {}
                  self.history = self.load_history()

              def load_history(self):
                  history = {'tests': []}
                  try:
                      if os.path.exists('report.md'):
                          with open('report.md', 'r', encoding='utf-8') as f:
                              content = f.read()
                              match = re.search(r'<!-- HISTORY\n(.*?)\n-->', content, re.DOTALL)
                              if match:
                                  history = json.loads(match.group(1))
                  except Exception as e:
                      print(f"Could not load history: {e}")
                  return history

              def parse_m3u(self, path):
                  streams = []
                  try:
                      with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                          lines = f.readlines()
                      
                      for i in range(len(lines)):
                          if lines[i].startswith('#EXTINF'):
                              group_match = re.search(r'group-title="([^"]*)"', lines[i])
                              name = lines[i].split(',')[-1].strip() or f"Stream {len(streams)+1}"
                              
                              if i+1 < len(lines):
                                  url = lines[i+1].strip()
                                  if url and 'http' in url:
                                      streams.append({
                                          'name': name,
                                          'url': url,
                                          'group': group_match.group(1) if group_match else "Unknown"
                                      })
                  except Exception as e:
                      print(f"Parse error: {e}")
                  return streams

              def classify_stream(self, stream):
                  if stream['url'].endswith('#.mkv'):
                      return 'VOD'
                  
                  group_lower = stream['group'].lower()
                  name_lower = stream['name'].lower()
                  
                  if any(x in group_lower for x in ['ppv', 'events']) or \
                     any(x in name_lower for x in ['boxing', 'ufc', 'wwe']):
                      return 'PPV'
                  
                  if 'fast' in group_lower:
                      return 'FAST'
                  
                  return 'Channel'

              def should_skip(self, stream):
                  stream_type = self.classify_stream(stream)
                  
                  if stream_type == 'VOD' and not CHECK_VODS:
                      return True
                  if stream_type == 'PPV' and not CHECK_PPV:
                      return True
                  if stream_type == 'FAST' and not CHECK_FAST:
                      return True
                  
                  return False

              def get_filtered_streams(self):
                  all_streams = self.parse_m3u('channel playlist.m3u')
                  print(f"Total streams: {len(all_streams)}")
                  
                  filtered = [s for s in all_streams if not self.should_skip(s)]
                  
                  skipped = len(all_streams) - len(filtered)
                  if skipped > 0:
                      print(f"Filtered out {skipped} streams")
                  
                  print(f"After filtering: {len(filtered)} streams")
                  
                  if SAMPLE_SIZE > 0 and len(filtered) > SAMPLE_SIZE:
                      random.seed(42)
                      filtered = random.sample(filtered, SAMPLE_SIZE)
                      print(f"Sampled: {SAMPLE_SIZE} streams")
                  
                  return filtered

              def test_ffprobe(self, url, proxy=None):
                  """Test stream with ffprobe"""
                  cmd = ['ffprobe', '-v', 'error', '-show_entries', 'format=duration', 
                         '-of', 'default=noprint_wrappers=1:nokey=1', '-timeout', '10000000', url]
                  
                  if proxy:
                      cmd[2:2] = ['-http_proxy', proxy]
                  
                  try:
                      result = subprocess.run(cmd, capture_output=True, text=True, timeout=12)
                      
                      if result.returncode == 0:
                          return 'working'
                      
                      err = result.stderr.lower()
                      if '403' in err or 'forbidden' in err:
                          return 'geoblocked'
                      if '404' in err:
                          return 'notfound'
                      
                      return 'failed'
                  
                  except subprocess.TimeoutExpired:
                      return 'timeout'
                  except Exception as e:
                      return 'error'

              def test_location(self, location_name, use_vpn=False):
                  print(f"\n{'='*60}")
                  print(f"Testing: {location_name}")
                  print('='*60)
                  
                  proxy = 'http://localhost:8888' if use_vpn else None
                  
                  # Verify location
                  sess = requests.Session()
                  if proxy:
                      sess.proxies = {'http': proxy, 'https': proxy}
                  
                  print("\nVerifying connection...")
                  try:
                      info = sess.get('https://ipinfo.io/json', timeout=10).json()
                      print(f"  IP: {info.get('ip')}")
                      print(f"  Country: {info.get('country')}")
                      print(f"  City: {info.get('city')}")
                      print(f"  ISP: {info.get('org')}")
                  except Exception as e:
                      print(f"  Location check failed: {e}")
                      if use_vpn:
                          return None
                      info = {}
                  
                  streams = self.get_filtered_streams()
                  working, geoblocked, failed = [], [], []
                  
                  print(f"\nTesting {len(streams)} streams with ffprobe...\n")
                  
                  for i, stream in enumerate(streams):
                      print(f"[{i+1}/{len(streams)}] {stream['name'][:45]}... ", end='', flush=True)
                      
                      result = self.test_ffprobe(stream['url'], proxy)
                      
                      if result == 'working':
                          working.append(stream)
                          print("✅ OK")
                      elif result == 'geoblocked':
                          geoblocked.append(stream)
                          print("🔒 GEO")
                      else:
                          failed.append(stream)
                          print(f"❌ {result.upper()}")
                      
                      time.sleep(0.2)
                      
                      if (i+1) % 20 == 0:
                          rate = (len(working)/(i+1)*100)
                          print(f"  Progress: {len(working)}/{i+1} ({rate:.1f}%)")
                          time.sleep(random.uniform(1.5, 2.5))
                  
                  total = len(streams)
                  success_rate = (len(working)/total*100) if total > 0 else 0
                  
                  print(f"\n{location_name} Results:")
                  print(f"  Working: {len(working)}/{total} ({success_rate:.1f}%)")
                  print(f"  Geo-blocked: {len(geoblocked)}")
                  print(f"  Failed: {len(failed)}")
                  
                  return {
                      'working': working,
                      'geoblocked': geoblocked,
                      'failed': failed,
                      'rate': success_rate,
                      'location_info': info
                  }

              def generate_report(self):
                  duration = (time.time() - self.start_time) / 60
                  now = datetime.now(timezone.utc)
                  
                  # Add to history
                  entry = {
                      'date': now.strftime('%Y-%m-%d %H:%M UTC'),
                      'country': COUNTRY,
                      'ip': CONNECTED_IP,
                      'city': CONNECTED_CITY,
                      'isp': CONNECTED_ORG,
                      'config': f"S:{SAMPLE_SIZE if SAMPLE_SIZE > 0 else 'All'},V:{CHECK_VODS},P:{CHECK_PPV},F:{CHECK_FAST}",
                      'duration_min': round(duration, 1),
                      'results': {}
                  }
                  
                  for location, data in self.results.items():
                      total = len(data['working']) + len(data['geoblocked']) + len(data['failed'])
                      entry['results'][location] = {
                          'working': len(data['working']),
                          'geoblocked': len(data['geoblocked']),
                          'failed': len(data['failed']),
                          'total': total,
                          'rate': data['rate']
                      }
                  
                  self.history['tests'].append(entry)
                  if len(self.history['tests']) > 100:
                      self.history['tests'] = self.history['tests'][-100:]
                  
                  # Generate report
                  report = f"# Auto-Alternating VPN Stream Test Report\n\n"
                  report += f"**Last tested:** {COUNTRY}\n"
                  report += f"**Last update:** {now.strftime('%Y-%m-%d %H:%M UTC')}\n"
                  report += f"**Test duration:** {duration:.1f} minutes\n"
                  report += f"**Sample size:** {SAMPLE_SIZE if SAMPLE_SIZE > 0 else 'All streams'}\n"
                  report += f"**Configuration:** VODs={'Yes' if CHECK_VODS else 'No'}, PPV={'Yes' if CHECK_PPV else 'No'}, FAST={'Yes' if CHECK_FAST else 'No'}\n"
                  report += f"**Total historical tests:** {len(self.history['tests'])}\n\n"
                  
                  # Latest results
                  report += "## Latest Test Results\n\n"
                  report += "| Location | Working | Geo-blocked | Failed | Total | Success Rate |\n"
                  report += "|----------|---------|-------------|--------|-------|-------------|\n"
                  
                  for location, data in self.results.items():
                      loc_name = f"{COUNTRY} VPN" if location == 'vpn' else "Direct"
                      w = len(data['working'])
                      g = len(data['geoblocked'])
                      f = len(data['failed'])
                      total = w + g + f
                      report += f"| {loc_name} | {w} | {g} | {f} | {total} | **{data['rate']:.1f}%** |\n"
                  
                  report += "\n"
                  
                  # VPN connection details
                  if 'vpn' in self.results:
                      report += "## VPN Connection Details\n\n"
                      report += f"- **Country:** {CONNECTED_COUNTRY}\n"
                      report += f"- **City:** {CONNECTED_CITY}\n"
                      report += f"- **IP:** {CONNECTED_IP}\n"
                      report += f"- **ISP:** {CONNECTED_ORG}\n\n"
                  
                  # Historical analysis
                  uk_tests = [t for t in self.history['tests'] if t['country'] == 'UK']
                  us_tests = [t for t in self.history['tests'] if t['country'] == 'US']
                  
                  report += "## Historical Performance\n\n"
                  
                  if uk_tests:
                      uk_vpn_rates = [t['results'].get('vpn', {}).get('rate', 0) for t in uk_tests]
                      uk_avg = sum(uk_vpn_rates) / len(uk_vpn_rates) if uk_vpn_rates else 0
                      uk_last = uk_vpn_rates[-1] if uk_vpn_rates else 0
                      
                      report += f"**UK VPN** ({len(uk_tests)} tests)\n"
                      report += f"- Average: {uk_avg:.1f}%\n"
                      report += f"- Latest: {uk_last:.1f}%\n"
                      if uk_vpn_rates:
                          report += f"- Range: {min(uk_vpn_rates):.1f}% - {max(uk_vpn_rates):.1f}%\n"
                      report += "\n"
                  
                  if us_tests:
                      us_vpn_rates = [t['results'].get('vpn', {}).get('rate', 0) for t in us_tests]
                      us_avg = sum(us_vpn_rates) / len(us_vpn_rates) if us_vpn_rates else 0
                      us_last = us_vpn_rates[-1] if us_vpn_rates else 0
                      
                      report += f"**US VPN** ({len(us_tests)} tests)\n"
                      report += f"- Average: {us_avg:.1f}%\n"
                      report += f"- Latest: {us_last:.1f}%\n"
                      if us_vpn_rates:
                          report += f"- Range: {min(us_vpn_rates):.1f}% - {max(us_vpn_rates):.1f}%\n"
                      report += "\n"
                  
                  if uk_tests and us_tests:
                      uk_avg = sum(t['results'].get('vpn', {}).get('rate', 0) for t in uk_tests) / len(uk_tests)
                      us_avg = sum(t['results'].get('vpn', {}).get('rate', 0) for t in us_tests) / len(us_tests)
                      
                      report += "**Comparison:**\n"
                      if uk_avg > us_avg:
                          report += f"- UK VPN performs {uk_avg-us_avg:.1f}% better on average\n"
                      elif us_avg > uk_avg:
                          report += f"- US VPN performs {us_avg-uk_avg:.1f}% better on average\n"
                      else:
                          report += f"- Both locations perform equally\n"
                      report += "\n"
                  
                  # VPN effectiveness
                  if 'direct' in self.results and 'vpn' in self.results:
                      vpn_improvement = self.results['vpn']['rate'] - self.results['direct']['rate']
                      report += f"**Latest VPN Impact:** {vpn_improvement:+.1f}% vs direct connection\n\n"
                  
                  # Recent history table
                  report += "## Recent Test History\n\n"
                  report += "| Date | Country | VPN Success | Direct Success | Impact | Duration |\n"
                  report += "|------|---------|-------------|----------------|--------|----------|\n"
                  
                  for test in self.history['tests'][-20:]:
                      vpn_rate = test['results'].get('vpn', {}).get('rate', 0)
                      direct_rate = test['results'].get('direct', {}).get('rate', 0)
                      impact = f"{vpn_rate-direct_rate:+.1f}%" if direct_rate > 0 else "N/A"
                      duration = test.get('duration_min', 0)
                      
                      report += f"| {test['date']} | {test['country']} | {vpn_rate:.1f}% | {direct_rate:.1f}% | {impact} | {duration}min |\n"
                  
                  report += "\n"
                  
                  # Working streams sample
                  if 'vpn' in self.results and self.results['vpn']['working']:
                      report += f"## Working Streams Sample ({len(self.results['vpn']['working'])} total)\n\n"
                      
                      by_group = {}
                      for stream in self.results['vpn']['working']:
                          group = stream.get('group', 'Unknown')
                          if group not in by_group:
                              by_group[group] = []
                          by_group[group].append(stream['name'])
                      
                      for group in sorted(by_group.keys())[:10]:
                          streams = by_group[group]
                          report += f"**{group}** ({len(streams)})\n"
                          for name in streams[:5]:
                              report += f"- {name}\n"
                          if len(streams) > 5:
                              report += f"- ... and {len(streams)-5} more\n"
                          report += "\n"
                  
                  # Geo-blocked
                  if 'vpn' in self.results and self.results['vpn']['geoblocked']:
                      report += f"## Geo-blocked Streams ({len(self.results['vpn']['geoblocked'])})\n\n"
                      for stream in self.results['vpn']['geoblocked'][:10]:
                          report += f"- {stream['name']} ({stream['group']})\n"
                      if len(self.results['vpn']['geoblocked']) > 10:
                          report += f"- ... and {len(self.results['vpn']['geoblocked'])-10} more\n"
                      report += "\n"
                  
                  # Next test
                  next_country = "US" if COUNTRY == "UK" else "UK"
                  report += f"## Next Test\n\n"
                  report += f"Next automatic test will use **{next_country} VPN**\n\n"
                  
                  report += "---\n"
                  report += f"*Report generated at {now.strftime('%Y-%m-%d %H:%M UTC')}*\n"
                  report += f"*Auto-alternates between UK and US ProtonVPN using ffprobe validation*\n\n"
                  
                  report += f"<!-- HISTORY\n{json.dumps(self.history, indent=2)}\n-->\n"
                  
                  return report

              def run(self):
                  print(f"{'='*60}")
                  print(f"Auto-Alternating VPN Stream Test")
                  print(f"Testing: {COUNTRY} VPN")
                  print(f"Method: ffprobe through VPN proxy")
                  print(f"{'='*60}\n")
                  
                  # Test direct
                  direct = self.test_location("Direct Connection", use_vpn=False)
                  if direct:
                      self.results['direct'] = direct
                  
                  # Test VPN
                  vpn = self.test_location(f"{COUNTRY} ProtonVPN", use_vpn=True)
                  if vpn:
                      self.results['vpn'] = vpn
                  
                  # Generate report
                  print("\nGenerating comprehensive report...")
                  report = self.generate_report()
                  
                  with open('report.md', 'w', encoding='utf-8') as f:
                      f.write(report)
                  
                  duration = (time.time() - self.start_time) / 60
                  print(f"\n{'='*60}")
                  print(f"Test Complete - {duration:.1f} minutes")
                  print('='*60)
                  
                  for location, data in self.results.items():
                      loc_name = f"{COUNTRY} VPN" if location == 'vpn' else "Direct"
                      total = len(data['working']) + len(data['geoblocked']) + len(data['failed'])
                      print(f"{loc_name:20}: {len(data['working'])}/{total} ({data['rate']:.1f}%)")

          tester = AlternatingVPNTester()
          tester.run()
          ENDPYTHON

      - name: Cleanup
        if: always()
        run: |
          docker stop gluetun || true
          docker rm gluetun || true
          docker network rm vpn-network || true

      - name: Commit Report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          
          if [[ -f "report.md" ]]; then
            git add report.md
            git pull origin main --rebase || true
            
            if ! git diff --staged --quiet; then
              RATE=$(grep -oE "\*\*[0-9.]+%" report.md | grep -oE "[0-9.]+" | head -1 || echo "0")
              
              git commit -m "${{ env.COUNTRY_CODE }} VPN test: ${RATE}% - $(date -u '+%m/%d %H:%M')"
              git push origin main
            fi
          fi
