name: VPN Stream Test (Unified - ffprobe/Browser Toggle)

on:
  workflow_dispatch:
    inputs:
      test_method:
        description: 'Test method'
        required: true
        default: 'ffprobe'
        type: choice
        options:
          - ffprobe
          - browser
          - hybrid
      test_scope:
        description: 'Test scope'
        required: true
        default: 'direct_only'
        type: choice
        options:
          - direct_only
          - direct_and_vpn
      sample_size:
        description: 'Sample size (0=all streams)'
        required: false
        default: '0'
        type: string
      check_vods:
        description: 'Check VOD files (URLs ending with #.mkv)'
        required: false
        default: false
        type: boolean
      check_ppv:
        description: 'Check PPV channels (may be offline)'
        required: false
        default: false
        type: boolean
      check_fast:
        description: 'Check FAST channels'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '15 1,7,13,19 * * *'

permissions:
  contents: write

jobs:
  unified-vpn-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pysocks
          
          # Install method-specific dependencies
          METHOD="${{ github.event.inputs.test_method || 'ffprobe' }}"
          
          if [ "$METHOD" = "browser" ] || [ "$METHOD" = "hybrid" ]; then
            echo "Installing Playwright for browser testing..."
            pip install playwright
            playwright install chromium
            playwright install-deps
          fi
          
          if [ "$METHOD" = "ffprobe" ] || [ "$METHOD" = "hybrid" ]; then
            echo "Installing ffmpeg for ffprobe testing..."
            sudo apt-get update
            sudo apt-get install -y ffmpeg dante-client
            ffprobe -version
            
            # Verify SOCKS proxy support
            echo "Checking SOCKS proxy support..."
            which socksify || echo "Warning: socksify not found"
          fi

      - name: Determine next VPN country (auto-alternating)
        run: |
          echo "Checking last test location..."
          if [ -f "report.md" ]; then
            # FIXED: Extract from JSON history instead of markdown header
            LAST=$(grep -A 1000 "<!-- HISTORY" report.md | grep '"country"' | tail -1 | grep -oP '(UK|US)' || echo "US")
            echo "Last test was: $LAST"
          else
            LAST="US"
            echo "No previous report, defaulting to US as last"
          fi
          
          if [ "$LAST" = "UK" ]; then
            echo "COUNTRY_CODE=us" >> $GITHUB_ENV
            echo "COUNTRY_NAME=United States" >> $GITHUB_ENV
            echo "✅ Next test: US (alternating from UK)"
          else
            echo "COUNTRY_CODE=uk" >> $GITHUB_ENV
            echo "COUNTRY_NAME=United Kingdom" >> $GITHUB_ENV
            echo "✅ Next test: UK (alternating from US)"
          fi

      - name: Start ProtonVPN via Gluetun
        if: github.event.inputs.test_scope == 'direct_and_vpn' || github.event_name == 'schedule'
        run: |
          docker network create vpn-network || true
          
          echo "Starting Gluetun with ProtonVPN (${{ env.COUNTRY_NAME }})..."
          docker run -d \
            --name gluetun \
            --cap-add=NET_ADMIN \
            --device /dev/net/tun \
            --network vpn-network \
            -p 8888:8888 \
            -p 1080:1080 \
            -e VPN_SERVICE_PROVIDER=protonvpn \
            -e OPENVPN_USER="${{ secrets.VPN_USER }}" \
            -e OPENVPN_PASSWORD="${{ secrets.VPN_PASSWORD }}" \
            -e SERVER_COUNTRIES="${{ env.COUNTRY_NAME }}" \
            -e FREE_ONLY=off \
            -e LOG_LEVEL=info \
            -e HTTPPROXY=on \
            -e HTTPPROXY_LISTENING_ADDRESS=:8888 \
            -e SHADOWSOCKS=on \
            -e SHADOWSOCKS_LISTENING_ADDRESS=:1080 \
            qmcgaw/gluetun:latest
          
          echo "Waiting for initial connection..."
          sleep 30

      - name: Verify VPN Connection
        if: github.event.inputs.test_scope == 'direct_and_vpn' || github.event_name == 'schedule'
        run: |
          echo "=== VPN Connection Verification ==="
          
          VPN_SUCCESS=false
          
          for i in {1..20}; do
            echo "Verification attempt $i/20..."
            sleep 10
            
            if curl -x localhost:8888 -s --connect-timeout 10 https://ipinfo.io/json > /tmp/vpn.json 2>/dev/null; then
              COUNTRY=$(jq -r '.country' /tmp/vpn.json 2>/dev/null || echo "Unknown")
              IP=$(jq -r '.ip' /tmp/vpn.json 2>/dev/null || echo "Unknown")
              ORG=$(jq -r '.org' /tmp/vpn.json 2>/dev/null || echo "Unknown")
              CITY=$(jq -r '.city' /tmp/vpn.json 2>/dev/null || echo "Unknown")
              
              echo "  IP: $IP"
              echo "  Country: $COUNTRY"
              echo "  City: $CITY"
              echo "  ISP: $ORG"
              
              if [[ "$COUNTRY" != "null" && "$COUNTRY" != "Unknown" && "$IP" != "Unknown" ]]; then
                echo "✅ VPN connection successful!"
                echo "VPN_READY=true" >> $GITHUB_ENV
                echo "CONNECTED_IP=$IP" >> $GITHUB_ENV
                echo "CONNECTED_ORG=$ORG" >> $GITHUB_ENV
                echo "CONNECTED_CITY=$CITY" >> $GITHUB_ENV
                echo "CONNECTED_COUNTRY=$COUNTRY" >> $GITHUB_ENV
                
                VPN_SUCCESS=true
                break
              fi
            fi
          done
          
          if [[ "$VPN_SUCCESS" != "true" ]]; then
            echo "❌ VPN connection failed"
            docker logs gluetun --tail 50
            exit 1
          fi

      - name: Run Unified Stream Tests
        env:
          TEST_METHOD: ${{ github.event.inputs.test_method || 'ffprobe' }}
          TEST_SCOPE: ${{ github.event.inputs.test_scope || 'direct_only' }}
          SAMPLE_SIZE: ${{ github.event.inputs.sample_size || '0' }}
          CHECK_VODS: ${{ github.event.inputs.check_vods || 'false' }}
          CHECK_PPV: ${{ github.event.inputs.check_ppv || 'false' }}
          CHECK_FAST: ${{ github.event.inputs.check_fast || 'false' }}
          COUNTRY_CODE: ${{ env.COUNTRY_CODE }}
          CONNECTED_IP: ${{ env.CONNECTED_IP }}
          CONNECTED_ORG: ${{ env.CONNECTED_ORG }}
          CONNECTED_CITY: ${{ env.CONNECTED_CITY }}
          CONNECTED_COUNTRY: ${{ env.CONNECTED_COUNTRY }}
        run: |
          python << 'ENDPYTHON'
          import requests
          import os
          import re
          import time
          import random
          import json
          import subprocess
          from datetime import datetime, timezone

          # Import Playwright only if needed
          TEST_METHOD = os.getenv('TEST_METHOD', 'ffprobe')
          TEST_SCOPE = os.getenv('TEST_SCOPE', 'direct_only')
          if TEST_METHOD in ['browser', 'hybrid']:
              from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeout

          SAMPLE_SIZE = int(os.getenv('SAMPLE_SIZE', '0'))
          CHECK_VODS = os.getenv('CHECK_VODS', 'false').lower() == 'true'
          CHECK_PPV = os.getenv('CHECK_PPV', 'false').lower() == 'true'
          CHECK_FAST = os.getenv('CHECK_FAST', 'false').lower() == 'true'
          COUNTRY = os.getenv('COUNTRY_CODE', 'uk').upper()
          CONNECTED_IP = os.getenv('CONNECTED_IP', 'Unknown')
          CONNECTED_ORG = os.getenv('CONNECTED_ORG', 'Unknown')
          CONNECTED_CITY = os.getenv('CONNECTED_CITY', 'Unknown')
          CONNECTED_COUNTRY = os.getenv('CONNECTED_COUNTRY', 'Unknown')

          class UnifiedVPNTester:
              def __init__(self):
                  self.start_time = time.time()
                  self.results = {}
                  self.history = self.load_history()
                  self.test_method = TEST_METHOD
                  self.test_scope = TEST_SCOPE

              def load_history(self):
                  history = {'tests': []}
                  try:
                      if os.path.exists('report.md'):
                          with open('report.md', 'r', encoding='utf-8') as f:
                              content = f.read()
                              match = re.search(r'<!-- HISTORY\n(.*?)\n-->', content, re.DOTALL)
                              if match:
                                  history = json.loads(match.group(1))
                  except Exception as e:
                      print(f"Could not load history: {e}")
                  return history

              def parse_m3u(self, path):
                  streams = []
                  try:
                      with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                          lines = f.readlines()
                      
                      for i in range(len(lines)):
                          if lines[i].startswith('#EXTINF'):
                              group_match = re.search(r'group-title="([^"]*)"', lines[i])
                              name = lines[i].split(',')[-1].strip() or f"Stream {len(streams)+1}"
                              
                              if i+1 < len(lines):
                                  url = lines[i+1].strip()
                                  if url and 'http' in url:
                                      streams.append({
                                          'name': name,
                                          'url': url,
                                          'group': group_match.group(1) if group_match else "Unknown"
                                      })
                  except Exception as e:
                      print(f"Parse error: {e}")
                  return streams

              def classify_stream(self, stream):
                  if stream['url'].endswith('#.mkv'):
                      return 'VOD'
                  
                  group_lower = stream['group'].lower()
                  name_lower = stream['name'].lower()
                  
                  if any(x in group_lower for x in ['ppv', 'events']) or \
                     any(x in name_lower for x in ['boxing', 'ufc', 'wwe']):
                      return 'PPV'
                  
                  if 'fast' in group_lower:
                      return 'FAST'
                  
                  return 'Channel'

              def should_skip(self, stream):
                  stream_type = self.classify_stream(stream)
                  
                  if stream_type == 'VOD' and not CHECK_VODS:
                      return True
                  if stream_type == 'PPV' and not CHECK_PPV:
                      return True
                  if stream_type == 'FAST' and not CHECK_FAST:
                      return True
                  
                  return False

              def get_filtered_streams(self):
                  all_streams = self.parse_m3u('channel playlist.m3u')
                  print(f"Total streams: {len(all_streams)}")
                  
                  filtered = [s for s in all_streams if not self.should_skip(s)]
                  
                  skipped = len(all_streams) - len(filtered)
                  if skipped > 0:
                      print(f"Filtered out {skipped} streams")
                  
                  print(f"After filtering: {len(filtered)} streams")
                  
                  if SAMPLE_SIZE > 0 and len(filtered) > SAMPLE_SIZE:
                      random.seed(42)
                      filtered = random.sample(filtered, SAMPLE_SIZE)
                      print(f"Sampled: {SAMPLE_SIZE} streams")
                  
                  return filtered

              # ==================== FFPROBE METHOD ====================
              def test_ffprobe(self, url, proxy=None):
                  """Test stream with ffprobe - using SOCKS5 proxy for better SSL/TLS handling"""
                  
                  # Build ffprobe command with SOCKS5 support
                  # SOCKS5 works at TCP level and doesn't interfere with SSL/TLS
                  cmd = ['ffprobe', '-v', 'error', '-show_entries', 'format=duration', 
                         '-of', 'default=noprint_wrappers=1:nokey=1', 
                         '-timeout', '30000000', '-analyzeduration', '5000000', 
                         '-probesize', '5000000']
                  
                  if proxy:
                      # Use ALL_PROXY for SOCKS5 support in ffmpeg/ffprobe
                      env = os.environ.copy()
                      env['ALL_PROXY'] = 'socks5://localhost:1080'
                      env['all_proxy'] = 'socks5://localhost:1080'
                      cmd.append(url)
                  else:
                      env = None
                      cmd.append(url)
                  
                  try:
                      result = subprocess.run(cmd, capture_output=True, text=True, timeout=45, env=env)
                      
                      if result.returncode == 0:
                          return 'working', None
                      
                      err = result.stderr.lower()
                      
                      # Comprehensive error detection
                      if '403' in err or 'forbidden' in err:
                          return 'geoblocked', 'HTTP 403 Forbidden'
                      if '401' in err or 'unauthorized' in err:
                          return 'geoblocked', 'HTTP 401 Unauthorized'
                      if '451' in err:
                          return 'geoblocked', 'HTTP 451 Legal/Geo Restriction'
                      if '404' in err or 'not found' in err:
                          return 'notfound', 'HTTP 404 Not Found'
                      if '400' in err or 'bad request' in err:
                          return 'failed', 'HTTP 400 Bad Request'
                      if '406' in err or 'not acceptable' in err:
                          return 'failed', 'HTTP 406 Not Acceptable'
                      if '410' in err or 'gone' in err:
                          return 'failed', 'HTTP 410 Gone'
                      if 'connection refused' in err or 'could not connect' in err:
                          return 'connection_error', 'Connection refused'
                      if 'socks' in err or 'proxy' in err or 'tunnel' in err:
                          return 'proxy_error', f'SOCKS5 proxy error'
                      if 'timed out' in err or 'timeout' in err:
                          return 'timeout', 'Connection timeout'
                      if 'ssl' in err or 'certificate' in err or 'tls' in err:
                          return 'failed', 'SSL/TLS error'
                      if 'invalid data' in err or 'invalid' in err:
                          return 'failed', 'Invalid stream data'
                      if 'server returned' in err and '5' in err:
                          return 'failed', 'Server error (5xx)'
                      
                      first_error = err.split('\n')[0][:100] if err else 'Unknown error'
                      return 'failed', first_error
                  
                  except subprocess.TimeoutExpired:
                      return 'timeout', 'Process timeout (45s)'
                  except Exception as e:
                      return 'error', str(e)[:100]

              # ==================== BROWSER METHOD ====================
              def test_browser(self, browser, url, use_proxy=False):
                  """Test stream in headless browser with video.js"""
                  context_options = {
                      'user_agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                      'viewport': {'width': 1280, 'height': 720},
                      'ignore_https_errors': True
                  }
                  
                  if use_proxy:
                      context_options['proxy'] = {'server': 'http://localhost:8888'}
                  
                  try:
                      context = browser.new_context(**context_options)
                      page = context.new_page()
                      
                      # Set longer page timeout
                      page.set_default_timeout(25000)  # 25 seconds
                      
                      html_content = f'''
                      <!DOCTYPE html>
                      <html>
                      <head>
                          <style>body {{ margin: 0; background: #000; }}</style>
                      </head>
                      <body>
                          <video id="player" width="640" height="360" controls autoplay muted></video>
                          <div id="status">loading</div>
                          <script>
                              var video = document.getElementById('player');
                              var status = document.getElementById('status');
                              var startTime = Date.now();
                              
                              // Try to load the stream
                              video.src = "{url}";
                              
                              video.addEventListener('loadstart', function() {{
                                  console.log('Load started');
                                  status.textContent = 'loadstart';
                              }});
                              
                              video.addEventListener('loadedmetadata', function() {{
                                  console.log('Metadata loaded');
                                  status.textContent = 'metadata_loaded';
                              }});
                              
                              video.addEventListener('loadeddata', function() {{
                                  console.log('Data loaded');
                                  status.textContent = 'data_loaded';
                              }});
                              
                              video.addEventListener('canplay', function() {{
                                  console.log('Can play');
                                  status.textContent = 'can_play';
                              }});
                              
                              video.addEventListener('playing', function() {{
                                  console.log('Playing');
                                  status.textContent = 'playing';
                              }});
                              
                              video.addEventListener('error', function(e) {{
                                  console.error('Video error:', e);
                                  var err = video.error;
                                  if (err) {{
                                      var code = err.code;
                                      var msg = err.message || '';
                                      
                                      // Try to extract HTTP error codes from message
                                      if (msg.includes('403') || code === 2) {{
                                          status.textContent = 'error_403';
                                      }} else if (msg.includes('404') || code === 4) {{
                                          status.textContent = 'error_404';
                                      }} else if (msg.includes('401')) {{
                                          status.textContent = 'error_401';
                                      }} else {{
                                          status.textContent = 'error_' + code + '_' + msg.substring(0, 50);
                                      }}
                                  }} else {{
                                      status.textContent = 'error_unknown';
                                  }}
                              }});
                              
                              // Timeout after 20 seconds if nothing happens
                              setTimeout(function() {{
                                  if (status.textContent === 'loading' || status.textContent === 'loadstart') {{
                                      status.textContent = 'timeout';
                                  }}
                              }}, 20000);
                          </script>
                      </body>
                      </html>
                      '''
                      
                      page.set_content(html_content)
                      
                      # Wait up to 25 seconds for the stream to start or error
                      max_checks = 50  # 25 seconds (0.5s * 50)
                      for i in range(max_checks):
                          time.sleep(0.5)
                          
                          try:
                              status = page.evaluate('document.getElementById("status").textContent')
                          except Exception:
                              # Page might have crashed
                              context.close()
                              return 'error', 'Page evaluation failed'
                          
                          # Success states
                          if status in ['playing', 'can_play', 'data_loaded', 'metadata_loaded']:
                              context.close()
                              return 'working', f'Stream playable ({status})'
                          
                          # Error states
                          if status.startswith('error_'):
                              context.close()
                              
                              if '403' in status:
                                  return 'geoblocked', 'HTTP 403 Forbidden'
                              elif '404' in status:
                                  return 'failed', 'HTTP 404 Not Found'
                              elif '401' in status:
                                  return 'geoblocked', 'HTTP 401 Unauthorized'
                              else:
                                  error_detail = status.replace('error_', '')[:80]
                                  return 'failed', f'Video error: {error_detail}'
                          
                          # Explicit timeout
                          if status == 'timeout':
                              context.close()
                              return 'timeout', 'No response in 20s'
                      
                      # If we got here, we ran out of checks
                      context.close()
                      return 'timeout', 'Stream did not load in 25s'
                  
                  except PlaywrightTimeout:
                      return 'timeout', 'Playwright timeout'
                  except Exception as e:
                      return 'error', str(e)[:100]

              def test_location(self, location_name, use_vpn=False):
                  print(f"\n{'='*60}")
                  print(f"Testing: {location_name}")
                  print(f"Method: {self.test_method.upper()}")
                  print('='*60)
                  
                  proxy = 'http://localhost:8888' if use_vpn else None
                  
                  # Verify location
                  sess = requests.Session()
                  if proxy:
                      sess.proxies = {'http': proxy, 'https': proxy}
                  
                  print("\nVerifying connection...")
                  try:
                      info = sess.get('https://ipinfo.io/json', timeout=10).json()
                      print(f"  IP: {info.get('ip')}")
                      print(f"  Country: {info.get('country')}")
                      print(f"  City: {info.get('city')}")
                      print(f"  ISP: {info.get('org')}")
                  except Exception as e:
                      print(f"  ❌ Location check failed: {e}")
                      
                      # FIXED: Fail for both direct and VPN if connection check fails
                      if use_vpn:
                          print("  ⚠️  VPN connection verification failed, aborting VPN test")
                          return None
                      else:
                          print("  ⚠️  Direct connection verification failed")
                          print("  ⚠️  This indicates network issues on the runner")
                          print("  ⚠️  Results will be unreliable, but continuing anyway...")
                      info = {}
                  
                  streams = self.get_filtered_streams()
                  working, geoblocked, failed = [], [], []
                  connection_errors = 0
                  timeouts = 0
                  proxy_errors = 0
                  error_samples = {}
                  
                  print(f"\nTesting {len(streams)} streams...\n")
                  
                  # Choose testing method
                  if self.test_method == 'ffprobe':
                      # FFPROBE METHOD
                      for i, stream in enumerate(streams):
                          print(f"[{i+1}/{len(streams)}] {stream['name'][:45]}... ", end='', flush=True)
                          
                          result, error_msg = self.test_ffprobe(stream['url'], proxy)
                          
                          if result == 'working':
                              working.append(stream)
                              print("✅ OK")
                          elif result == 'geoblocked':
                              geoblocked.append(stream)
                              print(f"🔒 GEO")
                          elif result == 'timeout':
                              failed.append(stream)
                              timeouts += 1
                              print("⏱️  TIMEOUT")
                          elif result == 'connection_error':
                              failed.append(stream)
                              connection_errors += 1
                              print("🔌 CONN_ERR")
                          elif result == 'proxy_error':
                              failed.append(stream)
                              proxy_errors += 1
                              print("🔧 PROXY_ERR")
                          else:
                              failed.append(stream)
                              print(f"❌ {result.upper()}")
                          
                          if error_msg and error_msg not in error_samples:
                              error_samples[error_msg] = 0
                          if error_msg:
                              error_samples[error_msg] += 1
                          
                          time.sleep(0.2)
                          
                          if (i+1) % 20 == 0:
                              rate = (len(working)/(i+1)*100)
                              print(f"  Progress: {len(working)}/{i+1} ({rate:.1f}%)")
                  
                  elif self.test_method == 'browser':
                      # BROWSER METHOD
                      with sync_playwright() as p:
                          browser = p.chromium.launch(headless=True)
                          
                          for i, stream in enumerate(streams):
                              print(f"[{i+1}/{len(streams)}] {stream['name'][:40]}... ", end='', flush=True)
                              
                              result, error_msg = self.test_browser(browser, stream['url'], use_vpn)
                              
                              if result == 'working':
                                  working.append(stream)
                                  print("✅ OK")
                              elif result == 'geoblocked':
                                  geoblocked.append(stream)
                                  print("🔒 GEO")
                              elif result == 'timeout':
                                  failed.append(stream)
                                  timeouts += 1
                                  print("⏱️  TIMEOUT")
                              else:
                                  failed.append(stream)
                                  print(f"❌ {result.upper()}")
                              
                              if error_msg and error_msg not in error_samples:
                                  error_samples[error_msg] = 0
                              if error_msg:
                                  error_samples[error_msg] += 1
                              
                              time.sleep(0.5)
                              
                              if (i+1) % 10 == 0:
                                  rate = (len(working)/(i+1)*100)
                                  print(f"  Progress: {len(working)}/{i+1} ({rate:.1f}%)")
                          
                          browser.close()
                  
                  elif self.test_method == 'hybrid':
                      # HYBRID METHOD: ffprobe first, then browser verification
                      print("Phase 1: Quick ffprobe scan...")
                      suspicious = []
                      
                      for i, stream in enumerate(streams):
                          result, error_msg = self.test_ffprobe(stream['url'], proxy)
                          
                          if result == 'working':
                              working.append(stream)
                          elif result == 'geoblocked':
                              geoblocked.append(stream)
                          else:
                              suspicious.append((stream, error_msg))  # Store with error message
                          
                          if (i+1) % 50 == 0:
                              print(f"  Scanned: {i+1}/{len(streams)}")
                      
                      print(f"\nPhase 1 complete: {len(working)} working, {len(geoblocked)} blocked, {len(suspicious)} suspicious")
                      print(f"\nPhase 2: Browser verification of {min(len(suspicious), 50)} suspicious streams...")
                      
                      # Verify up to 50 suspicious streams with browser
                      with sync_playwright() as p:
                          browser = p.chromium.launch(headless=True)
                          
                          for i, (stream, ffprobe_error) in enumerate(suspicious[:50]):
                              print(f"[{i+1}/{len(suspicious[:50])}] {stream['name'][:40]}... ", end='', flush=True)
                              
                              result, error_msg = self.test_browser(browser, stream['url'], use_vpn)
                              
                              if result == 'working':
                                  working.append(stream)
                                  print("✅ OK (browser)")
                              elif result == 'geoblocked':
                                  geoblocked.append(stream)
                                  print("🔒 GEO (browser)")
                              else:
                                  failed.append(stream)
                                  print(f"❌ {result.upper()}")
                                  if error_msg:
                                      if error_msg not in error_samples:
                                          error_samples[error_msg] = 0
                                      error_samples[error_msg] += 1
                          
                          browser.close()
                      
                      # FIXED: Handle remaining suspicious streams properly
                      if len(suspicious) > 50:
                          skipped_count = len(suspicious) - 50
                          print(f"\n⚠️  {skipped_count} streams skipped browser verification (sample limit)")
                          
                          skip_msg = 'Skipped browser verification (sample limit)'
                          error_samples[skip_msg] = skipped_count
                          
                          # Add skipped streams to failed with proper tracking
                          for stream, ffprobe_error in suspicious[50:]:
                              failed.append(stream)
                              # Also track the original ffprobe error
                              if ffprobe_error:
                                  if ffprobe_error not in error_samples:
                                      error_samples[ffprobe_error] = 0
                                  error_samples[ffprobe_error] += 1
                  
                  total = len(streams)
                  success_rate = (len(working)/total*100) if total > 0 else 0
                  
                  print(f"\n{location_name} Results:")
                  print(f"  Working: {len(working)}/{total} ({success_rate:.1f}%)")
                  print(f"  Geo-blocked: {len(geoblocked)}")
                  print(f"  Failed: {len(failed)}")
                  
                  if error_samples:
                      print(f"\n  Top Errors:")
                      for err_type, count in sorted(error_samples.items(), key=lambda x: x[1], reverse=True)[:5]:
                          print(f"    - {err_type[:60]}: {count}x")
                  
                  return {
                      'working': working,
                      'geoblocked': geoblocked,
                      'failed': failed,
                      'rate': success_rate,
                      'location_info': info,
                      'timeouts': timeouts,
                      'connection_errors': connection_errors,
                      'proxy_errors': proxy_errors,
                      'error_samples': error_samples
                  }

              def generate_report(self):
                  duration = (time.time() - self.start_time) / 60
                  now = datetime.now(timezone.utc)
                  
                  # Add current test to history
                  entry = {
                      'date': now.strftime('%Y-%m-%d %H:%M UTC'),
                      'country': COUNTRY,
                      'method': self.test_method,
                      'scope': self.test_scope,
                      'ip': CONNECTED_IP,
                      'city': CONNECTED_CITY,
                      'isp': CONNECTED_ORG,
                      'config': f"S:{SAMPLE_SIZE if SAMPLE_SIZE > 0 else 'All'},V:{CHECK_VODS},P:{CHECK_PPV},F:{CHECK_FAST}",
                      'duration_min': round(duration, 1),
                      'results': {}
                  }
                  
                  for location, data in self.results.items():
                      total = len(data['working']) + len(data['geoblocked']) + len(data['failed'])
                      entry['results'][location] = {
                          'working': len(data['working']),
                          'geoblocked': len(data['geoblocked']),
                          'failed': len(data['failed']),
                          'total': total,
                          'rate': data['rate']
                      }
                  
                  self.history['tests'].append(entry)
                  if len(self.history['tests']) > 100:
                      self.history['tests'] = self.history['tests'][-100:]
                  
                  report = f"# VPN Stream Test Report\n\n"
                  report += f"**Last tested:** {COUNTRY}\n"
                  report += f"**Test method:** {self.test_method}\n"
                  report += f"**Test scope:** {self.test_scope}\n"
                  report += f"**Last update:** {now.strftime('%Y-%m-%d %H:%M UTC')}\n"
                  report += f"**Test duration:** {duration:.1f} minutes\n"
                  report += f"**Sample size:** {SAMPLE_SIZE if SAMPLE_SIZE > 0 else 'All streams'}\n"
                  report += f"**Configuration:** VODs={'Yes' if CHECK_VODS else 'No'}, PPV={'Yes' if CHECK_PPV else 'No'}, FAST={'Yes' if CHECK_FAST else 'No'}\n\n"
                  
                  report += "## Latest Test Results\n\n"
                  report += "| Location | Working | Geo-blocked | Failed | Total | Success Rate |\n"
                  report += "|----------|---------|-------------|--------|-------|--------------|\n"
                  
                  for location, data in self.results.items():
                      loc_name = f"{COUNTRY} VPN" if location == 'vpn' else "Direct"
                      w = len(data['working'])
                      g = len(data['geoblocked'])
                      f = len(data['failed'])
                      total = w + g + f
                      report += f"| {loc_name} | {w} | {g} | {f} | {total} | **{data['rate']:.1f}%** |\n"
                  
                  report += "\n"
                  
                  # VPN connection details only if VPN was tested
                  if 'vpn' in self.results:
                      report += "## VPN Connection Details\n\n"
                      report += f"- **Country:** {CONNECTED_COUNTRY}\n"
                      report += f"- **City:** {CONNECTED_CITY}\n"
                      report += f"- **IP:** {CONNECTED_IP}\n"
                      report += f"- **ISP:** {CONNECTED_ORG}\n\n"
                  
                  # Error analysis for the tested connection (VPN if available, otherwise direct)
                  test_type = 'vpn' if 'vpn' in self.results else 'direct'
                  if test_type in self.results and self.results[test_type].get('error_samples'):
                      report += "## Error Analysis\n\n"
                      for err, count in sorted(self.results[test_type]['error_samples'].items(), 
                                             key=lambda x: x[1], reverse=True)[:10]:
                          report += f"- **{err}**: {count} occurrences\n"
                      report += "\n"
                  
                  if 'direct' in self.results and 'vpn' in self.results:
                      vpn_improvement = self.results['vpn']['rate'] - self.results['direct']['rate']
                      report += f"**VPN Impact:** {vpn_improvement:+.1f}% vs direct connection\n\n"
                  
                  # Working streams
                  if test_type in self.results and self.results[test_type]['working']:
                      title = f"Working Streams via {COUNTRY} VPN" if test_type == 'vpn' else "Working Streams (Direct)"
                      report += f"## {title} ({len(self.results[test_type]['working'])} total)\n\n"
                      
                      by_group = {}
                      for stream in self.results[test_type]['working']:
                          group = stream.get('group', 'Unknown')
                          if group not in by_group:
                              by_group[group] = []
                          by_group[group].append(stream['name'])
                      
                      for group in sorted(by_group.keys())[:10]:
                          streams = by_group[group]
                          report += f"**{group}** ({len(streams)})\n"
                          for name in streams[:5]:
                              report += f"- {name}\n"
                          if len(streams) > 5:
                              report += f"- ... and {len(streams)-5} more\n"
                          report += "\n"
                  
                  next_country = "US" if COUNTRY == "UK" else "UK"
                  report += f"## Next Test\n\n"
                  if self.test_scope == 'direct_and_vpn':
                      report += f"Next automatic test will use **{next_country} VPN**\n\n"
                  else:
                      report += f"Testing in direct-only mode. Next VPN test would use **{next_country}**\n\n"
                  
                  report += "---\n"
                  report += f"*Report generated at {now.strftime('%Y-%m-%d %H:%M UTC')}*\n"
                  report += f"*Test method: {self.test_method} | Scope: {self.test_scope} | Auto-alternates between UK and US ProtonVPN*\n\n"
                  
                  # Save history as JSON in HTML comment
                  report += f"<!-- HISTORY\n{json.dumps(self.history, indent=2)}\n-->\n"
                  
                  return reportd US ProtonVPN*\n\n"
                  
                  # CRITICAL FIX: Save history as JSON in HTML comment
                  report += f"<!-- HISTORY\n{json.dumps(self.history, indent=2)}\n-->\n"
                  
                  return report

              def run(self):
                  print(f"{'='*60}")
                  print(f"Unified VPN Stream Test")
                  print(f"Test Scope: {self.test_scope.upper()}")
                  print(f"Testing: {COUNTRY} VPN" if self.test_scope == 'direct_and_vpn' else "Direct Connection Only")
                  print(f"Method: {self.test_method.upper()}")
                  print(f"{'='*60}\n")
                  
                  if self.test_method == 'browser':
                      print("⚠️  Browser method is slower but more accurate")
                  elif self.test_method == 'hybrid':
                      print("⚠️  Hybrid: Fast ffprobe scan + browser verification")
                  
                  # Test direct
                  direct = self.test_location("Direct Connection", use_vpn=False)
                  if direct:
                      self.results['direct'] = direct
                  
                  # Test VPN only if scope is direct_and_vpn
                  if self.test_scope == 'direct_and_vpn':
                      vpn = self.test_location(f"{COUNTRY} ProtonVPN", use_vpn=True)
                      if vpn:
                          self.results['vpn'] = vpn
                  else:
                      print("\n⚠️  Skipping VPN test (direct_only mode)")
                  
                  # Generate report
                  print("\nGenerating report...")
                  report = self.generate_report()
                  
                  with open('report.md', 'w', encoding='utf-8') as f:
                      f.write(report)
                  
                  duration = (time.time() - self.start_time) / 60
                  print(f"\n{'='*60}")
                  print(f"Test Complete - {duration:.1f} minutes")
                  print(f"Method: {self.test_method}")
                  print(f"Scope: {self.test_scope}")
                  print('='*60)
                  
                  for location, data in self.results.items():
                      loc_name = f"{COUNTRY} VPN" if location == 'vpn' else "Direct"
                      total = len(data['working']) + len(data['geoblocked']) + len(data['failed'])
                      print(f"{loc_name:20}: {len(data['working'])}/{total} ({data['rate']:.1f}%)")

          tester = UnifiedVPNTester()
          tester.run()
          ENDPYTHON

      - name: Cleanup
        if: always()
        run: |
          docker stop gluetun || true
          docker rm gluetun || true
          docker network rm vpn-network || true

      - name: Commit Report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          
          if [[ -f "report.md" ]]; then
            git add report.md
            
            # FIXED: Use dynamic branch name instead of hardcoded 'main'
            BRANCH="${{ github.ref_name }}"
            
            # Fetch and attempt a fast-forward merge (safe)
            git fetch origin "$BRANCH"
            git merge "origin/$BRANCH" --ff-only || true
            
            if ! git diff --staged --quiet; then
              RATE=$(grep -oE "\*\*[0-9.]+%" report.md | grep -oE "[0-9.]+" | head -1 || echo "0")
              METHOD="${{ github.event.inputs.test_method || 'ffprobe' }}"
              SCOPE="${{ github.event.inputs.test_scope || 'direct_only' }}"
              
              if [ "$SCOPE" = "direct_only" ]; then
                git commit -m "Direct test ($METHOD): ${RATE}% - $(date -u '+%m/%d %H:%M')"
              else
                git commit -m "${{ env.COUNTRY_CODE }} $METHOD test: ${RATE}% - $(date -u '+%m/%d %H:%M')"
              fi
              
              git push origin "$BRANCH"
            fi
          fi
