                  if USE_PROXIES:
                      report += f"*🌐 With advanced proxy support for geo-blocked content*\n"
                  
                  return report

              async def run(self):
                  """Main execution function"""
                  start_time = datetime.now(timezone.utc)
                  print("🚀 Starting Enhanced M3U Stream Checker...")
                  
                  # Parse M3U files
                  m3u_files = ['channel playlist.m3u']
                  all_streams = []
                  
                  for m3u_file in m3u_files:
                      print(f"\n📋 Processing {m3u_file}...")
                      streams = self.parse_m3u(m3u_file)
                      all_streams.extend(streams)
                  
                  if not all_streams:
                      print("❌ No streams found in any M3U file!")
                      return
                  
                  print(f"📊 Total streams found: {len(all_streams)}")
                  
                  # Setup proxies if enabled
                  if USE_PROXIES:
                      print("\n🌐 Setting up enhanced proxy infrastructure...")
                      self.setup_proxies()
                  
                  # Process all streams
                  await self.process_all_streams(all_streams)
                  
                  # Generate and save report
                  print("\n📝 Generating comprehensive report...")
                  report = self.generate_enhanced_report()
                  
                  try:
                      with open('report.md', 'w', encoding='utf-8') as f:
                          f.write(report)
                      print("✅ Report saved to report.md")
                  except Exception as e:
                      print(f"❌ Error saving report: {e}")
                      return
                  
                  # Final summary
                  end_time = datetime.now(timezone.utc)
                  duration = (end_time - start_time).total_seconds()
                  total_working = len(self.regular_working) + len(self.geo_working)
                  total_checked = len(self.regular_working) + len(self.regular_failed) + len(self.geo_working) + len(self.geo_failed)
                  
                  print(f"\n" + "="*70)
                  print(f"🎉 ENHANCED STREAM CHECK COMPLETE")
                  print(f"="*70)
                  print(f"⏱️ Duration: {duration:.1f} seconds")
                  print(f"📊 Results: {total_working}/{total_checked} streams working ({(total_working/total_checked*100) if total_checked > 0 else 0:.1f}%)")
                  if USE_PROXIES and self.working_proxies:
                      print(f"🌐 Proxy stats: {len(self.working_proxies)} working from {self.proxy_stats['tested']} tested")
                      print(f"🎯 Geo-recovery: {len(self.geo_working)} geo-blocked streams recovered")
                  print(f"📄 Report: report.md ({os.path.getsize('report.md')} bytes)")
                  print(f"="*70)

          # Execute the enhanced checker
          checker = EnhancedStreamChecker()
          asyncio.run(checker.run())
          EOF
          
          # Verify Python script succeeded
          if [ $? -eq 0 ]; then
            echo "✅ Enhanced Python script completed successfully"
          else
            echo "❌ Enhanced Python script failed with exit code $?"
            exit 1
          fi
          
          # Verify report file exists
          if [ -f "report.md" ]; then
            echo "✅ Enhanced report file confirmed"
            echo "📊 Report size: $(wc -c < report.md) bytes"
            echo "📋 Report preview:"
            head -10 report.md
          else
            echo "❌ Enhanced report file missing!"
            ls -la
            exit 1
          fi

      - name: 📤 Commit and push enhanced report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          
          # Check if report was generated
          if [[ -f "report.md" ]]; then
            echo "✅ Enhanced report file found"
            ls -la report.md
          else
            echo "❌ Enhanced report file not found!"
            ls -la
            exit 1
          fi
          
          # Pull latest changes first to avoid conflicts
          echo "🔄 Pulling latest changes..."
          git pull origin main --rebase || {
            echo "⚠️ Rebase failed, trying reset and pull..."
            git reset --hard HEAD
            git pull origin main
          }
          
          git add report.md
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit - report unchanged"
          else
            # Enhanced commit message with full configuration info
            COMMIT_MSG="📺 Enhanced stream report"
            
            # Add feature flags to commit message
            if [[ "${CHECK_VODS:-false}" == "true" ]]; then
              COMMIT_MSG="$COMMIT_MSG 🎬VODs"
            fi
            if [[ "${CHECK_PPV:-false}" == "true" ]]; then
              COMMIT_MSG="$COMMIT_MSG 🥊PPV" 
            fi
            if [[ "${CHECK_FAST:-false}" == "true" ]]; then
              COMMIT_MSG="$COMMIT_MSG 📺FAST" 
            fi
            if [[ "${USE_PROXIES:-true}" == "true" ]]; then
              COMMIT_MSG="$COMMIT_MSG 🌐Proxies"
            fi
            if [[ "${SETUP_TOR:-false}" == "true" ]]; then
              COMMIT_MSG="$COMMIT_MSG 🔒Tor"
            fi
            
            COMMIT_MSG="$COMMIT_MSG - $(date -u '+%Y-%m-%d %H:%M UTC')"
            
            echo "💾 Committing: $COMMIT_MSG"
            git commit -m "$COMMIT_MSG"
            
            # Enhanced push with retry logic and conflict resolution
            echo "📤 Pushing enhanced report..."
            for attempt in {1..5}; do
              if git push origin main; then
                echo "✅ Enhanced report pushed successfully on attempt $attempt"
                break
              else
                echo "⚠️ Push attempt $attempt failed"
                if [ $attempt -lt 5 ]; then
                  echo "🔄 Retrying in $((attempt * 2)) seconds..."
                  sleep $((attempt * 2))
                  
                  # Try to resolve conflicts
                  git pull origin main --rebase --strategy-option=ours || {
                    echo "🔧 Rebase failed, trying merge strategy..."
                    git reset --hard HEAD~1
                    git pull origin main
                    git add report.md
                    git commit -m "$COMMIT_MSG"
                  }
                else
                  echo "❌ Failed to push enhanced report after 5 attempts"
                  echo "📊 Final attempt details:"
                  git status
                  git log --oneline -3
                  exit 1
                fi
              fi
            done
          fi
