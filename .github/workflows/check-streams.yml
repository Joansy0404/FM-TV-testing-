name: VPN Stream Test (Network Namespace)

on:
  workflow_dispatch:
    inputs:
      test_method:
        description: 'Test method'
        required: true
        default: 'ffprobe'
        type: choice
        options:
          - ffprobe
          - browser
          - hybrid
      test_scope:
        description: 'Test scope'
        required: true
        default: 'direct_only'
        type: choice
        options:
          - direct_only
          - vpn_only
          - direct_and_vpn
      sample_size:
        description: 'Sample size (0=all streams)'
        required: false
        default: '0'
        type: string
      check_vods:
        description: 'Check VOD files (URLs ending with #.mkv)'
        required: false
        default: false
        type: boolean
      check_ppv:
        description: 'Check PPV channels (may be offline)'
        required: false
        default: false
        type: boolean
      check_fast:
        description: 'Check FAST channels'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '15 1,7,13,19 * * *'

permissions:
  contents: write

jobs:
  unified-vpn-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pysocks

      - name: Determine next VPN country (auto-alternating)
        run: |
          echo "Checking last test location..."
          if [ -f "report.md" ]; then
            LAST=$(grep -A 1000 "<!-- HISTORY" report.md | grep '"country"' | tail -1 | grep -oP '(UK|US)' || echo "US")
            echo "Last test was: $LAST"
          else
            LAST="US"
            echo "No previous report, defaulting to US as last"
          fi
          
          if [ "$LAST" = "UK" ]; then
            echo "COUNTRY_CODE=us" >> $GITHUB_ENV
            echo "SERVER_CITIES=Los Angeles" >> $GITHUB_ENV
            echo "COUNTRY_NAME=United States" >> $GITHUB_ENV
            echo "✅ Next test: US Los Angeles (alternating from UK)"
          else
            echo "COUNTRY_CODE=uk" >> $GITHUB_ENV
            echo "SERVER_CITIES=London" >> $GITHUB_ENV
            echo "COUNTRY_NAME=United Kingdom" >> $GITHUB_ENV
            echo "✅ Next test: UK London (alternating from US)"
          fi

      - name: Start ProtonVPN via Gluetun
        if: github.event.inputs.test_scope == 'vpn_only' || github.event.inputs.test_scope == 'direct_and_vpn' || github.event_name == 'schedule'
        run: |
          echo "Starting Gluetun with ProtonVPN (${{ env.COUNTRY_NAME }} - ${{ env.SERVER_CITIES }})..."
          docker run -d \
            --name gluetun \
            --cap-add=NET_ADMIN \
            --device /dev/net/tun \
            -e VPN_SERVICE_PROVIDER=protonvpn \
            -e OPENVPN_USER="${{ secrets.VPN_USER }}" \
            -e OPENVPN_PASSWORD="${{ secrets.VPN_PASSWORD }}" \
            -e SERVER_CITIES="${{ env.SERVER_CITIES }}" \
            -e FREE_ONLY=off \
            -e LOG_LEVEL=info \
            -e DOT=off \
            qmcgaw/gluetun:latest
          
          echo "Container started, waiting for initialization..."
          sleep 60

      - name: Verify VPN Connection
        if: github.event.inputs.test_scope == 'vpn_only' || github.event.inputs.test_scope == 'direct_and_vpn' || github.event_name == 'schedule'
        run: |
          echo "=== VPN Connection Verification ==="
          
          # Check container status
          echo "--- Container Status ---"
          docker ps -a | grep gluetun || echo "No container found"
          echo ""
          
          # Check logs
          echo "--- Gluetun Logs (last 50 lines) ---"
          docker logs gluetun --tail 50
          echo ""
          
          # Test connectivity from within the VPN container
          echo "--- Testing VPN IP ---"
          VPN_IP=$(docker exec gluetun wget -qO- https://ipinfo.io/ip 2>/dev/null || echo "")
          
          if [[ "$VPN_IP" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "✅ VPN connected successfully"
            echo "VPN IP: $VPN_IP"
            
            # Get full info
            VPN_INFO=$(docker exec gluetun wget -qO- https://ipinfo.io/json 2>/dev/null)
            echo "$VPN_INFO"
            
            COUNTRY=$(echo "$VPN_INFO" | grep -oP '"country":\s*"\K[^"]+' || echo "Unknown")
            CITY=$(echo "$VPN_INFO" | grep -oP '"city":\s*"\K[^"]+' || echo "Unknown")
            ORG=$(echo "$VPN_INFO" | grep -oP '"org":\s*"\K[^"]+' || echo "Unknown")
            
            echo "CONNECTED_IP=$VPN_IP" >> $GITHUB_ENV
            echo "CONNECTED_COUNTRY=$COUNTRY" >> $GITHUB_ENV
            echo "CONNECTED_CITY=$CITY" >> $GITHUB_ENV
            echo "CONNECTED_ORG=$ORG" >> $GITHUB_ENV
          else
            echo "❌ VPN connection failed"
            echo "Could not retrieve valid IP from container"
            exit 1
          fi

      - name: Create test script
        run: |
          cat > test_streams.py << 'ENDPYTHON'
          import os
          import re
          import time
          import random
          import json
          import subprocess
          from datetime import datetime, timezone

          TEST_METHOD = os.getenv('TEST_METHOD', 'ffprobe')
          TEST_SCOPE = os.getenv('TEST_SCOPE', 'direct_only')
          SAMPLE_SIZE = int(os.getenv('SAMPLE_SIZE', '0'))
          CHECK_VODS = os.getenv('CHECK_VODS', 'false').lower() == 'true'
          CHECK_PPV = os.getenv('CHECK_PPV', 'false').lower() == 'true'
          CHECK_FAST = os.getenv('CHECK_FAST', 'false').lower() == 'true'
          COUNTRY = os.getenv('COUNTRY_CODE', 'uk').upper()
          USE_VPN = os.getenv('USE_VPN', 'false').lower() == 'true'

          class StreamTester:
              def __init__(self):
                  self.start_time = time.time()
                  self.results = {}

              def parse_m3u(self, path):
                  streams = []
                  try:
                      with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                          lines = f.readlines()
                      
                      for i in range(len(lines)):
                          if lines[i].startswith('#EXTINF'):
                              group_match = re.search(r'group-title="([^"]*)"', lines[i])
                              name = lines[i].split(',')[-1].strip() or f"Stream {len(streams)+1}"
                              
                              if i+1 < len(lines):
                                  url = lines[i+1].strip()
                                  if url and 'http' in url:
                                      streams.append({
                                          'name': name,
                                          'url': url,
                                          'group': group_match.group(1) if group_match else "Unknown"
                                      })
                  except Exception as e:
                      print(f"Parse error: {e}")
                  return streams

              def classify_stream(self, stream):
                  if stream['url'].endswith('#.mkv'):
                      return 'VOD'
                  
                  group_lower = stream['group'].lower()
                  name_lower = stream['name'].lower()
                  
                  if any(x in group_lower for x in ['ppv', 'events']) or \
                     any(x in name_lower for x in ['boxing', 'ufc', 'wwe']):
                      return 'PPV'
                  
                  if 'fast' in group_lower:
                      return 'FAST'
                  
                  return 'Channel'

              def should_skip(self, stream):
                  stream_type = self.classify_stream(stream)
                  
                  if stream_type == 'VOD' and not CHECK_VODS:
                      return True
                  if stream_type == 'PPV' and not CHECK_PPV:
                      return True
                  if stream_type == 'FAST' and not CHECK_FAST:
                      return True
                  
                  return False

              def get_filtered_streams(self):
                  all_streams = self.parse_m3u('channel playlist.m3u')
                  print(f"Total streams: {len(all_streams)}")
                  
                  filtered = [s for s in all_streams if not self.should_skip(s)]
                  
                  skipped = len(all_streams) - len(filtered)
                  if skipped > 0:
                      print(f"Filtered out {skipped} streams")
                  
                  print(f"After filtering: {len(filtered)} streams")
                  
                  if SAMPLE_SIZE > 0 and len(filtered) > SAMPLE_SIZE:
                      random.seed(42)
                      filtered = random.sample(filtered, SAMPLE_SIZE)
                      print(f"Sampled: {SAMPLE_SIZE} streams")
                  
                  return filtered

              def test_ffprobe(self, url):
                  timeout_ms = '30000000'
                  analyze_duration = '10000000'
                  probe_size = '10000000'
                  subprocess_timeout = 60
                  
                  cmd = ['ffprobe', '-v', 'error', 
                         '-select_streams', 'v:0',
                         '-show_entries', 'format=duration', 
                         '-of', 'default=noprint_wrappers=1:nokey=1', 
                         '-timeout', timeout_ms, 
                         '-analyzeduration', analyze_duration, 
                         '-probesize', probe_size,
                         url]
                  
                  try:
                      result = subprocess.run(cmd, capture_output=True, text=True, timeout=subprocess_timeout)
                      
                      if result.returncode == 0:
                          return 'working', None
                      
                      err = result.stderr.lower()
                      
                      if '403' in err or 'forbidden' in err:
                          return 'geoblocked', 'HTTP 403 Forbidden'
                      if '401' in err or 'unauthorized' in err:
                          return 'geoblocked', 'HTTP 401 Unauthorized'
                      if '404' in err:
                          return 'notfound', 'HTTP 404 Not Found'
                      if 'timeout' in err:
                          return 'timeout', 'Connection timeout'
                      
                      first_error = err.split('\n')[0][:100] if err else 'Unknown error'
                      return 'failed', first_error
                  
                  except subprocess.TimeoutExpired:
                      return 'timeout', f'Process timeout ({subprocess_timeout}s)'
                  except Exception as e:
                      return 'error', str(e)[:100]

              def test_location(self, location_name):
                  print(f"\n{'='*60}")
                  print(f"Testing: {location_name}")
                  print('='*60)
                  
                  streams = self.get_filtered_streams()
                  working, geoblocked, failed = [], [], []
                  error_samples = {}
                  
                  print(f"\nTesting {len(streams)} streams...\n")
                  
                  for i, stream in enumerate(streams):
                      print(f"[{i+1}/{len(streams)}] {stream['name'][:45]}... ", end='', flush=True)
                      
                      result, error_msg = self.test_ffprobe(stream['url'])
                      
                      if result == 'working':
                          working.append(stream)
                          print("✅ OK")
                      elif result == 'geoblocked':
                          geoblocked.append(stream)
                          print("🔒 GEO")
                      else:
                          failed.append(stream)
                          print(f"❌ {result.upper()}")
                      
                      if error_msg:
                          if error_msg not in error_samples:
                              error_samples[error_msg] = 0
                          error_samples[error_msg] += 1
                      
                      time.sleep(0.3)
                      
                      if (i+1) % 20 == 0:
                          rate = (len(working)/(i+1)*100)
                          print(f"  Progress: {len(working)}/{i+1} ({rate:.1f}%)")
                  
                  total = len(streams)
                  success_rate = (len(working)/total*100) if total > 0 else 0
                  
                  print(f"\n{location_name} Results:")
                  print(f"  Working: {len(working)}/{total} ({success_rate:.1f}%)")
                  print(f"  Geo-blocked: {len(geoblocked)}")
                  print(f"  Failed: {len(failed)}")
                  
                  return {
                      'working': working,
                      'geoblocked': geoblocked,
                      'failed': failed,
                      'rate': success_rate,
                      'error_samples': error_samples
                  }

              def run(self):
                  if USE_VPN:
                      result = self.test_location(f"{COUNTRY} ProtonVPN")
                      self.results['vpn'] = result
                  else:
                      result = self.test_location("Direct Connection")
                      self.results['direct'] = result
                  
                  # Save results to file for parent process
                  with open('/tmp/test_results.json', 'w') as f:
                      json.dump(self.results, f)

          tester = StreamTester()
          tester.run()
          ENDPYTHON

      - name: Install ffmpeg in runner
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run Direct Connection Test
        if: github.event.inputs.test_scope == 'direct_only' || github.event.inputs.test_scope == 'direct_and_vpn'
        env:
          TEST_METHOD: ${{ github.event.inputs.test_method || 'ffprobe' }}
          TEST_SCOPE: direct_only
          SAMPLE_SIZE: ${{ github.event.inputs.sample_size || '0' }}
          CHECK_VODS: ${{ github.event.inputs.check_vods || 'false' }}
          CHECK_PPV: ${{ github.event.inputs.check_ppv || 'false' }}
          CHECK_FAST: ${{ github.event.inputs.check_fast || 'false' }}
          COUNTRY_CODE: ${{ env.COUNTRY_CODE }}
          USE_VPN: 'false'
        run: python test_streams.py

      - name: Run VPN Test via Network Namespace
        if: github.event.inputs.test_scope == 'vpn_only' || github.event.inputs.test_scope == 'direct_and_vpn' || github.event_name == 'schedule'
        run: |
          echo "Running tests through VPN container network namespace..."
          
          # Run Python in a container sharing gluetun's network
          docker run --rm \
            --network container:gluetun \
            -v $(pwd):/workspace \
            -w /workspace \
            -e TEST_METHOD="${{ github.event.inputs.test_method || 'ffprobe' }}" \
            -e TEST_SCOPE="vpn_only" \
            -e SAMPLE_SIZE="${{ github.event.inputs.sample_size || '0' }}" \
            -e CHECK_VODS="${{ github.event.inputs.check_vods || 'false' }}" \
            -e CHECK_PPV="${{ github.event.inputs.check_ppv || 'false' }}" \
            -e CHECK_FAST="${{ github.event.inputs.check_fast || 'false' }}" \
            -e COUNTRY_CODE="${{ env.COUNTRY_CODE }}" \
            -e USE_VPN="true" \
            python:3.11-slim \
            bash -c "apt-get update && apt-get install -y ffmpeg && python test_streams.py"

      - name: Generate Report
        if: always()
        run: |
          python << 'ENDPYTHON'
          import json
          import os
          from datetime import datetime, timezone

          # Load results
          direct_results = None
          vpn_results = None
          
          try:
              with open('/tmp/test_results.json', 'r') as f:
                  results = json.load(f)
                  direct_results = results.get('direct')
                  vpn_results = results.get('vpn')
          except:
              pass

          now = datetime.now(timezone.utc)
          report = "# Stream Test Report\n\n"
          report += f"**Last update:** {now.strftime('%Y-%m-%d %H:%M UTC')}\n\n"
          report += "## Latest Test Results\n\n"
          report += "| Location | Working | Geo-blocked | Failed | Total | Success Rate |\n"
          report += "|----------|---------|-------------|--------|-------|--------------|\n"
          
          if direct_results:
              w = len(direct_results['working'])
              g = len(direct_results['geoblocked'])
              f = len(direct_results['failed'])
              total = w + g + f
              rate = direct_results['rate']
              report += f"| Direct | {w} | {g} | {f} | {total} | **{rate:.1f}%** |\n"
          
          if vpn_results:
              w = len(vpn_results['working'])
              g = len(vpn_results['geoblocked'])
              f = len(vpn_results['failed'])
              total = w + g + f
              rate = vpn_results['rate']
              country = os.getenv('COUNTRY_CODE', 'UK').upper()
              report += f"| {country} VPN | {w} | {g} | {f} | {total} | **{rate:.1f}%** |\n"
          
          with open('report.md', 'w') as f:
              f.write(report)
          
          print("Report generated successfully")
          ENDPYTHON

      - name: Cleanup
        if: always()
        run: |
          docker stop gluetun || true
          docker rm gluetun || true

      - name: Commit Report
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          
          if [[ -f "report.md" ]]; then
            git add report.md
            
            BRANCH="${{ github.ref_name }}"
            git fetch origin "$BRANCH"
            git merge "origin/$BRANCH" --ff-only || true
            
            if ! git diff --staged --quiet; then
              RATE=$(grep -oE "\*\*[0-9.]+%" report.md | grep -oE "[0-9.]+" | head -1 || echo "0")
              METHOD="${{ github.event.inputs.test_method || 'ffprobe' }}"
              SCOPE="${{ github.event.inputs.test_scope || 'direct_only' }}"
              
              if [ "$SCOPE" = "direct_only" ]; then
                git commit -m "Direct test ($METHOD): ${RATE}% - $(date -u '+%m/%d %H:%M')"
              else
                git commit -m "${{ env.COUNTRY_CODE }} $METHOD test: ${RATE}% - $(date -u '+%m/%d %H:%M')"
              fi
              
              git push origin "$BRANCH"
            fi
          fi
