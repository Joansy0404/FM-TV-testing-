                  print(f"Working streams: {total_working} ({(total_working/total_checked*100) if total_checked > 0 else 0:.1f}%)")
                  if USE_PROXIES:
                      print(f"Geo-blocked streams recovered: {geo_recovered}")
                      print(f"Working proxies used: {len(self.working_proxies)}")
                  print(f"Report: {os.path.getsize('report.md') if os.path.exists('report.md') else 0} bytes")
                  print(f"="*70)

          # Execute comprehensive analyzer
          analyzer = ComprehensiveStreamAnalyzer()
          asyncio.run(analyzer.run())
          EOF
          
          # Verify success
          if [ $? -eq 0 ]; then
            echo "✅ Comprehensive analysis completed"
            if [ -f "report.md" ]; then
              echo "📊 Report size: $(wc -c < report.md) bytes"
              echo "📋 Report preview:"
              head -12 report.md
            else
