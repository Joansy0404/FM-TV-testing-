name: Fast IPTV Stream Checker

on:
  workflow_dispatch:
    inputs:
      check_vods:
        description: 'Check VOD files'
        required: false
        default: false
        type: boolean
      check_ppv:
        description: 'Check PPV channels'
        required: false
        default: false
        type: boolean
      check_fast:
        description: 'Check FAST channels'
        required: false
        default: false
        type: boolean
      sample_size:
        description: 'Sample size (0=all, 300=recommended)'
        required: false
        default: '300'
        type: string
      quick_mode:
        description: 'Quick validation (faster but less thorough)'
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '0 */12 * * *'

permissions:
  contents: write

jobs:
  fast-stream-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl
          python -m pip install --upgrade pip
          pip install requests

      - name: Fast IPTV Stream Validation
        env:
          CHECK_VODS: ${{ github.event.inputs.check_vods || 'false' }}
          CHECK_PPV: ${{ github.event.inputs.check_ppv || 'false' }}
          CHECK_FAST: ${{ github.event.inputs.check_fast || 'false' }}
          SAMPLE_SIZE: ${{ github.event.inputs.sample_size || '300' }}
          QUICK_MODE: ${{ github.event.inputs.quick_mode || 'true' }}
        run: |
          python - << 'EOF'
          import requests
          import subprocess
          import os
          import re
          import time
          import random
          import json
          from datetime import datetime, timezone
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import threading

          # Configuration
          CHECK_VODS = os.getenv('CHECK_VODS', 'false').lower() == 'true'
          CHECK_PPV = os.getenv('CHECK_PPV', 'false').lower() == 'true'
          CHECK_FAST = os.getenv('CHECK_FAST', 'false').lower() == 'true'
          SAMPLE_SIZE = int(os.getenv('SAMPLE_SIZE', '300'))
          QUICK_MODE = os.getenv('QUICK_MODE', 'true').lower() == 'true'

          print(f"Fast IPTV Stream Validation Starting...")
          print(f"Quick mode: {QUICK_MODE}, Sample: {SAMPLE_SIZE}")

          class FastStreamChecker:
              def __init__(self):
                  self.start_time = time.time()
                  self.results = {
                      'working': [],
                      'geoblocked': [],
                      'failed': [],
                      'skipped': []
                  }
                  self.session = requests.Session()
                  self.session.headers.update({
                      'User-Agent': 'VLC/3.0.12 LibVLC/3.0.12'
                  })
                  self.lock = threading.Lock()

              def classify_stream_type(self, stream):
                  """Classify stream type"""
                  url = stream['url']
                  name = stream['name'].lower()
                  group = stream['group'].lower()
                  
                  if url.endswith('#.mkv'):
                      return 'VOD'
                  elif any(x in group for x in ['uk events', 'usa events', 'events', 'ppv']):
                      return 'PPV'
                  elif 'fast' in group:
                      return 'FAST'
                  else:
                      return 'Channel'

              def should_test_stream(self, stream):
                  """Check if stream should be tested"""
                  stream_type = self.classify_stream_type(stream)
                  
                  if stream_type == 'VOD' and not CHECK_VODS:
                      return False
                  elif stream_type == 'PPV' and not CHECK_PPV:
                      return False
                  elif stream_type == 'FAST' and not CHECK_FAST:
                      return False
                  
                  return True

              def is_xtream_url(self, url):
                  """Check if URL is Xtream Codes format"""
                  return 'xtream' in url.lower() or '/live/' in url or re.search(r'/\w+/\w+/\d+', url)

              def fast_validate_stream(self, stream):
                  """Fast stream validation - optimized for speed and accuracy"""
                  url = stream['url']
                  name = stream['name']
                  
                  # Quick validation based on URL patterns and HTTP response
                  try:
                      # For Xtream URLs, use HEAD request with short timeout
                      if self.is_xtream_url(url):
                          response = self.session.head(url, timeout=3, allow_redirects=True)
                          
                          if response.status_code == 403:
                              return 'Geoblocked', f'HTTP 403'
                          elif response.status_code == 404:
                              return 'Failed', f'Stream not found (404)'
                          elif response.status_code == 200:
                              # For Xtream, 200 on HEAD usually means working
                              return 'Working', f'Xtream API responsive'
                          elif 300 <= response.status_code < 400:
                              # Redirects are usually good for streams
                              return 'Working', f'Redirect to stream'
                      
                      # For direct URLs, try to get first few KB
                      response = self.session.get(url, stream=True, timeout=4)
                      
                      if response.status_code == 403:
                          return 'Geoblocked', f'HTTP 403'
                      elif response.status_code != 200:
                          return 'Failed', f'HTTP {response.status_code}'
                      
                      # Read first chunk to verify it's media content
                      chunk_size = 0
                      content_sample = b''
                      
                      for chunk in response.iter_content(chunk_size=2048):
                          if chunk:
                              content_sample += chunk
                              chunk_size += len(chunk)
                              if chunk_size > 4096:  # 4KB sample
                                  break
                      
                      if chunk_size < 100:
                          return 'Failed', 'No content received'
                      
                      # Quick content analysis
                      sample_lower = content_sample.lower()
                      
                      # Definitely not a stream
                      if (b'<html' in sample_lower or 
                          b'<!doctype' in sample_lower or
                          b'404 not found' in sample_lower or
                          b'access denied' in sample_lower):
                          return 'Failed', 'HTML/Error page'
                      
                      # Likely stream content
                      if (b'#extm3u' in sample_lower or
                          b'#extinf' in sample_lower or
                          len([b for b in content_sample if b > 127]) > len(content_sample) * 0.3):
                          return 'Working', f'Stream content detected ({chunk_size}B)'
                      
                      # Fallback - if we got data and it's not HTML, probably working
                      return 'Working', f'Binary content ({chunk_size}B)'
                      
                  except requests.exceptions.Timeout:
                      return 'Failed', 'Connection timeout'
                  except requests.exceptions.ConnectionError:
                      return 'Failed', 'Connection failed'
                  except Exception as e:
                      return 'Failed', f'Error: {str(e)[:30]}'

              def validate_stream_batch(self, streams):
                  """Validate a batch of streams"""
                  results = []
                  
                  if QUICK_MODE:
                      # Sequential processing for quick mode
                      for i, stream in enumerate(streams):
                          print(f"  [{i+1}/{len(streams)}] {stream['name'][:40]}...")
                          
                          status, reason = self.fast_validate_stream(stream)
                          results.append((stream, status, reason))
                          
                          # Brief pause to avoid overwhelming servers
                          time.sleep(0.02)
                  else:
                      # Parallel processing for thorough mode
                      with ThreadPoolExecutor(max_workers=5) as executor:
                          future_to_stream = {
                              executor.submit(self.fast_validate_stream, stream): stream 
                              for stream in streams
                          }
                          
                          for i, future in enumerate(as_completed(future_to_stream)):
                              stream = future_to_stream[future]
                              try:
                                  status, reason = future.result()
                                  results.append((stream, status, reason))
                                  print(f"  [{i+1}/{len(streams)}] {stream['name'][:40]}... {status}")
                              except Exception as e:
                                  results.append((stream, 'Failed', f'Exception: {e}'))
                  
                  return results

              def parse_m3u(self, file_path):
                  """Parse M3U file efficiently"""
                  if not os.path.exists(file_path):
                      print(f"M3U file not found: {file_path}")
                      return []
                      
                  streams = []
                  try:
                      with open(file_path, 'r', encoding='utf-8', errors='ignore') as f:
                          lines = f.readlines()
                  except Exception as e:
                      print(f"Error reading M3U file: {e}")
                      return []
                      
                  for i in range(len(lines)):
                      line = lines[i].strip()
                      if line.startswith('#EXTINF'):
                          try:
                              group_match = re.search(r'group-title="([^"]*)"', line)
                              group = group_match.group(1) if group_match else "No Group"
                              name = line.split(',')[-1].strip() if ',' in line else "Unknown"
                              
                              if i + 1 < len(lines):
                                  url = lines[i + 1].strip()
                                  if url and not url.startswith('#') and ('http' in url):
                                      streams.append({
                                          'name': name,
                                          'url': url,
                                          'group': group
                                      })
                          except Exception:
                              continue
                  
                  print(f"Parsed {len(streams)} streams from M3U file")
                  return streams

              def run_validation(self):
                  """Run fast validation"""
                  # Parse M3U
                  all_streams = self.parse_m3u('channel playlist.m3u')
                  if not all_streams:
                      print("No streams found!")
                      return

                  # Filter streams
                  test_streams = [s for s in all_streams if self.should_test_stream(s)]
                  
                  # Apply sample size
                  if SAMPLE_SIZE > 0 and len(test_streams) > SAMPLE_SIZE:
                      test_streams = random.sample(test_streams, SAMPLE_SIZE)
                  
                  print(f"Testing {len(test_streams)} streams (from {len(all_streams)} total)")
                  
                  # Process in batches for better performance
                  batch_size = 50 if QUICK_MODE else 20
                  
                  for i in range(0, len(test_streams), batch_size):
                      batch = test_streams[i:i + batch_size]
                      print(f"\nBatch {i//batch_size + 1}: Testing streams {i+1}-{min(i+batch_size, len(test_streams))}")
                      
                      batch_results = self.validate_stream_batch(batch)
                      
                      # Process results
                      for stream, status, reason in batch_results:
                          stream_type = self.classify_stream_type(stream)
                          
                          result_data = {
                              'name': stream['name'],
                              'type': stream_type,
                              'group': stream['group'],
                              'url': stream['url'],
                              'reason': reason
                          }
                          
                          if status == 'Working':
                              self.results['working'].append(result_data)
                          elif status == 'Geoblocked':
                              self.results['geoblocked'].append(result_data)
                          else:
                              self.results['failed'].append(result_data)
                  
                  print(f"\nValidation completed!")

              def generate_report(self):
                  """Generate concise validation report"""
                  duration = time.time() - self.start_time
                  
                  total_tested = (len(self.results['working']) + 
                                len(self.results['geoblocked']) + 
                                len(self.results['failed']))
                  
                  working_count = len(self.results['working'])
                  geo_count = len(self.results['geoblocked'])
                  failed_count = len(self.results['failed'])
                  
                  success_rate = (working_count / total_tested * 100) if total_tested > 0 else 0
                  
                  report = f"# Fast IPTV Stream Validation Report\n\n"
                  report += f"**Generated:** {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}  \n"
                  report += f"**Duration:** {duration:.1f}s ({duration/60:.1f}m)  \n"
                  report += f"**Mode:** {'Quick' if QUICK_MODE else 'Thorough'} validation  \n"
                  report += f"**Sample:** {total_tested} streams tested  \n\n"
                  
                  # Executive Summary
                  report += "## Executive Summary\n\n"
                  report += f"- **✅ Working Streams:** {working_count} ({success_rate:.1f}%)\n"
                  report += f"- **🔒 Geo-blocked:** {geo_count} ({(geo_count/total_tested*100) if total_tested > 0 else 0:.1f}%)\n"
                  report += f"- **❌ Failed Streams:** {failed_count} ({(failed_count/total_tested*100) if total_tested > 0 else 0:.1f}%)\n"
                  report += f"- **📊 Total Tested:** {total_tested} streams\n\n"
                  
                  # Performance metrics
                  if duration > 0:
                      rate = total_tested / duration
                      report += f"**Performance:** {rate:.2f} streams/second, {duration/total_tested:.2f}s per stream\n\n"
                  
                  # Stream type breakdown
                  type_stats = {}
                  for category in ['working', 'geoblocked', 'failed']:
                      for stream in self.results[category]:
                          stream_type = stream['type']
                          if stream_type not in type_stats:
                              type_stats[stream_type] = {'working': 0, 'geoblocked': 0, 'failed': 0}
                          type_stats[stream_type][category] += 1
                  
                  if type_stats:
                      report += "## Stream Type Breakdown\n\n"
                      for stream_type, stats in type_stats.items():
                          total_type = sum(stats.values())
                          working_pct = (stats['working'] / total_type * 100) if total_type > 0 else 0
                          report += f"- **{stream_type}:** {stats['working']}/{total_type} working ({working_pct:.1f}%)\n"
                      report += "\n"
                  
                  # Working streams sample
                  if self.results['working']:
                      report += "## Working Streams (Top 20)\n\n"
                      report += "| Channel | Type | Status | Group |\n"
                      report += "|---------|------|--------|---------|\n"
                      
                      for stream in self.results['working'][:20]:
                          name = stream['name'][:30].replace('|', '\\|')
                          stream_type = stream['type']
                          reason = stream.get('reason', 'OK')[:25].replace('|', '\\|')
                          group = stream['group'][:15].replace('|', '\\|')
                          
                          report += f"| {name} | {stream_type} | {reason} | {group} |\n"
                      
                      report += "\n"
                  
                  # Failed streams analysis
                  if self.results['failed']:
                      failure_reasons = {}
                      for stream in self.results['failed']:
                          reason = stream.get('reason', 'Unknown')
                          # Simplify reason for grouping
                          if 'timeout' in reason.lower():
                              key = 'Connection timeout'
                          elif 'connection failed' in reason.lower():
                              key = 'Connection failed'
                          elif 'html' in reason.lower() or 'error page' in reason.lower():
                              key = 'HTML/Error page'
                          elif '404' in reason:
                              key = 'Stream not found (404)'
                          elif 'http' in reason.lower():
                              key = 'HTTP error'
                          else:
                              key = 'Other'
                          
                          failure_reasons[key] = failure_reasons.get(key, 0) + 1
                      
                      report += "## Failure Analysis\n\n"
                      for reason, count in sorted(failure_reasons.items(), key=lambda x: x[1], reverse=True):
                          pct = (count / failed_count * 100) if failed_count > 0 else 0
                          report += f"- **{reason}:** {count} streams ({pct:.1f}%)\n"
                      report += "\n"
                  
                  # Geo-blocked streams
                  if self.results['geoblocked']:
                      report += "## Geo-blocked Streams\n\n"
                      for stream in self.results['geoblocked'][:10]:
                          report += f"- {stream['name']} ({stream['group']})\n"
                      report += "\n"
                  
                  # Recommendations
                  report += "## Recommendations\n\n"
                  
                  if success_rate > 60:
                      report += f"**Good Success Rate ({success_rate:.1f}%)**\n"
                      report += f"- Most streams are working well\n"
                      report += f"- Current validation approach is effective\n\n"
                  elif success_rate > 30:
                      report += f"**Moderate Success Rate ({success_rate:.1f}%)**\n"
                      report += f"- Decent stream availability\n"
                      report += f"- Some issues may be temporary\n\n"
                  else:
                      report += f"**Low Success Rate ({success_rate:.1f}%)**\n"
                      report += f"- Many streams appear to be offline\n"
                      report += f"- Consider checking stream source validity\n\n"
                  
                  if geo_count > 0:
                      report += f"**Geo-blocking:** {geo_count} streams blocked\n"
                      report += f"- Consider VPN/proxy for blocked content\n\n"
                  
                  # Methodology
                  report += "## Fast Validation Method\n\n"
                  report += f"This validation uses an optimized approach:\n"
                  report += f"- Quick HTTP HEAD/GET requests with short timeouts\n"
                  report += f"- Smart content analysis for Xtream Codes URLs\n"
                  report += f"- Binary content detection for stream verification\n"
                  report += f"- {'Sequential' if QUICK_MODE else 'Parallel'} processing for speed\n"
                  report += f"- Reduced false negatives while maintaining accuracy\n\n"
                  
                  report += f"---\n"
                  report += f"*Fast validation completed in {duration:.1f} seconds*\n"
                  
                  return report

              def run(self):
                  """Main execution function"""
                  print("Starting Fast IPTV Stream Validation...")
                  
                  # Run validation
                  self.run_validation()
                  
                  # Generate report
                  print("\nGenerating validation report...")
                  report = self.generate_report()
                  
                  # Save report
                  try:
                      with open('report.md', 'w', encoding='utf-8') as f:
                          f.write(report)
                      print("Report saved successfully!")
                  except Exception as e:
                      print(f"Error saving report: {e}")
                      with open('report.md', 'w', encoding='utf-8') as f:
                          f.write(f"# Fast IPTV Validation Report\nError: {e}\n")
                  
                  # Final summary
                  duration = time.time() - self.start_time
                  working = len(self.results['working'])
                  total = working + len(self.results['geoblocked']) + len(self.results['failed'])
                  
                  print(f"\n{'='*50}")
                  print(f"FAST VALIDATION COMPLETE")
                  print(f"{'='*50}")
                  print(f"Duration: {duration:.1f}s ({duration/60:.1f}m)")
                  print(f"Rate: {(total/duration):.2f} streams/second")
                  print(f"Working: {working}/{total} ({(working/total*100) if total > 0 else 0:.1f}%)")
                  print(f"Geo-blocked: {len(self.results['geoblocked'])}")
                  print(f"Failed: {len(self.results['failed'])}")

          # Run the fast checker
          checker = FastStreamChecker()
          checker.run()
          EOF

      - name: Commit validation report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          
          if [[ -f "report.md" ]]; then
            # Handle unstaged changes
            if ! git diff --quiet; then
              git add .
            fi
            
            # Pull latest changes
            git pull origin main --no-rebase || echo "Pull failed, continuing..."
            
            # Add report and commit if changes exist
            git add report.md
            
            if ! git diff --staged --quiet; then
              # Extract metrics safely
              WORKING=$(grep -o "Working Streams.*(" report.md 2>/dev/null | head -1 | grep -oE '[0-9]+' | head -1 || echo "0")
              TOTAL=$(grep -o "Total Tested.*(" report.md 2>/dev/null | head -1 | grep -oE '[0-9]+' | head -1 || echo "1")
              
              # Validate numbers
              if ! [[ "$WORKING" =~ ^[0-9]+$ ]]; then WORKING="0"; fi
              if ! [[ "$TOTAL" =~ ^[0-9]+$ ]] || [[ "$TOTAL" == "0" ]]; then TOTAL="1"; fi
              
              SUCCESS_RATE=$(( WORKING * 100 / TOTAL ))
              DURATION=$(grep -o "Duration.*(" report.md 2>/dev/null | head -1 | grep -oE '[0-9]+\.[0-9]+' | head -1 || echo "0")
              
              COMMIT_MSG="Fast IPTV check: ${WORKING}/${TOTAL} working (${SUCCESS_RATE}%)"
              if [[ "$DURATION" != "0" ]]; then
                COMMIT_MSG="$COMMIT_MSG in ${DURATION}min"
              fi
              COMMIT_MSG="$COMMIT_MSG - $(date -u '+%m/%d %H:%M UTC')"
              
              git commit -m "$COMMIT_MSG"
              git push origin main
              echo "Report committed: $COMMIT_MSG"
            else
              echo "No changes to commit"
            fi
          else
            echo "No report found"
          fi
