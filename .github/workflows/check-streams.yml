name: VPN Stream Test (UK/US Alternating)

on:
  workflow_dispatch:
    inputs:
      sample_size:
        description: 'Sample size (0=all streams, 100=sample)'
        required: false
        default: '0'
        type: string
      check_vods:
        description: 'Check VOD files (URLs ending with #.mkv)'
        required: false
        default: false
        type: boolean
      check_ppv:
        description: 'Check PPV channels (may be offline)'
        required: false
        default: false
        type: boolean
      check_fast:
        description: 'Check FAST channels'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '15 1,7,13,19 * * *'

permissions:
  contents: write

jobs:
  vpn-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -version

      - name: Determine VPN country
        run: |
          if [ -f "report.md" ]; then
            LAST=$(grep -oP "Last tested: \K(UK|US)" report.md | head -1 || echo "US")
          else
            LAST="US"
          fi
          
          if [ "$LAST" = "UK" ]; then
            echo "COUNTRY_CODE=us" >> $GITHUB_ENV
            echo "COUNTRY_NAME=United States" >> $GITHUB_ENV
          else
            echo "COUNTRY_CODE=uk" >> $GITHUB_ENV
            echo "COUNTRY_NAME=United Kingdom" >> $GITHUB_ENV
          fi
          echo "Testing $COUNTRY_NAME"

      - name: Start VPN
        run: |
          docker network create vpn-network || true
          docker run -d \
            --name gluetun \
            --cap-add=NET_ADMIN \
            --device /dev/net/tun \
            --network vpn-network \
            -p 8888:8888 \
            -e VPN_SERVICE_PROVIDER=protonvpn \
            -e OPENVPN_USER="${{ secrets.VPN_USER }}" \
            -e OPENVPN_PASSWORD="${{ secrets.VPN_PASSWORD }}" \
            -e SERVER_COUNTRIES="${{ env.COUNTRY_NAME }}" \
            -e SERVER_FEATURES=p2p \
            -e FREE_ONLY=off \
            -e LOG_LEVEL=info \
            -e HTTPPROXY=on \
            -e HTTPPROXY_LISTENING_ADDRESS=:8888 \
            qmcgaw/gluetun:latest
          
          for i in {1..24}; do
            sleep 15
            if curl -x localhost:8888 -s --connect-timeout 10 https://ipinfo.io/json > /tmp/vpn.json 2>/dev/null; then
              C=$(cat /tmp/vpn.json | jq -r '.country' 2>/dev/null || echo "Unknown")
              IP=$(cat /tmp/vpn.json | jq -r '.ip' 2>/dev/null || echo "Unknown")
              echo "Attempt $i: $C - $IP"
              if [[ "$C" != "null" && "$C" != "Unknown" ]]; then
                echo "VPN_READY=true" >> $GITHUB_ENV
                echo "CONNECTED_IP=$IP" >> $GITHUB_ENV
                break
              fi
            fi
          done

      - name: Test Streams
        env:
          SAMPLE_SIZE: ${{ github.event.inputs.sample_size || '0' }}
          CHECK_VODS: ${{ github.event.inputs.check_vods || 'false' }}
          CHECK_PPV: ${{ github.event.inputs.check_ppv || 'false' }}
          CHECK_FAST: ${{ github.event.inputs.check_fast || 'false' }}
          VPN_READY: ${{ env.VPN_READY }}
          COUNTRY_CODE: ${{ env.COUNTRY_CODE }}
          CONNECTED_IP: ${{ env.CONNECTED_IP }}
        run: |
          python << 'ENDPY'
          import requests, os, re, time, random, subprocess, json
          from datetime import datetime, timezone

          SAMPLE_SIZE = int(os.getenv('SAMPLE_SIZE', '0'))
          CHECK_VODS = os.getenv('CHECK_VODS', 'false').lower() == 'true'
          CHECK_PPV = os.getenv('CHECK_PPV', 'false').lower() == 'true'
          CHECK_FAST = os.getenv('CHECK_FAST', 'false').lower() == 'true'
          VPN_READY = os.getenv('VPN_READY', 'false').lower() == 'true'
          COUNTRY = os.getenv('COUNTRY_CODE', 'uk').upper()
          CONNECTED_IP = os.getenv('CONNECTED_IP', 'Unknown')

          class StreamTester:
              def __init__(self):
                  self.start = time.time()
                  self.results = {}
                  self.history = self.load_history()

              def load_history(self):
                  h = {'tests': []}
                  try:
                      if os.path.exists('report.md'):
                          with open('report.md', 'r') as f:
                              m = re.search(r'<!-- HIST\n(.*?)\n-->', f.read(), re.DOTALL)
                              if m: h = json.loads(m.group(1))
                  except: pass
                  return h

              def parse_m3u(self, path):
                  streams = []
                  try:
                      with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                          lines = f.readlines()
                      for i in range(len(lines)):
                          if lines[i].startswith('#EXTINF'):
                              g = re.search(r'group-title="([^"]*)"', lines[i])
                              n = lines[i].split(',')[-1].strip() or f"Stream {len(streams)+1}"
                              if i+1 < len(lines):
                                  u = lines[i+1].strip()
                                  if u and 'http' in u:
                                      streams.append({'name': n, 'url': u, 'group': g.group(1) if g else "Unknown"})
                  except Exception as e:
                      print(f"Parse error: {e}")
                  return streams

              def classify(self, s):
                  if s['url'].endswith('#.mkv'): return 'VOD'
                  g, n = s['group'].lower(), s['name'].lower()
                  if any(x in g for x in ['ppv', 'events']) or any(x in n for x in ['boxing', 'ufc', 'wwe']): return 'PPV'
                  if 'fast' in g: return 'FAST'
                  return 'Channel'

              def should_skip(self, s):
                  t = self.classify(s)
                  return (t == 'VOD' and not CHECK_VODS) or (t == 'PPV' and not CHECK_PPV) or (t == 'FAST' and not CHECK_FAST)

              def get_sample(self):
                  all_s = self.parse_m3u('channel playlist.m3u')
                  print(f"Total streams: {len(all_s)}")
                  
                  filt = [s for s in all_s if not self.should_skip(s)]
                  skipped = {'VOD': 0, 'PPV': 0, 'FAST': 0}
                  for s in all_s:
                      if self.should_skip(s):
                          skipped[self.classify(s)] += 1
                  
                  print(f"After filtering: {len(filt)} streams")
                  if skipped['VOD'] > 0: print(f"  Skipped {skipped['VOD']} VODs")
                  if skipped['PPV'] > 0: print(f"  Skipped {skipped['PPV']} PPV")
                  if skipped['FAST'] > 0: print(f"  Skipped {skipped['FAST']} FAST")
                  
                  if SAMPLE_SIZE > 0 and len(filt) > SAMPLE_SIZE:
                      random.seed(42)
                      filt = random.sample(filt, SAMPLE_SIZE)
                      print(f"Sampled: {SAMPLE_SIZE} streams")
                  
                  return filt

              def test_ffprobe(self, url, proxy=None):
                  cmd = ['ffprobe', '-v', 'error', '-show_entries', 'format=duration', 
                         '-of', 'default=noprint_wrappers=1:nokey=1', '-timeout', '8000000', url]
                  if proxy: cmd[2:2] = ['-http_proxy', proxy]
                  try:
                      r = subprocess.run(cmd, capture_output=True, text=True, timeout=10)
                      if r.returncode == 0: return 'working'
                      err = r.stderr.lower()
                      if '403' in err or 'forbidden' in err: return 'geoblocked'
                      if '404' in err: return 'notfound'
                      return 'failed'
                  except subprocess.TimeoutExpired: return 'timeout'
                  except: return 'error'

              def test_location(self, name, vpn=False):
                  print(f"\n{'='*50}\n{name}\n{'='*50}")
                  proxy = 'http://localhost:8888' if vpn else None
                  
                  sess = requests.Session()
                  if proxy: sess.proxies = {'http': proxy, 'https': proxy}
                  
                  try:
                      info = sess.get('https://ipinfo.io/json', timeout=10).json()
                      print(f"Location: {info.get('country')} - {info.get('ip')}")
                  except Exception as e:
                      print(f"Location check failed: {e}")
                      if vpn: return None
                      info = {}
                  
                  streams = self.get_sample()
                  working, geoblocked, failed = [], [], []
                  
                  for i, s in enumerate(streams):
                      print(f"[{i+1}/{len(streams)}] {s['name'][:40]}...", end=' ')
                      
                      result = self.test_ffprobe(s['url'], proxy)
                      
                      if result == 'working':
                          working.append(s['name'])
                          print("OK")
                      elif result == 'geoblocked':
                          geoblocked.append(s['name'])
                          print("GEO")
                      else:
                          failed.append(s['name'])
                          print(f"FAIL({result})")
                      
                      time.sleep(0.25)
                      
                      if i > 0 and i % 10 == 0:
                          delay = random.uniform(1.5, 2.5)
                          print(f"  Pause {delay:.1f}s...")
                          time.sleep(delay)
                      
                      if (i+1) % 20 == 0:
                          print(f"  Progress: {len(working)}/{i+1} ({len(working)/(i+1)*100:.1f}%)")
                  
                  rate = (len(working)/len(streams)*100) if streams else 0
                  print(f"\n{name}: {len(working)}/{len(streams)} ({rate:.1f}%)")
                  return {'working': working, 'geoblocked': geoblocked, 'failed': failed, 'rate': rate, 'info': info}

              def generate_report(self):
                  now = datetime.now(timezone.utc)
                  dur = (time.time() - self.start) / 60
                  
                  entry = {
                      'date': now.strftime('%Y-%m-%d %H:%M UTC'),
                      'country': COUNTRY,
                      'ip': CONNECTED_IP,
                      'config': f"S:{SAMPLE_SIZE},V:{CHECK_VODS},P:{CHECK_PPV},F:{CHECK_FAST}",
                      'duration': f"{dur:.1f}min",
                      'results': {}
                  }
                  
                  for k, v in self.results.items():
                      total = len(v['working']) + len(v['geoblocked']) + len(v['failed'])
                      entry['results'][k] = {'rate': v['rate'], 'working': len(v['working']), 'total': total}
                  
                  self.history['tests'].append(entry)
                  if len(self.history['tests']) > 50:
                      self.history['tests'] = self.history['tests'][-50:]
                  
                  r = f"# VPN Stream Test - Historical Tracking\n\n"
                  r += f"**Last tested:** {COUNTRY}\n"
                  r += f"**Last update:** {now.strftime('%Y-%m-%d %H:%M UTC')}\n"
                  r += f"**Duration:** {dur:.1f} minutes\n"
                  r += f"**Config:** Sample={SAMPLE_SIZE}, VODs={'Y' if CHECK_VODS else 'N'}, PPV={'Y' if CHECK_PPV else 'N'}, FAST={'Y' if CHECK_FAST else 'N'}\n"
                  r += f"**Total historical tests:** {len(self.history['tests'])}\n\n"
                  
                  r += "## Latest Test Results\n\n"
                  r += "| Location | Working | Geo-blocked | Failed | Total | Success Rate |\n"
                  r += "|----------|---------|-------------|--------|-------|-------------|\n"
                  
                  for k, v in self.results.items():
                      loc = "Direct" if k == 'direct' else f"{COUNTRY} VPN (Premium)"
                      w, g, f = len(v['working']), len(v['geoblocked']), len(v['failed'])
                      t = w + g + f
                      r += f"| {loc} | {w} | {g} | {f} | {t} | **{v['rate']:.1f}%** |\n"
                  
                  r += "\n## Historical Analysis\n\n"
                  
                  uk = [t for t in self.history['tests'] if t['country'] == 'UK']
                  us = [t for t in self.history['tests'] if t['country'] == 'US']
                  
                  if uk:
                      uk_avg = sum(t['results'].get('vpn', {}).get('rate', 0) for t in uk) / len(uk)
                      uk_last = uk[-1]['results'].get('vpn', {}).get('rate', 0)
                      r += f"**UK VPN**\n"
                      r += f"- Tests: {len(uk)}\n"
                      r += f"- Average: {uk_avg:.1f}%\n"
                      r += f"- Latest: {uk_last:.1f}%\n\n"
                  
                  if us:
                      us_avg = sum(t['results'].get('vpn', {}).get('rate', 0) for t in us) / len(us)
                      us_last = us[-1]['results'].get('vpn', {}).get('rate', 0)
                      r += f"**US VPN**\n"
                      r += f"- Tests: {len(us)}\n"
                      r += f"- Average: {us_avg:.1f}%\n"
                      r += f"- Latest: {us_last:.1f}%\n\n"
                  
                  if uk and us:
                      r += f"**Recommendation:** "
                      if uk_avg > us_avg:
                          r += f"UK VPN performs better (avg +{uk_avg-us_avg:.1f}%)\n"
                      elif us_avg > uk_avg:
                          r += f"US VPN performs better (avg +{us_avg-uk_avg:.1f}%)\n"
                      else:
                          r += f"UK and US VPN perform equally\n"
                      r += "\n"
                  
                  if 'direct' in self.results and 'vpn' in self.results:
                      imp = self.results['vpn']['rate'] - self.results['direct']['rate']
                      r += f"**Latest VPN Impact:** {imp:+.1f}% vs direct connection\n\n"
                  
                  r += "## Recent Test History\n\n"
                  r += "| Date | Country | Config | Duration | Success Rate | Improvement |\n"
                  r += "|------|---------|--------|----------|--------------|-------------|\n"
                  
                  for t in self.history['tests'][-15:]:
                      vpn_rate = t['results'].get('vpn', {}).get('rate', 0)
                      direct_rate = t['results'].get('direct', {}).get('rate', 0)
                      imp = f"+{vpn_rate-direct_rate:.1f}%" if direct_rate > 0 else "N/A"
                      r += f"| {t['date']} | {t['country']} | {t.get('config', 'N/A')} | {t.get('duration', 'N/A')} | {vpn_rate:.1f}% | {imp} |\n"
                  
                  if 'vpn' in self.results and self.results['vpn']['geoblocked']:
                      r += f"\n## Geo-blocked Streams ({len(self.results['vpn']['geoblocked'])})\n\n"
                      for s in self.results['vpn']['geoblocked'][:10]:
                          r += f"- {s}\n"
                      if len(self.results['vpn']['geoblocked']) > 10:
                          r += f"- ... and {len(self.results['vpn']['geoblocked'])-10} more\n"
                  
                  r += f"\n<!-- HIST\n{json.dumps(self.history, indent=2)}\n-->\n"
                  return r

              def run(self):
                  print(f"Start: {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')}")
                  print(f"Config: SIZE={SAMPLE_SIZE}, VODS={CHECK_VODS}, PPV={CHECK_PPV}, FAST={CHECK_FAST}")
                  
                  d = self.test_location("Direct", vpn=False)
                  if d: self.results['direct'] = d
                  
                  if VPN_READY:
                      v = self.test_location(f"{COUNTRY} VPN (Premium)", vpn=True)
                      if v: self.results['vpn'] = v
                  else:
                      print("\nVPN not ready")
                  
                  rep = self.generate_report()
                  with open('report.md', 'w') as f:
                      f.write(rep)
                  
                  dur = (time.time() - self.start) / 60
                  print(f"\n{'='*50}\nComplete - {dur:.1f} min\n{'='*50}")
                  for k, v in self.results.items():
                      n = "Direct" if k == 'direct' else f"{COUNTRY} VPN"
                      t = len(v['working']) + len(v['geoblocked']) + len(v['failed'])
                      print(f"{n:20}: {len(v['working'])}/{t} ({v['rate']:.1f}%)")

          StreamTester().run()
          ENDPY

      - name: Cleanup
        if: always()
        run: |
          docker stop gluetun || true
          docker rm gluetun || true
          docker network rm vpn-network || true

      - name: Commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          
          if [[ -f "report.md" ]]; then
            git add report.md
            git pull origin main --rebase || true
            if ! git diff --staged --quiet; then
              RATE=$(grep -oE "\*\*[0-9.]+%" report.md | grep -oE "[0-9.]+" | head -1 || echo "0")
              git commit -m "${{ env.COUNTRY_CODE }} VPN: ${RATE}% - $(date -u '+%m/%d %H:%M')"
              git push origin main
            fi
          fi
