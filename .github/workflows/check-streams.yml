                  report += f"- **🥊 PPV/Event Checking:** {'✅ Enabled' if CHECK_PPV else '❌ Disabled'} - Event groups automatically detected\n"
                  report += f"- **📺 FAST Checking:** {'✅ Enabled' if CHECK_FAST else '❌ Disabled'} - Groups containing 'FAST' automatically detected\n"
                  report += f"- **🌐 Proxy Support:** {'✅ Enabled' if USE_PROXIES else '❌ Disabled'} - Enhanced geo-blocking bypass\n"
                  if SETUP_TOR:
                      report += f"- **🔒 Tor Integration:** ✅ Enabled - Additional anonymity layer\n"
                  report += f"- **⏱️ Timeout:** {TIMEOUT_SECONDS} seconds per stream (PPV gets 2x timeout)\n"
                  if USE_PROXIES:
                      report += f"- **🎯 Proxy Targets:** Test up to {MAX_PROXIES} to find {TARGET_WORKING_PROXIES} working\n"
                  report += "\n"
                  
                  # Manual testing options
                  report += f"## 🎮 Manual Testing Options\n\n"
                  report += f"To test specific content types:\n"
                  report += f"1. Go to **Actions** → **Check M3U Streams - Enhanced Version** → **Run workflow**\n"
                  report += f"2. Toggle **🎬 Check VODs** to test video-on-demand content\n"
                  report += f"3. Toggle **🥊 Check PPV** to test Pay-Per-View channels\n"
