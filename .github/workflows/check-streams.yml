name: Realistic IPTV Stream Checker

on:
  workflow_dispatch:
    inputs:
      sample_size:
        description: 'Sample size (0=all, 200=recommended)'
        required: false
        default: '200'
        type: string
      validation_mode:
        description: 'Validation strictness'
        required: false
        default: 'permissive'
        type: choice
        options:
        - permissive
        - balanced
        - strict
  schedule:
    - cron: '0 */12 * * *'

permissions:
  contents: write

jobs:
  realistic-stream-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Realistic IPTV Stream Validation
        env:
          SAMPLE_SIZE: ${{ github.event.inputs.sample_size || '200' }}
          VALIDATION_MODE: ${{ github.event.inputs.validation_mode || 'permissive' }}
        run: |
          python - << 'EOF'
          import requests
          import os
          import re
          import time
          import random
          from datetime import datetime, timezone
          from urllib.parse import urlparse

          SAMPLE_SIZE = int(os.getenv('SAMPLE_SIZE', '200'))
          VALIDATION_MODE = os.getenv('VALIDATION_MODE', 'permissive')

          print(f"Realistic IPTV Validation - Mode: {VALIDATION_MODE}, Sample: {SAMPLE_SIZE}")

          class RealisticStreamChecker:
              def __init__(self):
                  self.start_time = time.time()
                  self.results = {
                      'working': [],
                      'likely_working': [],
                      'geoblocked': [],
                      'definitely_failed': [],
                      'analysis': {}
                  }
                  
                  # Different validation strictness levels
                  self.validation_config = {
                      'permissive': {
                          'timeout': 2,
                          'accept_redirects': True,
                          'accept_partial_content': True,
                          'require_content_analysis': False
                      },
                      'balanced': {
                          'timeout': 3,
                          'accept_redirects': True,
                          'accept_partial_content': True,
                          'require_content_analysis': True
                      },
                      'strict': {
                          'timeout': 5,
                          'accept_redirects': False,
                          'accept_partial_content': False,
                          'require_content_analysis': True
                      }
                  }
                  
                  self.config = self.validation_config[VALIDATION_MODE]

              def analyze_url_pattern(self, url):
                  """Analyze URL to determine likely stream type and validation approach"""
                  analysis = {
                      'type': 'unknown',
                      'confidence': 'low',
                      'validation_method': 'http_test'
                  }
                  
                  url_lower = url.lower()
                  
                  # Xtream Codes patterns
                  if any(pattern in url_lower for pattern in ['xtream', '/live/', '/movie/', '/series/']):
                      if re.search(r'/live/[^/]+/[^/]+/\d+', url):
                          analysis.update({
                              'type': 'xtream_live',
                              'confidence': 'high',
                              'validation_method': 'xtream_api'
                          })
                      elif re.search(r'/movie/[^/]+/[^/]+/\d+', url):
                          analysis.update({
                              'type': 'xtream_vod',
                              'confidence': 'high',
                              'validation_method': 'xtream_api'
                          })
                  
                  # Direct stream patterns
                  elif any(ext in url_lower for ext in ['.m3u8', '.ts', '.mp4', '.mkv']):
                      analysis.update({
                          'type': 'direct_stream',
                          'confidence': 'high',
                          'validation_method': 'direct_test'
                      })
                  
                  # HLS playlist patterns
                  elif 'playlist' in url_lower or 'index' in url_lower:
                      analysis.update({
                          'type': 'hls_playlist',
                          'confidence': 'medium',
                          'validation_method': 'playlist_test'
                      })
                  
                  # Generic HTTP streams
                  elif url.startswith('http'):
                      analysis.update({
                          'type': 'http_stream',
                          'confidence': 'medium',
                          'validation_method': 'http_test'
                      })
                  
                  return analysis

              def validate_xtream_api(self, url, analysis):
                  """Validate Xtream Codes API endpoints"""
                  try:
                      # For Xtream APIs, HEAD request is usually sufficient
                      response = requests.head(url, timeout=self.config['timeout'], allow_redirects=True)
                      
                      # Xtream APIs typically return specific status codes
                      if response.status_code == 200:
                          return 'working', f"Xtream API endpoint accessible"
                      elif response.status_code == 403:
                          return 'geoblocked', f"Access forbidden (403)"
                      elif response.status_code == 404:
                          return 'failed', f"Stream not found (404)"
                      elif 300 <= response.status_code < 400:
                          return 'working', f"Xtream API redirect ({response.status_code})"
                      else:
                          # Try GET request as fallback
                          try:
                              get_response = requests.get(url, timeout=self.config['timeout'], stream=True)
                              if get_response.status_code == 200:
                                  return 'likely_working', f"Xtream GET successful"
                          except:
                              pass
                          return 'failed', f"Xtream API error ({response.status_code})"
                          
                  except requests.exceptions.ConnectionError:
                      return 'failed', 'Connection failed'
                  except requests.exceptions.Timeout:
                      return 'failed', 'Connection timeout'
                  except Exception as e:
                      return 'failed', f'Exception: {str(e)[:30]}'

              def validate_direct_stream(self, url, analysis):
                  """Validate direct stream URLs"""
                  try:
                      response = requests.get(url, stream=True, timeout=self.config['timeout'])
                      
                      if response.status_code == 403:
                          return 'geoblocked', 'Access forbidden (403)'
                      elif response.status_code != 200:
                          return 'failed', f'HTTP {response.status_code}'
                      
                      # Check content if required
                      if self.config['require_content_analysis']:
                          try:
                              content_sample = next(response.iter_content(2048), b'')
                              if len(content_sample) < 100:
                                  return 'failed', 'No content received'
                              
                              # Basic content analysis
                              if b'<html' in content_sample.lower():
                                  return 'failed', 'HTML page (not stream)'
                              
                              return 'working', f'Stream content validated ({len(content_sample)}B)'
                          except:
                              return 'likely_working', 'Stream accessible (content check failed)'
                      else:
                          return 'working', 'Stream accessible'
                          
                  except requests.exceptions.ConnectionError:
                      return 'failed', 'Connection failed'
                  except requests.exceptions.Timeout:
                      return 'failed', 'Connection timeout'
                  except Exception as e:
                      return 'failed', f'Exception: {str(e)[:30]}'

              def validate_stream_realistic(self, stream):
                  """Main validation logic that minimizes false negatives"""
                  url = stream['url']
                  name = stream['name']
                  
                  # Analyze URL pattern
                  analysis = self.analyze_url_pattern(url)
                  
                  # Choose validation method based on analysis
                  if analysis['validation_method'] == 'xtream_api':
                      status, reason = self.validate_xtream_api(url, analysis)
                  else:
                      status, reason = self.validate_direct_stream(url, analysis)
                  
                  return {
                      'status': status,
                      'reason': reason,
                      'analysis': analysis,
                      'url_type': analysis['type'],
                      'confidence': analysis['confidence']
                  }

              def parse_m3u_fast(self, file_path):
                  """Fast M3U parsing"""
                  if not os.path.exists(file_path):
                      return []
                      
                  streams = []
                  try:
                      with open(file_path, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()
                      
                      # Quick regex parsing
                      extinf_pattern = r'#EXTINF:[^,]*,([^\n\r]*)'
                      url_pattern = r'(https?://[^\s\n\r]+)'
                      
                      extinf_matches = re.finditer(extinf_pattern, content)
                      urls = re.findall(url_pattern, content)
                      
                      extinf_list = [match.group(1).strip() for match in extinf_matches]
                      
                      for i, name in enumerate(extinf_list):
                          if i < len(urls):
                              # Extract group from extinf line if available
                              group_match = re.search(r'group-title="([^"]*)"', content[content.find(name)-200:content.find(name)])
                              group = group_match.group(1) if group_match else "Unknown"
                              
                              streams.append({
                                  'name': name or f"Stream {i+1}",
                                  'url': urls[i],
                                  'group': group
                              })
                              
                  except Exception as e:
                      print(f"Error parsing M3U: {e}")
                      return []
                  
                  return streams

              def run_validation(self):
                  """Run realistic validation"""
                  streams = self.parse_m3u_fast('channel playlist.m3u')
                  if not streams:
                      print("No streams found!")
                      return
                  
                  if SAMPLE_SIZE > 0 and len(streams) > SAMPLE_SIZE:
                      streams = random.sample(streams, SAMPLE_SIZE)
                  
                  print(f"Testing {len(streams)} streams with {VALIDATION_MODE} validation")
                  
                  # Track URL patterns for analysis
                  url_patterns = {}
                  
                  for i, stream in enumerate(streams):
                      print(f"[{i+1}/{len(streams)}] {stream['name'][:50]}...")
                      
                      result = self.validate_stream_realistic(stream)
                      
                      # Track patterns
                      url_type = result['url_type']
                      url_patterns[url_type] = url_patterns.get(url_type, 0) + 1
                      
                      # Categorize results
                      stream_data = {
                          'name': stream['name'],
                          'group': stream['group'],
                          'url': stream['url'],
                          'url_type': result['url_type'],
                          'confidence': result['confidence'],
                          'reason': result['reason']
                      }
                      
                      if result['status'] == 'working':
                          self.results['working'].append(stream_data)
                          print(f"  ✅ WORKING ({result['url_type']})")
                      elif result['status'] == 'likely_working':
                          self.results['likely_working'].append(stream_data)
                          print(f"  ⚠️ LIKELY WORKING ({result['url_type']})")
                      elif result['status'] == 'geoblocked':
                          self.results['geoblocked'].append(stream_data)
                          print(f"  🔒 GEO-BLOCKED")
                      else:
                          self.results['definitely_failed'].append(stream_data)
                          print(f"  ❌ FAILED ({result['reason'][:30]})")
                      
                      time.sleep(0.05)  # Brief pause
                  
                  # Store analysis
                  self.results['analysis'] = {
                      'url_patterns': url_patterns,
                      'validation_mode': VALIDATION_MODE,
                      'total_tested': len(streams)
                  }

              def generate_enhanced_report(self):
                  """Generate report with actionable insights"""
                  duration = time.time() - self.start_time
                  
                  working_count = len(self.results['working'])
                  likely_count = len(self.results['likely_working'])
                  geo_count = len(self.results['geoblocked'])
                  failed_count = len(self.results['definitely_failed'])
                  total = working_count + likely_count + geo_count + failed_count
                  
                  # Calculate success rates
                  definite_success_rate = (working_count / total * 100) if total > 0 else 0
                  likely_success_rate = ((working_count + likely_count) / total * 100) if total > 0 else 0
                  
                  report = f"# Realistic IPTV Stream Validation Report\n\n"
                  report += f"**Generated:** {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}  \n"
                  report += f"**Duration:** {duration:.1f}s ({duration/60:.1f}m)  \n"
                  report += f"**Validation Mode:** {VALIDATION_MODE.title()}  \n"
                  report += f"**Sample Size:** {total} streams  \n\n"
                  
                  # Executive Summary with realistic categories
                  report += "## Validation Results\n\n"
                  report += f"- **✅ Definitely Working:** {working_count} ({definite_success_rate:.1f}%)\n"
                  report += f"- **⚠️ Likely Working:** {likely_count} ({(likely_count/total*100) if total > 0 else 0:.1f}%)\n"
                  report += f"- **🔒 Geo-blocked:** {geo_count} ({(geo_count/total*100) if total > 0 else 0:.1f}%)\n"
                  report += f"- **❌ Definitely Failed:** {failed_count} ({(failed_count/total*100) if total > 0 else 0:.1f}%)\n\n"
                  
                  report += f"**Conservative Success Rate:** {definite_success_rate:.1f}% (definitely working only)  \n"
                  report += f"**Optimistic Success Rate:** {likely_success_rate:.1f}% (including likely working)  \n\n"
                  
                  # URL Pattern Analysis
                  patterns = self.results['analysis']['url_patterns']
                  if patterns:
                      report += "## Stream URL Analysis\n\n"
                      for pattern, count in sorted(patterns.items(), key=lambda x: x[1], reverse=True):
                          percentage = (count / total * 100) if total > 0 else 0
                          report += f"- **{pattern.replace('_', ' ').title()}:** {count} streams ({percentage:.1f}%)\n"
                      report += "\n"
                  
                  # Success rate by pattern
                  pattern_success = {}
                  for category in ['working', 'likely_working']:
                      for stream in self.results[category]:
                          url_type = stream.get('url_type', 'unknown')
                          if url_type not in pattern_success:
                              pattern_success[url_type] = {'working': 0, 'likely': 0, 'total': 0}
                          pattern_success[url_type]['total'] += 1
                          if category == 'working':
                              pattern_success[url_type]['working'] += 1
                          else:
                              pattern_success[url_type]['likely'] += 1
                  
                  # Add failed counts
                  for category in ['geoblocked', 'definitely_failed']:
                      for stream in self.results[category]:
                          url_type = stream.get('url_type', 'unknown')
                          if url_type not in pattern_success:
                              pattern_success[url_type] = {'working': 0, 'likely': 0, 'total': 0}
                          pattern_success[url_type]['total'] += 1
                  
                  if pattern_success:
                      report += "## Success Rate by Stream Type\n\n"
                      report += "| Stream Type | Definitely Working | Likely Working | Total | Success Rate |\n"
                      report += "|-------------|-------------------|----------------|-------|-------------|\n"
                      
                      for url_type, stats in pattern_success.items():
                          if stats['total'] > 0:
                              success_rate = ((stats['working'] + stats['likely']) / stats['total'] * 100)
                              report += f"| {url_type.replace('_', ' ').title()} | {stats['working']} | {stats['likely']} | {stats['total']} | {success_rate:.1f}% |\n"
                      report += "\n"
                  
                  # Sample working streams
                  if self.results['working']:
                      report += "## Definitely Working Streams (Sample)\n\n"
                      for stream in self.results['working'][:10]:
                          name = stream['name'][:40]
                          url_type = stream.get('url_type', 'unknown').replace('_', ' ').title()
                          group = stream.get('group', 'Unknown')[:15]
                          report += f"- **{name}** ({url_type}) - {group}\n"
                      report += "\n"
                  
                  # Actionable recommendations
                  report += "## Actionable Recommendations for Reducing False Negatives\n\n"
                  
                  # Analyze failure patterns
                  if failed_count > working_count:
                      report += f"### High Failure Rate Detected ({(failed_count/total*100):.1f}%)\n\n"
                      
                      # Analyze failure reasons
                      failure_reasons = {}
                      for stream in self.results['definitely_failed']:
                          reason = stream.get('reason', 'Unknown')
                          key = reason.split('(')[0].strip()  # Simplify reason
                          failure_reasons[key] = failure_reasons.get(key, 0) + 1
                      
                      report += "**Top Failure Reasons:**\n"
                      for reason, count in sorted(failure_reasons.items(), key=lambda x: x[1], reverse=True)[:5]:
                          report += f"- {reason}: {count} streams\n"
                      
                      report += "\n**Recommended Actions:**\n"
                      
                      if failure_reasons.get('Connection timeout', 0) > 10:
                          report += f"- **Increase timeout values** - {failure_reasons['Connection timeout']} streams timed out\n"
                      
                      if failure_reasons.get('Connection failed', 0) > 10:
                          report += f"- **Check network connectivity** - {failure_reasons['Connection failed']} connection failures\n"
                      
                      if failure_reasons.get('Stream not found', 0) > 10:
                          report += f"- **Update stream source** - {failure_reasons['Stream not found']} streams return 404\n"
                      
                      if geo_count > working_count:
                          report += f"- **Implement geo-unblocking** - {geo_count} streams are geo-blocked\n"
                      
                      if VALIDATION_MODE != 'permissive':
                          report += f"- **Use permissive validation mode** - Current mode may be too strict\n"
                      
                      report += "\n"
                  
                  # Mode-specific recommendations
                  report += f"### Validation Mode Analysis\n\n"
                  if VALIDATION_MODE == 'strict':
                      report += f"**Current Mode: Strict**\n"
                      report += f"- High accuracy but may produce false negatives\n"
                      report += f"- Consider using 'balanced' mode for better coverage\n"
                      if likely_success_rate - definite_success_rate > 10:
                          report += f"- {likely_success_rate - definite_success_rate:.1f}% additional streams might be working\n"
                  elif VALIDATION_MODE == 'balanced':
                      report += f"**Current Mode: Balanced**\n"
                      report += f"- Good compromise between accuracy and coverage\n"
                      if definite_success_rate < 30:
                          report += f"- Consider 'permissive' mode if you need higher success rates\n"
                  else:
                      report += f"**Current Mode: Permissive**\n"
                      report += f"- Minimizes false negatives, may include some questionable streams\n"
                      report += f"- Good for discovering maximum working stream count\n"
                  
                  report += "\n### Next Steps to Improve Validation\n\n"
                  
                  # Specific technical recommendations
                  xtream_count = pattern_success.get('xtream_live', {}).get('total', 0) + pattern_success.get('xtream_vod', {}).get('total', 0)
                  if xtream_count > total * 0.5:
                      report += f"1. **Xtream Codes Optimization** ({xtream_count} streams detected)\n"
                      report += f"   - Implement Xtream API authentication\n"
                      report += f"   - Use GET requests instead of HEAD for better compatibility\n"
                      report += f"   - Add User-Agent rotation\n\n"
                  
                  if geo_count > 0:
                      report += f"2. **Geo-blocking Mitigation** ({geo_count} blocked streams)\n"
                      report += f"   - Test with proxy services\n"
                      report += f"   - Implement VPN rotation\n"
                      report += f"   - Use residential IP addresses\n\n"
                  
                  if duration > 300:  # 5 minutes
                      report += f"3. **Performance Optimization**\n"
                      report += f"   - Current rate: {(total/duration):.2f} streams/second\n"
                      report += f"   - Implement parallel processing\n"
                      report += f"   - Reduce timeout values\n"
                      report += f"   - Use connection pooling\n\n"
                  
                  report += f"4. **Alternative Validation Methods**\n"
                  report += f"   - Test with actual media players (VLC, ffmpeg)\n"
                  report += f"   - Implement playlist analysis for HLS streams\n"
                  report += f"   - Use deep packet inspection\n"
                  report += f"   - Consider crowd-sourced validation\n\n"
                  
                  # Final analysis
                  report += "## Validation Accuracy Analysis\n\n"
                  report += f"This validation prioritizes **reducing false negatives** over perfect accuracy.\n\n"
                  
                  if likely_success_rate > 60:
                      report += f"**Result: Good ({likely_success_rate:.1f}% likely working)**\n"
                      report += f"- Most streams appear accessible\n"
                      report += f"- Current validation method is working well\n"
                  elif likely_success_rate > 40:
                      report += f"**Result: Moderate ({likely_success_rate:.1f}% likely working)**\n"
                      report += f"- Decent stream availability\n"
                      report += f"- Room for optimization using recommendations above\n"
                  else:
                      report += f"**Result: Poor ({likely_success_rate:.1f}% likely working)**\n"
                      report += f"- Stream source may have issues\n"
                      report += f"- Implement multiple recommendations above\n"
                  
                  report += f"\n**Key Insight:** The difference between 'definitely working' ({definite_success_rate:.1f}%) and 'likely working' ({likely_success_rate:.1f}%) suggests {likely_success_rate - definite_success_rate:.1f}% of streams might work with different validation approaches.\n\n"
                  
                  report += f"---\n"
                  report += f"*Realistic validation completed in {duration:.1f} seconds*\n"
                  
                  return report

              def run(self):
                  """Main execution"""
                  self.run_validation()
                  
                  report = self.generate_enhanced_report()
                  
                  try:
                      with open('report.md', 'w', encoding='utf-8') as f:
                          f.write(report)
                      print("Enhanced report generated!")
                  except Exception as e:
                      print(f"Report error: {e}")
                  
                  # Summary
                  duration = time.time() - self.start_time
                  working = len(self.results['working'])
                  likely = len(self.results['likely_working'])
                  total = working + likely + len(self.results['geoblocked']) + len(self.results['definitely_failed'])
                  
                  print(f"\nREALISTIC VALIDATION COMPLETE")
                  print(f"Duration: {duration:.1f}s")
                  print(f"Definitely working: {working}/{total} ({(working/total*100) if total > 0 else 0:.1f}%)")
                  print(f"Likely working: {working + likely}/{total} ({((working + likely)/total*100) if total > 0 else 0:.1f}%)")

          checker = RealisticStreamChecker()
          checker.run()
          EOF

      - name: Commit validation report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          
          if [[ -f "report.md" ]]; then
            git add .
            git pull origin main --no-rebase || echo "Pull failed"
            git add report.md
            
            if ! git diff --staged --quiet; then
              WORKING=$(grep -oE "Definitely Working.*\([0-9.]+%" report.md | grep -oE "[0-9]+" | head -1 || echo "0")
              LIKELY=$(grep -oE "Optimistic Success Rate.*[0-9.]+%" report.md | grep -oE "[0-9.]+" | head -1 || echo "0")
              
              if ! [[ "$WORKING" =~ ^[0-9]+$ ]]; then WORKING="0"; fi
              if ! [[ "$LIKELY" =~ ^[0-9.]+$ ]]; then LIKELY="0"; fi
              
              COMMIT_MSG="Realistic IPTV check: ${WORKING}% definite, ${LIKELY}% likely working"
              COMMIT_MSG="$COMMIT_MSG - $(date -u '+%m/%d %H:%M UTC')"
              
              git commit -m "$COMMIT_MSG"
              git push origin main
            fi
          fi
