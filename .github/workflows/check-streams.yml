                  if CHECK_VODS: types.append("VODs")
                  if CHECK_PPV: types.append("PPV") 
                  if CHECK_FAST: types.append("FAST")
                  if not types: types.append("Channels only")
                  report += ", ".join(types) + "\n"
                  
                  report += f"\n## 🎮 Manual Testing\n\n"
                  report += f"Run workflow with different settings:\n"
                  report += f"- Toggle **⚡ Quick Mode** for speed vs thoroughness\n"
                  report += f"- Enable content types: **🎬 VODs**, **🥊 PPV**, **📺 FAST**\n"
                  report += f"- Adjust **🎯 Target Proxies** (5-20 recommended)\n"
                  report += f"- Try **🔒 Tor** for additional anonymity\n\n"
                  
                  report += f"---\n"
                  report += f"*Last updated: {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S')} UTC*\n"
                  report += f"*Optimized for speed with {len(self.working_proxies)} proxies*\n"
                  
                  return report

              async def run(self):
                  """Main optimized execution"""
                  print("⚡ Starting Optimized Stream Checker...")
                  
                  # Parse M3U
                  streams = self.parse_m3u_fast('channel playlist.m3u')
                  if not streams:
                      print("❌ No streams found!")
                      return
                  
                  print(f"📊 Found {len(streams)} total streams")
                  
                  # Setup proxies (faster)
                  if USE_PROXIES:
                      self.setup_optimized_proxies()
                  
                  # Process streams (optimized)
                  await self.process_streams_optimized(streams)
                  
                  # Generate report
                  print("📝 Generating optimized report...")
                  report = self.generate_optimized_report()
                  
                  try:
                      with open('report.md', 'w', encoding='utf-8') as f:
                          f.write(report)
                      print("✅ Report saved successfully")
                  except Exception as e:
                      print(f"❌ Error saving report: {e}")
                      return
                  
                  # Final summary
                  duration = time.time() - self.start_time
                  total_working = len(self.regular_working) + len(self.geo_working)
                  total_checked = len(self.regular_working) + len(self.regular_failed) + len(self.geo_working) + len(self.geo_failed)
                  
                  print(f"\n" + "="*60)
                  print(f"⚡ OPTIMIZED CHECK COMPLETE")
                  print(f"="*60)
                  print(f"⏱️ Duration: {duration:.1f}s (vs {duration/60:.1f}m)")
                  print(f"📊 Results: {total_working}/{total_checked} working ({(total_working/total_checked*100) if total_checked > 0 else 0:.1f}%)")
                  if self.working_proxies:
                      print(f"🌐 Proxies: {len(self.working_proxies)} working")
                      print(f"🎯 Geo-recovery: {len(self.geo_working)} streams")
                  print(f"📄 Report: {os.path.getsize('report.md')} bytes")
                  print(f"="*60)

          # Execute optimized checker
          checker = OptimizedStreamChecker()
          asyncio.run(checker.run())
          EOF
          
          # Verify success
          if [ $? -eq 0 ]; then
            echo "✅ Optimized script completed"
            if [ -f "report.md" ]; then
              echo "📊 Report size: $(wc -c < report.md) bytes"
              echo "📋 Report preview:"
              head -8 report.md
            else
              echo "❌ Report missing!"
              exit 1
            fi
          else
            echo "❌ Script failed"
            exit 1
          fi

      - name: 📤 Commit optimized report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          
          if [[ -f "report.md" ]]; then
            echo "✅ Optimized report ready"
            
            git pull origin main --rebase || {
              git reset --hard HEAD
              git pull origin main
            }
            
            git add report.md
            if ! git diff --staged --quiet; then
              # Build commit message
              COMMIT_MSG="⚡ Optimized stream check"
              
              if [[ "${QUICK_MODE:-true}" == "true" ]]; then
                COMMIT_MSG="$COMMIT_MSG (quick)"
              fi
              
              if [[ "${CHECK_VODS:-false}" == "true" ]]; then
                COMMIT_MSG="$COMMIT_MSG +VODs"
              fi
              if [[ "${CHECK_PPV:-false}" == "true" ]]; then
                COMMIT_MSG="$COMMIT_MSG +PPV" 
              fi
              if [[ "${CHECK_FAST:-false}" == "true" ]]; then
                COMMIT_MSG="$COMMIT_MSG +FAST" 
              fi
              
              COMMIT_MSG="$COMMIT_MSG - $(date -u '+%m/%d %H:%M')"
              
              git commit -m "$COMMIT_MSG"
              
              # Push with retry
              for i in {1..3}; do
                if git push origin main; then
                  echo "✅ Optimized report pushed (attempt $i)"
                  break
                else
                  if [ $i -lt 3 ]; then
                    sleep 2
                    git pull origin main --rebase || git reset --hard HEAD~1 && git pull origin main && git add report.md && git commit -m "$COMMIT_MSG"
                  else
                    echo "❌ Push failed after 3 attempts"
                    exit 1
                  fi
                fi
              done
            else
              echo "ℹ️ No changes to commit"
            fi
          else
            echo "❌ Report file missing"
            exit 1
          fi
