name: IPTV Stream Checker - Fixed Validation

on:
  workflow_dispatch:
    inputs:
      check_vods:
        description: 'Check VOD files (URLs ending with #.mkv)'
        required: false
        default: false
        type: boolean
      check_ppv:
        description: 'Check PPV channels (may be offline)'
        required: false
        default: false
        type: boolean
      check_fast:
        description: 'Check FAST channels (Free Ad-Supported TV)'
        required: false
        default: false
        type: boolean
      timeout_seconds:
        description: 'Timeout per stream (seconds)'
        required: false
        default: '8'
        type: string
      sample_size:
        description: 'Sample size (0=all streams, 500=recommended)'
        required: false
        default: '500'
        type: string
      debug_mode:
        description: 'Enable debug mode for failed streams'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 */12 * * *'

permissions:
  contents: write

jobs:
  improved-stream-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg curl
          python -m pip install --upgrade pip
          pip install requests
          
          # Verify installations
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Fixed IPTV Stream Validation
        env:
          CHECK_VODS: ${{ github.event.inputs.check_vods || 'false' }}
          CHECK_PPV: ${{ github.event.inputs.check_ppv || 'false' }}
          CHECK_FAST: ${{ github.event.inputs.check_fast || 'false' }}
          TIMEOUT_SECONDS: ${{ github.event.inputs.timeout_seconds || '8' }}
          SAMPLE_SIZE: ${{ github.event.inputs.sample_size || '500' }}
          DEBUG_MODE: ${{ github.event.inputs.debug_mode || 'false' }}
        run: |
          python - << 'EOF'
          import requests
          import subprocess
          import os
          import re
          import time
          import random
          import json
          import socket
          from datetime import datetime, timezone
          from urllib.parse import urlparse

          # Configuration
          CHECK_VODS = os.getenv('CHECK_VODS', 'false').lower() == 'true'
          CHECK_PPV = os.getenv('CHECK_PPV', 'false').lower() == 'true'
          CHECK_FAST = os.getenv('CHECK_FAST', 'false').lower() == 'true'
          TIMEOUT_SECONDS = int(os.getenv('TIMEOUT_SECONDS', '8'))
          SAMPLE_SIZE = int(os.getenv('SAMPLE_SIZE', '500'))
          DEBUG_MODE = os.getenv('DEBUG_MODE', 'false').lower() == 'true'

          print(f"Fixed IPTV Stream Validation Starting...")
          print(f"Config: VODs={CHECK_VODS}, PPV={CHECK_PPV}, FAST={CHECK_FAST}")
          print(f"Timeout: {TIMEOUT_SECONDS}s, Sample: {SAMPLE_SIZE if SAMPLE_SIZE > 0 else 'All'}")
          print(f"Debug mode: {DEBUG_MODE}")

          class ImprovedStreamChecker:
              def __init__(self):
                  self.start_time = time.time()
                  self.results = {
                      'working': [],
                      'geoblocked': [],
                      'failed': [],
                      'timeout': [],
                      'debug_info': []
                  }
                  self.user_agents = [
                      'VLC/3.0.12 LibVLC/3.0.12',
                      'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                      'ffmpeg/4.4.0',
                      'IPTVChecker/2.0'
                  ]

              def classify_stream_type(self, stream):
                  """Classify stream type"""
                  url = stream['url']
                  name = stream['name'].lower()
                  group = stream['group'].lower()
                  
                  if url.endswith('#.mkv'):
                      return 'VOD'
                  elif any(x in group for x in ['uk events', 'usa events', 'events', 'ppv']):
                      return 'PPV'
                  elif 'fast' in group:
                      return 'FAST'
                  else:
                      return 'Channel'

              def should_test_stream(self, stream):
                  """Check if stream should be tested"""
                  stream_type = self.classify_stream_type(stream)
                  
                  if stream_type == 'VOD' and not CHECK_VODS:
                      return False
                  elif stream_type == 'PPV' and not CHECK_PPV:
                      return False
                  elif stream_type == 'FAST' and not CHECK_FAST:
                      return False
                  
                  return True

              def test_connectivity(self, url):
                  """Test basic connectivity to host"""
                  try:
                      parsed = urlparse(url)
                      host = parsed.hostname
                      port = parsed.port or (443 if parsed.scheme == 'https' else 80)
                      
                      sock = socket.create_connection((host, port), timeout=3)
                      sock.close()
                      return True, "Connected"
                  except Exception as e:
                      return False, f"Connection failed: {str(e)[:50]}"

              def relaxed_http_check(self, url):
                  """More permissive HTTP validation"""
                  for ua in self.user_agents:
                      try:
                          headers = {'User-Agent': ua}
                          response = requests.get(url, stream=True, timeout=TIMEOUT_SECONDS, 
                                                headers=headers, allow_redirects=True)
                          
                          # Check status code
                          if response.status_code == 403:
                              return 'Geoblocked', 403, 0, ua
                          elif response.status_code == 404:
                              continue  # Try next user agent
                          elif response.status_code != 200:
                              continue  # Try next user agent
                          
                          # Download and analyze content
                          data_chunk = b''
                          try:
                              for chunk in response.iter_content(chunk_size=4096):
                                  data_chunk += chunk
                                  if len(data_chunk) > 16384:  # 16KB sample
                                      break
                              
                              if len(data_chunk) < 512:
                                  continue  # Too little data, try next UA
                              
                              # Analyze content
                              is_html = (b'<html' in data_chunk.lower() or 
                                       b'<!doctype' in data_chunk.lower() or
                                       b'<title>' in data_chunk.lower())
                              
                              # Check for binary content (likely video)
                              binary_ratio = len([b for b in data_chunk if b > 127]) / len(data_chunk)
                              
                              if not is_html and binary_ratio > 0.1:
                                  return 'Working', response.status_code, len(data_chunk), ua
                              elif not is_html and len(data_chunk) > 8192:
                                  # Might be text-based stream format (m3u8 content)
                                  if b'm3u8' in data_chunk.lower() or b'#extinf' in data_chunk.lower():
                                      return 'Working', response.status_code, len(data_chunk), ua
                                  
                          except requests.exceptions.RequestException:
                              continue
                              
                      except requests.exceptions.Timeout:
                          continue
                      except requests.exceptions.RequestException:
                          continue
                  
                  return 'Failed', None, 0, None

              def quick_ffprobe_test(self, url):
                  """Lightweight ffprobe test"""
                  try:
                      cmd = [
                          'ffprobe', '-v', 'error', '-timeout', f'{TIMEOUT_SECONDS * 1000000}',
                          '-show_streams', '-select_streams', 'v:0', url
                      ]
                      
                      result = subprocess.run(cmd, capture_output=True, 
                                            timeout=TIMEOUT_SECONDS + 2, text=True)
                      
                      if result.returncode == 0 and len(result.stdout.strip()) > 10:
                          return True, "Video stream detected"
                      else:
                          return False, f"No video streams: {result.stderr[:50] if result.stderr else 'Unknown'}"
                          
                  except subprocess.TimeoutExpired:
                      return False, "ffprobe timeout"
                  except Exception as e:
                      return False, f"ffprobe error: {str(e)[:50]}"

              def validate_stream_multi_method(self, stream):
                  """Multi-method validation approach"""
                  url = stream['url']
                  name = stream['name']
                  stream_type = self.classify_stream_type(stream)
                  
                  validation_log = []
                  
                  # Method 1: Connectivity test
                  conn_ok, conn_msg = self.test_connectivity(url)
                  validation_log.append(f"Connectivity: {'OK' if conn_ok else 'FAIL'} - {conn_msg}")
                  
                  if not conn_ok:
                      return {
                          'status': 'Failed',
                          'reason': f'No connectivity: {conn_msg}',
                          'log': validation_log,
                          'method': 'connectivity'
                      }
                  
                  # Method 2: HTTP validation
                  http_status, http_code, data_size, user_agent = self.relaxed_http_check(url)
                  validation_log.append(f"HTTP: {http_status} - {http_code} - {data_size}B - UA: {user_agent}")
                  
                  if http_status == 'Geoblocked':
                      return {
                          'status': 'Geoblocked',
                          'reason': f'HTTP {http_code} Forbidden',
                          'log': validation_log,
                          'method': 'http'
                      }
                  elif http_status == 'Working':
                      # HTTP validation passed, now try ffprobe for extra confirmation
                      ffprobe_ok, ffprobe_msg = self.quick_ffprobe_test(url)
                      validation_log.append(f"ffprobe: {'OK' if ffprobe_ok else 'FAIL'} - {ffprobe_msg}")
                      
                      return {
                          'status': 'Working',
                          'reason': f'HTTP validated ({data_size}B) with UA: {user_agent}',
                          'log': validation_log,
                          'method': 'http',
                          'ffprobe_confirmed': ffprobe_ok,
                          'data_size': data_size,
                          'user_agent': user_agent
                      }
                  
                  # Method 3: Direct ffprobe test (sometimes works when HTTP fails)
                  ffprobe_ok, ffprobe_msg = self.quick_ffprobe_test(url)
                  validation_log.append(f"Direct ffprobe: {'OK' if ffprobe_ok else 'FAIL'} - {ffprobe_msg}")
                  
                  if ffprobe_ok:
                      return {
                          'status': 'Working',
                          'reason': 'ffprobe detected video streams',
                          'log': validation_log,
                          'method': 'ffprobe'
                      }
                  
                  return {
                      'status': 'Failed',
                      'reason': 'All validation methods failed',
                      'log': validation_log,
                      'method': 'all_failed'
                  }

              def debug_failed_stream(self, stream):
                  """Debug a specific failed stream in detail"""
                  url = stream['url']
                  name = stream['name']
                  
                  debug_info = {
                      'name': name,
                      'url': url,
                      'tests': []
                  }
                  
                  print(f"\n=== DEBUGGING: {name} ===")
                  
                  # Test different approaches
                  methods = [
                      ('curl', ['curl', '-s', '-I', '--max-time', '5', url]),
                      ('wget', ['wget', '--spider', '--timeout=5', url]),
                      ('ffprobe_basic', ['ffprobe', '-v', 'error', '-timeout', '5000000', url]),
                      ('ffprobe_streams', ['ffprobe', '-v', 'error', '-show_streams', '-timeout', '5000000', url])
                  ]
                  
                  for method_name, cmd in methods:
                      try:
                          result = subprocess.run(cmd, capture_output=True, timeout=8, text=True)
                          success = result.returncode == 0
                          debug_info['tests'].append({
                              'method': method_name,
                              'success': success,
                              'returncode': result.returncode,
                              'stdout': result.stdout[:200] if result.stdout else '',
                              'stderr': result.stderr[:200] if result.stderr else ''
                          })
                          print(f"  {method_name}: {'✓' if success else '✗'} (code: {result.returncode})")
                      except subprocess.TimeoutExpired:
                          debug_info['tests'].append({
                              'method': method_name,
                              'success': False,
                              'error': 'timeout'
                          })
                          print(f"  {method_name}: ✗ (timeout)")
                      except Exception as e:
                          debug_info['tests'].append({
                              'method': method_name,
                              'success': False,
                              'error': str(e)[:100]
                          })
                          print(f"  {method_name}: ✗ ({e})")
                  
                  return debug_info

              def parse_m3u(self, file_path):
                  """Parse M3U file"""
                  if not os.path.exists(file_path):
                      print(f"M3U file not found: {file_path}")
                      return []
                      
                  streams = []
                  try:
                      with open(file_path, 'r', encoding='utf-8', errors='ignore') as f:
                          lines = f.readlines()
                  except Exception as e:
                      print(f"Error reading M3U file: {e}")
                      return []
                      
                  for i in range(len(lines)):
                      line = lines[i].strip()
                      if line.startswith('#EXTINF'):
                          try:
                              group_match = re.search(r'group-title="([^"]*)"', line)
                              group = group_match.group(1) if group_match else "No Group"
                              name = line.split(',')[-1].strip() if ',' in line else "Unknown"
                              
                              if i + 1 < len(lines):
                                  url = lines[i + 1].strip()
                                  if url and not url.startswith('#') and ('http' in url or 'rtmp' in url):
                                      streams.append({
                                          'name': name,
                                          'url': url,
                                          'group': group
                                      })
                          except Exception as e:
                              continue
                  
                  print(f"Parsed {len(streams)} streams from M3U file")
                  return streams

              def run_validation(self):
                  """Run improved validation"""
                  # Parse M3U
                  all_streams = self.parse_m3u('channel playlist.m3u')
                  if not all_streams:
                      print("No streams found in M3U file!")
                      return

                  # Filter streams based on type preferences
                  test_streams = [s for s in all_streams if self.should_test_stream(s)]
                  
                  # Apply sample size limit
                  if SAMPLE_SIZE > 0 and len(test_streams) > SAMPLE_SIZE:
                      test_streams = random.sample(test_streams, SAMPLE_SIZE)
                  
                  print(f"\nTesting {len(test_streams)} streams (from {len(all_streams)} total)")
                  
                  # Count by type
                  type_counts = {}
                  for stream in test_streams:
                      stream_type = self.classify_stream_type(stream)
                      type_counts[stream_type] = type_counts.get(stream_type, 0) + 1
                  
                  print("Stream types to test:")
                  for stream_type, count in type_counts.items():
                      if count > 0:
                          print(f"  {stream_type}: {count}")
                  
                  # Process streams
                  tested = 0
                  working_count = 0
                  
                  for stream in test_streams:
                      tested += 1
                      stream_type = self.classify_stream_type(stream)
                      name = stream['name']
                      
                      print(f"[{tested}/{len(test_streams)}] Testing: {name[:50]}... ({stream_type})")
                      
                      # Validate stream
                      result = self.validate_stream_multi_method(stream)
                      
                      # Process result
                      if result['status'] == 'Working':
                          working_count += 1
                          self.results['working'].append({
                              'name': name,
                              'type': stream_type,
                              'group': stream['group'],
                              'url': stream['url'],
                              'validation_method': result['method'],
                              'reason': result['reason'],
                              'ffprobe_confirmed': result.get('ffprobe_confirmed', False),
                              'data_size': result.get('data_size', 0),
                              'user_agent': result.get('user_agent', 'Unknown')
                          })
                          method = result['method']
                          ffprobe_status = "✓" if result.get('ffprobe_confirmed') else "?"
                          print(f"  ✅ WORKING ({method}) ffprobe:{ffprobe_status}")
                          
                      elif result['status'] == 'Geoblocked':
                          self.results['geoblocked'].append({
                              'name': name,
                              'type': stream_type,
                              'group': stream['group'],
                              'url': stream['url'],
                              'reason': result['reason']
                          })
                          print(f"  🔒 GEO-BLOCKED")
                          
                      else:
                          self.results['failed'].append({
                              'name': name,
                              'type': stream_type,
                              'group': stream['group'],
                              'url': stream['url'],
                              'reason': result['reason'],
                              'validation_log': result.get('log', [])
                          })
                          print(f"  ❌ FAILED")
                      
                      # Brief pause to avoid overwhelming servers
                      time.sleep(0.1)
                  
                  print(f"\nValidation completed: {working_count}/{len(test_streams)} working")
                  
                  # Debug mode: analyze some failed streams
                  if DEBUG_MODE and self.results['failed']:
                      print("\n" + "="*60)
                      print("DEBUG MODE: Analyzing failed streams")
                      print("="*60)
                      
                      # Debug first 3 failed streams
                      for stream in self.results['failed'][:3]:
                          debug_info = self.debug_failed_stream(stream)
                          self.results['debug_info'].append(debug_info)

              def generate_report(self):
                  """Generate validation report"""
                  duration = time.time() - self.start_time
                  
                  total_tested = (len(self.results['working']) + 
                                len(self.results['geoblocked']) + 
                                len(self.results['failed']))
                  
                  working_count = len(self.results['working'])
                  geo_count = len(self.results['geoblocked'])
                  failed_count = len(self.results['failed'])
                  
                  success_rate = (working_count / total_tested * 100) if total_tested > 0 else 0
                  
                  report = f"# Improved IPTV Stream Validation Report\n\n"
                  report += f"**Generated:** {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}  \n"
                  report += f"**Duration:** {duration:.1f}s ({duration/60:.1f}m)  \n"
                  report += f"**Method:** Multi-method validation (connectivity + HTTP + ffprobe)  \n"
                  report += f"**Sample:** {total_tested} streams tested  \n"
                  report += f"**Debug Mode:** {'Enabled' if DEBUG_MODE else 'Disabled'}  \n\n"
                  
                  # Executive Summary
                  report += "## Executive Summary\n\n"
                  report += f"- **✅ Working Streams:** {working_count} ({success_rate:.1f}%)\n"
                  report += f"- **🔒 Geo-blocked:** {geo_count} ({(geo_count/total_tested*100) if total_tested > 0 else 0:.1f}%)\n"
                  report += f"- **❌ Failed Streams:** {failed_count} ({(failed_count/total_tested*100) if total_tested > 0 else 0:.1f}%)\n"
                  report += f"- **📊 Total Tested:** {total_tested} streams\n\n"
                  
                  # Validation method breakdown
                  if self.results['working']:
                      method_counts = {}
                      ffprobe_confirmed = 0
                      
                      for stream in self.results['working']:
                          method = stream.get('validation_method', 'unknown')
                          method_counts[method] = method_counts.get(method, 0) + 1
                          if stream.get('ffprobe_confirmed'):
                              ffprobe_confirmed += 1
                      
                      report += "## Validation Method Analysis\n\n"
                      for method, count in method_counts.items():
                          percentage = (count / working_count * 100)
                          report += f"- **{method.upper()}:** {count} streams ({percentage:.1f}%)\n"
                      
                      report += f"\n**FFprobe Confirmation:** {ffprobe_confirmed}/{working_count} streams ({(ffprobe_confirmed/working_count*100):.1f}%)\n\n"
                  
                  # Working streams details
                  if self.results['working']:
                      report += "## Working Streams Sample\n\n"
                      report += "| Channel | Type | Method | FFprobe | User Agent | Group |\n"
                      report += "|---------|------|--------|---------|------------|--------|\n"
                      
                      for stream in self.results['working'][:15]:
                          name = stream['name'][:25].replace('|', '\\|')
                          stream_type = stream['type']
                          method = stream.get('validation_method', 'unknown')
                          ffprobe = "✓" if stream.get('ffprobe_confirmed') else "✗"
                          ua = stream.get('user_agent', 'Unknown')[:15]
                          group = stream['group'][:15].replace('|', '\\|')
                          
                          report += f"| {name} | {stream_type} | {method} | {ffprobe} | {ua} | {group} |\n"
                      
                      report += "\n"
                  
                  # Failed streams analysis
                  if self.results['failed']:
                      report += "## Failed Streams Analysis\n\n"
                      
                      # Count failure reasons
                      failure_reasons = {}
                      for stream in self.results['failed']:
                          reason = stream.get('reason', 'Unknown')[:50]
                          failure_reasons[reason] = failure_reasons.get(reason, 0) + 1
                      
                      report += "**Failure Reasons:**\n"
                      for reason, count in sorted(failure_reasons.items(), key=lambda x: x[1], reverse=True):
                          report += f"- {reason}: {count} streams\n"
                      
                      report += f"\n**Sample Failed Streams:**\n\n"
                      report += "| Channel | Type | Reason | Group |\n"
                      report += "|---------|------|--------|--------|\n"
                      
                      for stream in self.results['failed'][:10]:
                          name = stream['name'][:30].replace('|', '\\|')
                          stream_type = stream['type']
                          reason = stream.get('reason', 'Unknown')[:40].replace('|', '\\|')
                          group = stream['group'][:15].replace('|', '\\|')
                          
                          report += f"| {name} | {stream_type} | {reason} | {group} |\n"
                      
                      report += "\n"
                  
                  # Geo-blocked streams
                  if self.results['geoblocked']:
                      report += "## Geo-blocked Streams\n\n"
                      report += "| Channel | Type | Group |\n"
                      report += "|---------|------|---------|\n"
                      
                      for stream in self.results['geoblocked'][:10]:
                          name = stream['name'][:30].replace('|', '\\|')
                          stream_type = stream['type']
                          group = stream['group'][:15].replace('|', '\\|')
                          
                          report += f"| {name} | {stream_type} | {group} |\n"
                      
                      report += "\n"
                  
                  # Debug information
                  if DEBUG_MODE and self.results['debug_info']:
                      report += "## Debug Information\n\n"
                      for debug in self.results['debug_info']:
                          report += f"### {debug['name']}\n\n"
                          for test in debug['tests']:
                              status = "✓" if test['success'] else "✗"
                              method = test['method']
                              report += f"- **{method}:** {status}\n"
                              if 'error' in test:
                                  report += f"  - Error: {test['error']}\n"
                              elif test.get('returncode') != 0:
                                  report += f"  - Return code: {test['returncode']}\n"
                                  if test.get('stderr'):
                                      report += f"  - Error: {test['stderr'][:100]}\n"
                          report += "\n"
                  
                  # Recommendations
                  report += "## Recommendations\n\n"
                  
                  if success_rate < 10:
                      report += f"**Low Success Rate ({success_rate:.1f}%)**\n"
                      report += f"- Most streams appear to be offline or inaccessible\n"
                      report += f"- Consider using a VPN or proxy for geo-blocked content\n"
                      report += f"- Check if the stream source is still valid\n\n"
                  
                  if geo_count > working_count:
                      report += f"**High Geo-blocking Rate**\n"
                      report += f"- {geo_count} streams are geo-blocked\n"
                      report += f"- Consider implementing proxy support\n"
                      report += f"- Test from different geographic locations\n\n"
                  
                  report += f"**Performance:**\n"
                  if duration > 0:
                      rate = total_tested / duration
                      report += f"- Testing rate: {rate:.2f} streams/second\n"
                      report += f"- Average time per stream: {(duration/total_tested):.2f}s\n"
                  
                  report += f"\n## Methodology Improvements\n\n"
                  report += f"This validation uses a more permissive approach:\n"
                  report += f"- Tests connectivity before HTTP validation\n"
                  report += f"- Uses multiple User-Agent strings for better compatibility\n"
                  report += f"- Accepts various content types (binary data, m3u8 playlists)\n"
                  report += f"- Uses ffprobe for additional stream verification\n"
                  report += f"- Provides detailed debugging when enabled\n"
                  report += f"- Reduced false negatives compared to strict validation\n\n"
                  
                  report += f"---\n"
                  report += f"*Improved validation completed in {duration:.1f} seconds*\n"
                  
                  return report

              def run(self):
                  """Main execution function"""
                  print("Starting Improved IPTV Stream Validation...")
                  
                  # Run validation
                  self.run_validation()
                  
                  # Generate report
                  print("\nGenerating validation report...")
                  report = self.generate_report()
                  
                  # Save report
                  try:
                      with open('report.md', 'w', encoding='utf-8') as f:
                          f.write(report)
                      print("Report saved successfully!")
                  except Exception as e:
                      print(f"Error saving report: {e}")
                      with open('report.md', 'w', encoding='utf-8') as f:
                          f.write(f"# IPTV Validation Report\nError generating report: {e}\n")
                  
                  # Final summary
                  duration = time.time() - self.start_time
                  working = len(self.results['working'])
                  total = working + len(self.results['geoblocked']) + len(self.results['failed'])
                  
                  print(f"\n{'='*50}")
                  print(f"VALIDATION COMPLETE")
                  print(f"{'='*50}")
                  print(f"Duration: {duration:.1f}s")
                  print(f"Working: {working}/{total} ({(working/total*100) if total > 0 else 0:.1f}%)")
                  print(f"Geo-blocked: {len(self.results['geoblocked'])}")
                  print(f"Failed: {len(self.results['failed'])}")
                  if DEBUG_MODE:
                      print(f"Debug info collected for {len(self.results['debug_info'])} streams")

          # Run the improved checker
          checker = ImprovedStreamChecker()
          checker.run()
          EOF

      - name: Commit validation report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          
          if [[ -f "report.md" ]]; then
            # Handle any unstaged changes
            if ! git diff --quiet; then
              echo "Unstaged changes detected, adding them..."
              git add .
            fi
            
            # Pull latest changes with merge strategy
            git pull origin main --no-rebase || {
              echo "Pull failed, continuing with local changes..."
            }
            
            # Add the report file
            git add report.md
            
            # Check if there are changes to commit
            if ! git diff --staged --quiet; then
              # Extract metrics safely with regex validation
              WORKING=$(grep -o "Working Streams.*(" report.md 2>/dev/null | head -1 | grep -o '[0-9]\+' | head -1 || echo "0")
              TOTAL=$(grep -o "Total Tested.*(" report.md 2>/dev/null | head -1 | grep -o '[0-9]\+' | head -1 || echo "1")
              GEO=$(grep -o "Geo-blocked.*(" report.md 2>/dev/null | head -1 | grep -o '[0-9]\+' | head -1 || echo "0")
              
              # Validate extracted numbers
              if ! [[ "$WORKING" =~ ^[0-9]+$ ]]; then WORKING="0"; fi
              if ! [[ "$TOTAL" =~ ^[0-9]+$ ]] || [[ "$TOTAL" == "0" ]]; then TOTAL="1"; fi
              if ! [[ "$GEO" =~ ^[0-9]+$ ]]; then GEO="0"; fi
              
              # Calculate success rate safely
              SUCCESS_RATE=$(( WORKING * 100 / TOTAL ))
              
              # Build commit message
              COMMIT_MSG="IPTV validation - ${WORKING}/${TOTAL} working (${SUCCESS_RATE}%)"
              
              if [[ "$GEO" != "0" ]]; then
                COMMIT_MSG="$COMMIT_MSG, ${GEO} geo-blocked"
              fi
              
              COMMIT_MSG="$COMMIT_MSG - $(date -u '+%m/%d %H:%M UTC')"
              
              # Commit and push
              git commit -m "$COMMIT_MSG"
              git push origin main
              
              echo "Report committed successfully"
            else
              echo "No changes to commit"
            fi
          else
            echo "No report.md file found"
          fi
