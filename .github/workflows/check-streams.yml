                              'connection_refused': '🚫 Connection Refused',
                              'dns_error': '🌐 DNS Resolution Failed',
                              'auth_required': '🔐 Authentication Required (401)',
                              'rate_limited': '🚦 Rate Limited (429)',
                              'unknown_error': '❓ Unknown Errors',
                              'skipped': '⏭️ Skipped (Disabled content types)'
                          }
                          
                          category_title = category_names.get(category, category.title())
                          report += f"### {category_title} ({count} streams, {percentage:.1f}%)\n"
                          
                          if category == 'skipped':
                              # Group skipped by reason
                              skip_reasons = {}
                              for stream in streams:
                                  reason = stream.get('reason', 'Unknown')
                                  if reason not in skip_reasons:
                                      skip_reasons[reason] = []
                                  skip_reasons[reason].append(stream)
                              
                              for reason, reason_streams in skip_reasons.items():
                                  report += f"- **{reason}:** {len(reason_streams)} streams\n"
                          
                          elif count <= 20:  # Show details for smaller groups
                              report += "| Stream Name | Group | Type | Details |\n"
                              report += "|-------------|-------|------|----------|\n"
                              
                              for stream in streams[:20]:
                                  name = str(stream.get('name', 'Unknown'))[:40].replace('|', '\\|')
                                  group = str(stream.get('group', 'Unknown'))[:25].replace('|', '\\|')
                                  stream_type = stream.get('type', 'Unknown')
                                  
                                  if category in ['working_direct', 'working_via_proxy']:
                                      details = f"HTTP {stream.get('http_code', 'N/A')}"
                                      if stream.get('response_time'):
                                          details += f" ({stream['response_time']:.1f}s)"
                                  else:
                                      details = str(stream.get('error_details', 'Unknown error'))[:30].replace('|', '\\|')
                                  
                                  report += f"| {name} | {group} | {stream_type} | {details} |\n"
                          else:
                              report += f"*Too many streams to list individually ({count} total)*\n"
                          
                          report += "\n"
                  
                  # Geo-restriction Analysis
                  if USE_PROXIES and self.working_proxies:
                      geo_blocked_direct = len(self.results_by_category['geo_blocked'])
                      working_via_proxy = len(self.results_by_category['working_via_proxy'])
                      total_geo_related = geo_blocked_direct + working_via_proxy
                      
                      if total_geo_related > 0:
                          report += "## 🌍 Geo-restriction Analysis\n\n"
                          report += f"- **Total geo-related streams:** {total_geo_related}\n"
                          report += f"- **Successfully unblocked:** {working_via_proxy} ({(working_via_proxy/total_geo_related*100):.1f}%)\n"
                          report += f"- **Confirmed geo-blocked:** {geo_blocked_direct} ({(geo_blocked_direct/total_geo_related*100):.1f}%)\n"
                          report += f"- **Proxy effectiveness:** {len(self.working_proxies)} working proxies used\n\n"
                  
                  # Performance Metrics
                  if total_checked > 0:
                      streams_per_second = total_checked / duration if duration > 0 else 0
                      report += "## ⚡ Performance Metrics\n\n"
                      report += f"- **Analysis Speed:** {streams_per_second:.1f} streams/second\n"
                      report += f"- **Success Rate:** {(total_working/total_checked*100):.1f}% overall\n"
                      report += f"- **Average Response Time:** {sum(r.get('response_time', 0) for r in self.stream_results)/len([r for r in self.stream_results if r.get('response_time')]) if any(r.get('response_time') for r in self.stream_results) else 0:.2f}s\n"
                      
                      if USE_PROXIES:
                          report += f"- **Proxy Utilization:** {len(self.working_proxies)} proxies, {working_via_proxy} successful recoveries\n"
                      report += "\n"
                  
                  # Recommendations
                  report += "## 💡 Recommendations\n\n"
                  
                  # Success rate recommendations
                  overall_success_rate = (total_working/total_checked*100) if total_checked > 0 else 0
                  if overall_success_rate < 20:
                      report += "**Low Success Rate Detected:**\n"
                      report += "- Consider checking different content types (enable VODs, PPV, or FAST)\n"
                      report += "- Many streams may be offline or using different protocols\n"
                      report += "- Try enabling Tor proxy for additional geo-unblocking\n\n"
                  
                  # Geo-blocking recommendations
                  if USE_PROXIES and working_via_proxy > 0:
                      report += f"**Geo-blocking Bypass Success:**\n"
                      report += f"- {working_via_proxy} streams recovered via proxy\n"
                      report += f"- Consider increasing proxy count for better coverage\n"
                      report += f"- Proxy method is effective for your content\n\n"
                  
                  # Performance recommendations
                  if duration > 1800:  # Over 30 minutes
                      report += "**Long Runtime Detected:**\n"
                      report += "- Consider reducing timeout for faster analysis\n"
                      report += "- Enable quick mode for routine checks\n"
                      report += "- Use comprehensive mode only when detailed analysis needed\n\n"
                  
                  # Configuration Summary
                  report += "## ⚙️ Configuration Summary\n\n"
                  report += f"**Current Settings:**\n"
                  report += f"- **Content Types:** "
                  enabled_types = []
                  if CHECK_VODS: enabled_types.append("VODs")
                  if CHECK_PPV: enabled_types.append("PPV")
                  if CHECK_FAST: enabled_types.append("FAST")
                  if not enabled_types: enabled_types.append("Channels only")
                  report += ", ".join(enabled_types) + "\n"
                  
                  report += f"- **Proxy Analysis:** {'Enabled' if USE_PROXIES else 'Disabled'}\n"
                  if USE_PROXIES:
                      report += f"  - Working proxies: {len(self.working_proxies)}\n"
                      report += f"  - Tor support: {'Enabled' if SETUP_TOR else 'Disabled'}\n"
                  
                  report += f"- **Timeout Settings:** {TIMEOUT_SECONDS} seconds per test\n"
                  report += f"- **Analysis Mode:** {'Comprehensive' if COMPREHENSIVE_MODE else 'Standard'}\n\n"
                  
                  report += "## 🎮 Manual Testing Options\n\n"
                  report += "To run different analysis types:\n"
                  report += "1. **Actions** → **Check M3U Streams - Comprehensive Analysis Version**\n"
                  report += "2. Enable specific content: **VODs**, **PPV**, **FAST channels**\n"
                  report += "3. Toggle **comprehensive_mode** for detailed vs quick analysis\n"
                  report += "4. Adjust **timeout_seconds** based on connection speed\n"
                  report += "5. Enable **setup_tor** for additional geo-unblocking\n"
                  report += "6. Increase **target_working_proxies** for better geo-coverage\n\n"
                  
                  # Technical Details
                  report += "## 🔧 Technical Details\n\n"
                  report += "**Analysis Process:**\n"
                  report += "1. Direct connection test for each stream\n"
                  report += "2. Failure classification (timeout, geo-block, server error, etc.)\n"
                  report += "3. Proxy testing for suspected geo-blocked content\n"
                  report += "4. Comprehensive status determination\n\n"
                  
                  report += "**Failure Classification:**\n"
                  report += "- HTTP 403 → Geo-blocked\n"
                  report += "- HTTP 404 → Stream not found\n"
                  report += "- HTTP 401 → Authentication required\n"
                  report += "- HTTP 5xx → Server errors\n"
                  report += "- Connection refused → Server blocking\n"
                  report += "- DNS errors → Domain issues\n"
                  report += "- Timeouts → Slow/unresponsive servers\n\n"
                  
                  report += f"---\n"
                  report += f"*Comprehensive analysis completed in {duration:.1f} seconds*  \n"
                  report += f"*Every stream individually tested and classified*  \n"
                  report += f"*Generated by Enhanced M3U Stream Analyzer v3.0*\n"
                  
                  return report

              async def run(self):
