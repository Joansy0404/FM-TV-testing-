            exit 1
          fi

      - name: 📤 Commit comprehensive analysis report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          
          if [[ -f "report.md" ]]; then
            echo "✅ Comprehensive report ready"
            
            # Sync with remote
            git pull origin main --rebase || {
              git reset --hard HEAD
              git pull origin main
            }
            
            git add report.md
            if ! git diff --staged --quiet; then
              # Extract key metrics from report for commit message
              COMMIT_MSG="🔍 Comprehensive stream analysis"
              
              if [[ -f "report.md" ]]; then
                # Extract duration and working count from report
                DURATION=$(grep -o '[0-9.]*s (' report.md | head -1 | sed 's/s (//g' || echo "?")
                WORKING=$(grep "Working.*(" report.md | grep -o '[0-9]*/' | head -1 | tr -d '/' || echo "?")
                ANALYZED=$(grep "Analyzed.*(" report.md | grep -o '[0-9]*' | head -2 | tail -1 || echo "?")
                
                if [[ "$WORKING" != "?" ]] && [[ "$ANALYZED" != "?" ]]; then
                  SUCCESS_RATE=$(( WORKING * 100 / ANALYZED )) 2>/dev/null || SUCCESS_RATE="?"
                  COMMIT_MSG="$COMMIT_MSG - ${WORKING}/${ANALYZED} working (${SUCCESS_RATE}%)"
                fi
                
                if [[ "$DURATION" != "?" ]]; then
                  COMMIT_MSG="$COMMIT_MSG, ${DURATION}s"
                fi
              fi
              
              # Add content type info
              if [[ "${CHECK_VODS:-false}" == "true" ]]; then
                COMMIT_MSG="$COMMIT_MSG +VODs"
              fi
              if [[ "${CHECK_PPV:-false}" == "true" ]]; then
                COMMIT_MSG="$COMMIT_MSG +PPV"
              fi
              if [[ "${CHECK_FAST:-false}" == "true" ]]; then
                COMMIT_MSG="$COMMIT_MSG +FAST"
              fi
              
              COMMIT_MSG="$COMMIT_MSG - $(date -u '+%m/%d %H:%M UTC')"
              
              echo "Committing: $COMMIT_MSG"
              git commit -m "$COMMIT_MSG"
              
              # Push with retry
              for attempt in {1..3}; do
                if git push origin main; then
                  echo "✅ Comprehensive report pushed successfully"
                  break
                else
                  if [ $attempt -lt 3 ]; then
                    echo "Retrying push..."
                    sleep 3
                    git pull origin main --rebase || {
                      git reset --hard HEAD~1
                      git pull origin main
                      git add report.md
                      git commit -m "$COMMIT_MSG"
                    }
                  else
                    echo "❌ Failed to push after 3 attempts"
                    exit 1
                  fi
                fi
              done
            else
              echo "ℹ️ No changes to commit"
            fi
          else
            echo "❌ Comprehensive report missing"
            exit 1
          fi
