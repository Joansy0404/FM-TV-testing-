                  report += f"| **📡 Channels** | {self.total_by_type['Channel']} | {(self.total_by_type['Channel']/total_streams*100):.1f}% |\n"
                  report += f"| **🎬 VODs** | {self.total_by_type['VOD']} | {(self.total_by_type['VOD']/total_streams*100):.1f}% |\n"
                  report += f"| **🥊 PPV** | {self.total_by_type['PPV']} | {(self.total_by_type['PPV']/total_streams*100):.1f}% |\n"
                  report += f"| **📺 FAST** | {self.total_by_type['FAST']} | {(self.total_by_type['FAST']/total_streams*100):.1f}% |\n"
                  report += f"| **🔍 Checked Streams** | {total_checked} | {checked_percentage:.1f}% |\n"
                  report += f"| **✅ Working Streams** | {total_working} | {working_percentage:.1f}% |\n"
                  report += f"| **❌ Failed Streams** | {total_checked - total_working} | {((total_checked - total_working)/total_checked*100) if total_checked > 0 else 0:.1f}% |\n"
                  report += f"| **⏭️ Skipped Streams** | {len(self.skipped_streams)} | {skipped_percentage:.1f}% |\n\n"
                  
                  # Proxy performance section
                  if USE_PROXIES:
                      report += "## 🌐 Proxy Performance\n\n"
                      report += f"- **Sources Tried:** {self.proxy_stats['sources_tried']}\n"
                      report += f"- **Total Proxies Found:** {self.proxy_stats['total_found']}\n"
                      report += f"- **Proxies Tested:** {self.proxy_stats['tested']}\n"
                      report += f"- **Working Proxies:** {self.proxy_stats['working']} ({(self.proxy_stats['working']/self.proxy_stats['tested']*100) if self.proxy_stats['tested'] > 0 else 0:.1f}% success rate)\n"
                      if total_geo > 0:
                          report += f"- **Geo-blocked Recovery:** {len(self.geo_working)}/{total_geo} streams ({(len(self.geo_working)/total_geo*100):.1f}%)\n"
                      report += "\n"
                  
                  # Stream type breakdown
                  report += "## 🎯 Stream Type Breakdown\n\n"
                  report += "| Type | Working | Failed | Total Checked | Success Rate |\n"
                  report += "|------|---------|--------|---------------|-------------|\n"
                  
                  type_emojis = {'Channel': '📡', 'VOD': '🎬', 'PPV': '🥊', 'FAST': '📺'}
                  
                  for stream_type in ['Channel', 'VOD', 'PPV', 'FAST']:
                      working_count = self.working_by_type[stream_type]
                      failed_count = self.failed_by_type[stream_type]
                      total_type = working_count + failed_count
                      success_rate = (working_count / total_type * 100) if total_type > 0 else 0
                      emoji = type_emojis[stream_type]
                      
                      if total_type > 0:
                          display_name = f"{emoji} **{stream_type}s**" if stream_type != 'Channel' else f"{emoji} **Channels**"
                          report += f"| {display_name} | ✅ {working_count} | ❌ {failed_count} | {total_type} | {success_rate:.1f}% |\n"
                  
                  report += "\n"
                  
                  # Enhanced failure analysis
                  total_failures = sum(len(failures) for failures in self.categorized_failures.values())
                  if total_failures > 0:
                      report += f"## 🚨 Failure Analysis ({total_failures} total failures)\n\n"
                      
                      failure_order = [
                          ('connection_refused', '🚫 Connection Refused', 'Server actively refusing connections'),
                          ('not_found', '🔍 Not Found (404)', 'Stream URL no longer exists'),
                          ('access_denied', '🔒 Access Denied (403/401)', 'Geo-blocked or authentication required'),
                          ('server_error', '🖥️ Server Errors (5xx)', 'Server-side technical issues'),
                          ('timeout', '⏰ Connection Timeouts', 'Server slow/overloaded or PPV preparing'),
                          ('dns_error', '🌐 DNS Failures', 'Domain name resolution failed'),
                          ('stream_error', '📡 Stream Errors', 'Stream exists but not readable'),
                          ('http_error', '🌍 Other HTTP Errors', 'Various HTTP status errors'),
                          ('rate_limited', '🚦 Rate Limited', 'Too many requests'),
                          ('unknown_error', '❓ Unknown Errors', 'Unexpected errors')
                      ]
                      
                      for category, title, description in failure_order:
                          failures = self.categorized_failures.get(category, [])
                          if failures:
                              report += f"### {title} ({len(failures)} streams)\n"
                              report += f"*{description}*\n\n"
                              
                              if len(failures) <= 20:  # Show details for smaller groups
                                  report += "| Channel | Group | Type | Error | Code |\n"
                                  report += "|---------|-------|------|-------|------|\n"
                                  
                                  for stream in failures[:20]:
                                      try:
                                          name = str(stream.get('name', 'Unknown'))[:35].replace('|', '\\|')
                                          group = str(stream.get('group', 'No Group'))[:20].replace('|', '\\|')
                                          stream_type = str(stream.get('type', 'Channel'))
                                          type_emoji = type_emojis.get(stream_type, '❓')
                                          error = str(stream.get('error', 'Unknown'))[:30].replace('|', '\\|')
                                          code = str(stream.get('code', 'N/A'))
                                          
                                          report += f"| {name} | {group} | {type_emoji} {stream_type} | {error} | {code} |\n"
                                      except Exception:
                                          continue
                              else:
                                  report += f"*Too many failures to list individually ({len(failures)} total)*\n"
                              
                              report += "\n"
                  
                  # Skipped streams section
                  if self.skipped_streams:
                      report += f"## ⏭️ Skipped Streams ({len(self.skipped_streams)} total)\n\n"
                      
                      skip_categories = {}
                      for item in self.skipped_streams:
                          reason = item['reason']
                          category = reason.split(' ')[1] if len(reason.split(' ')) > 1 else 'Other'  # Extract VOD, PPV, FAST
                          if category not in skip_categories:
                              skip_categories[category] = []
                          skip_categories[category].append(item)
                      
                      for category, items in skip_categories.items():
                          if category in ['VOD', 'PPV', 'FAST']:
                              emoji = {'VOD': '🎬', 'PPV': '🥊', 'FAST': '📺'}.get(category, '⏭️')
                              report += f"### {emoji} {category} ({len(items)} skipped)\n"
                              report += f"*Enable \"Check {category}\" in workflow dispatch to test these*\n\n"
                  
                  # Configuration notes
                  report += f"## ⚙️ Enhanced Configuration Notes\n\n"
