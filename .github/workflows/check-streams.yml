name: Check M3U Streams with Free Proxies

on:
  workflow_dispatch:
    inputs:
      check_vods:
        description: 'Check VOD files (URLs ending with #.mkv)'
        required: false
        default: false
        type: boolean
      check_ppv:
        description: 'Check PPV channels (may be offline)'
        required: false
        default: false
        type: boolean
      check_fast:
        description: 'Check FAST channels'
        required: false
        default: false
        type: boolean
      use_proxies:
        description: 'Use free proxies for geo-blocked content'
        required: false
        default: true
        type: boolean
      setup_tor:
        description: 'Setup Tor proxy'
        required: false
        default: false
        type: boolean
      timeout_seconds:
        description: 'Timeout per stream (seconds)'
        required: false
        default: '5'
        type: string
      max_proxies:
        description: 'Maximum proxies to test'
        required: false
        default: '30'
        type: string
  schedule:
    - cron: '0 */12 * * *'  # Every 12 hours

permissions:
  contents: write

jobs:
  check-streams:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hour limit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests aiohttp beautifulsoup4 lxml asyncio

      - name: Setup Tor (optional)
        if: ${{ github.event.inputs.setup_tor == 'true' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tor
          sudo service tor start
          sleep 15
          echo "Testing Tor connection..."
          curl --socks5 127.0.0.1:9050 --max-time 10 https://check.torproject.org/api/ip || echo "Tor setup may have issues"

      - name: Enhanced Stream Check
        env:
          CHECK_VODS: ${{ github.event.inputs.check_vods || 'false' }}
          CHECK_PPV: ${{ github.event.inputs.check_ppv || 'false' }}
          CHECK_FAST: ${{ github.event.inputs.check_fast || 'false' }}
          USE_PROXIES: ${{ github.event.inputs.use_proxies || 'true' }}
          SETUP_TOR: ${{ github.event.inputs.setup_tor || 'false' }}
          TIMEOUT_SECONDS: ${{ github.event.inputs.timeout_seconds || '5' }}
          MAX_PROXIES: ${{ github.event.inputs.max_proxies || '30' }}
        run: |
          python - << 'EOF'
          import requests
          import asyncio
          import aiohttp
          import random
          import time
          import os
          import subprocess
          import json
          import re
          from datetime import datetime, timezone

          # Configuration
          CHECK_VODS = os.getenv('CHECK_VODS', 'false').lower() == 'true'
          CHECK_PPV = os.getenv('CHECK_PPV', 'false').lower() == 'true'
          CHECK_FAST = os.getenv('CHECK_FAST', 'false').lower() == 'true'
          USE_PROXIES = os.getenv('USE_PROXIES', 'true').lower() == 'true'
          SETUP_TOR = os.getenv('SETUP_TOR', 'false').lower() == 'true'
          TIMEOUT_SECONDS = int(os.getenv('TIMEOUT_SECONDS', '5'))
          MAX_PROXIES = int(os.getenv('MAX_PROXIES', '30'))

          print(f"Configuration: VODs={CHECK_VODS}, PPV={CHECK_PPV}, FAST={CHECK_FAST}")
          print(f"Proxy settings: USE_PROXIES={USE_PROXIES}, SETUP_TOR={SETUP_TOR}")
          print(f"Timeout: {TIMEOUT_SECONDS}s, Max proxies to test: {MAX_PROXIES}")

          class ProxyStreamChecker:
              def __init__(self):
                  self.working_proxies = []
                  self.geo_working = []
                  self.geo_failed = []
                  self.regular_working = []
                  self.regular_failed = []
                  self.skipped = []

              def get_free_proxies(self):
                  """Fetch and test free proxies"""
                  print("Fetching free proxy lists...")
                  
                  proxy_sources = [
                      "https://api.proxyscrape.com/v2/?request=get&protocol=http&timeout=5000&country=all&format=textplain&limit=200",
                      "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt",
                      "https://raw.githubusercontent.com/mmpx12/proxy-list/master/http.txt",
                      "https://raw.githubusercontent.com/clarketm/proxy-list/master/proxy-list-raw.txt"
                  ]
                  
                  all_proxies = []
                  for source in proxy_sources:
                      try:
                          print(f"Fetching from: {source}")
                          response = requests.get(source, timeout=15)
                          if response.status_code == 200:
                              proxies = [line.strip() for line in response.text.split('\n') 
                                        if ':' in line and len(line.strip()) > 7]
                              all_proxies.extend(proxies)
                              print(f"  Got {len(proxies)} proxies")
                      except Exception as e:
                          print(f"  Failed: {e}")
                  
                  if not all_proxies:
                      print("No proxies found from sources")
                      return []
                  
                  # Remove duplicates and clean
                  unique_proxies = list(set(all_proxies))
                  random.shuffle(unique_proxies)
                  print(f"Testing {min(MAX_PROXIES, len(unique_proxies))} unique proxies...")
                  
                  # Test proxies quickly
                  working = []
                  for i, proxy in enumerate(unique_proxies[:MAX_PROXIES]):
                      if len(working) >= 15:  # Limit working proxies
                          break
                      
                      if self.test_proxy(proxy):
                          proxy_url = f"http://{proxy}" if not proxy.startswith('http') else proxy
                          working.append(proxy_url)
                          print(f"  Working [{len(working)}]: {proxy}")
                      
                      if (i + 1) % 10 == 0:
                          print(f"  Tested {i + 1}, found {len(working)} working")
                  
                  self.working_proxies = working
                  print(f"Found {len(working)} working proxies total")
                  return working

              def test_proxy(self, proxy_address, timeout=4):
                  """Quick test of proxy"""
                  try:
                      if not proxy_address.startswith('http'):
                          proxy_url = f"http://{proxy_address}"
                      else:
                          proxy_url = proxy_address
                      
                      proxies = {'http': proxy_url, 'https': proxy_url}
                      
                      response = requests.get(
                          "http://httpbin.org/ip",
                          proxies=proxies,
                          timeout=timeout,
                          headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'}
                      )
                      
                      if response.status_code == 200:
                          try:
                              data = response.json()
                              return 'origin' in data  # Verify it's a real response
                          except:
                              return True  # Response came back, assume working
                  except:
                      pass
                  return False

              def setup_tor(self):
                  """Setup Tor if requested"""
                  if not SETUP_TOR:
                      return False
                  
                  try:
                      # Test Tor connection via curl (simpler than python socks)
                      result = subprocess.run([
                          'curl', '--socks5', '127.0.0.1:9050', 
                          '--max-time', '10', '--silent',
                          'https://httpbin.org/ip'
                      ], capture_output=True, text=True, timeout=15)
                      
                      if result.returncode == 0:
                          try:
                              tor_ip = json.loads(result.stdout)['origin']
                              print(f"Tor working, IP: {tor_ip}")
                              self.working_proxies.append("tor://127.0.0.1:9050")
                              return True
                          except:
                              pass
                  except Exception as e:
                      print(f"Tor setup failed: {e}")
                  
                  return False

              def parse_m3u(self, file_path):
                  """Parse M3U file"""
                  if not os.path.exists(file_path):
                      print(f"M3U file not found: {file_path}")
                      return []
                  
                  streams = []
                  try:
                      with open(file_path, 'r', encoding='utf-8', errors='ignore') as f:
                          lines = f.readlines()
                  except Exception as e:
                      print(f"Error reading {file_path}: {e}")
                      return []
                  
                  for i in range(len(lines)):
                      line = lines[i].strip()
                      if line.startswith('#EXTINF'):
                          try:
                              group_match = re.search(r'group-title="([^"]*)"', line)
                              group = group_match.group(1) if group_match else "Unknown"
                              
                              name = line.split(',')[-1].strip() if ',' in line else "Unknown"
                              
                              if i + 1 < len(lines):
                                  url = lines[i + 1].strip()
                                  if url and not url.startswith('#') and ('http' in url.lower()):
                                      streams.append({
                                          'name': name,
                                          'url': url,
                                          'group': group
                                      })
                          except Exception as e:
                              continue
                  
                  print(f"Parsed {len(streams)} streams from {file_path}")
                  return streams

              def classify_stream(self, stream):
                  """Classify stream type"""
                  url = stream['url']
                  name = stream['name'].lower()
                  group = stream['group'].lower()
                  
                  # VOD detection
                  if url.endswith('#.mkv') or url.endswith('/fast/#.mkv'):
                      return 'VOD'
                  
                  # PPV detection
                  ppv_groups = ['uk events', 'usa events', 'events']
                  ppv_keywords = ['ppv', 'boxing', 'ufc', 'wwe']
                  if (any(g in group for g in ppv_groups) or 
                      any(k in name or k in group for k in ppv_keywords)):
                      return 'PPV'
                  
                  # FAST detection
                  if 'fast' in group:
                      return 'FAST'
                  
                  return 'Channel'

              def is_geo_blocked(self, stream):
                  """Identify likely geo-blocked streams"""
                  name = stream['name'].lower()
                  group = stream['group'].lower()
                  
                  geo_indicators = [
                      # UK indicators
                      'bbc', 'itv', 'channel 4', 'channel 5', 'sky', 'quest', 'really',
                      'dave', 'drama', 'yesterday', 'alibi', 'eden', 'gold',
                      # Canada
                      'cbc', 'ctv', 'global', 'tsn', 'sportsnet',
                      # Australia  
                      'abc australia', 'sbs', 'seven', 'nine', 'ten', 'fox sports',
                      # Ireland
                      'rte', 'tg4', 'virgin media'
                  ]
                  
                  return any(indicator in name or indicator in group for indicator in geo_indicators)

              def should_skip(self, stream):
                  """Determine if stream should be skipped"""
                  stream_type = self.classify_stream(stream)
                  
                  if stream_type == 'VOD' and not CHECK_VODS:
                      return True, "VOD (disabled)"
                  elif stream_type == 'PPV' and not CHECK_PPV:
                      return True, "PPV (disabled)"  
                  elif stream_type == 'FAST' and not CHECK_FAST:
                      return True, "FAST (disabled)"
                  
                  return False, None

              async def check_stream_direct(self, session, stream):
                  """Check stream without proxy"""
                  try:
                      timeout = aiohttp.ClientTimeout(total=TIMEOUT_SECONDS)
                      headers = {
                          'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                          'Accept': '*/*'
                      }
                      
                      async with session.head(stream['url'], timeout=timeout, headers=headers) as response:
                          return {
                              'stream': stream,
                              'status': 'working' if response.status < 400 else 'failed',
                              'code': response.status,
                              'method': 'direct'
                          }
                  except asyncio.TimeoutError:
                      return {'stream': stream, 'status': 'timeout', 'method': 'direct'}
                  except Exception as e:
                      return {'stream': stream, 'status': 'error', 'error': str(e)[:50], 'method': 'direct'}

              async def check_stream_via_proxy(self, stream, proxy_url):
                  """Check stream via proxy using requests (not async)"""
                  try:
                      if proxy_url.startswith('tor://'):
                          # Use curl for Tor SOCKS proxy
                          result = subprocess.run([
                              'curl', '--socks5', '127.0.0.1:9050',
                              '--head', '--max-time', str(TIMEOUT_SECONDS),
                              '--silent', '--output', '/dev/null',
                              '--write-out', '%{http_code}',
                              stream['url']
                          ], capture_output=True, text=True, timeout=TIMEOUT_SECONDS + 2)
                          
                          if result.returncode == 0:
                              status_code = int(result.stdout.strip()) if result.stdout.strip().isdigit() else 0
                              return {
                                  'stream': stream,
                                  'status': 'working' if status_code < 400 and status_code > 0 else 'failed',
                                  'code': status_code,
                                  'method': 'tor'
                              }
                      else:
                          # Regular HTTP proxy
                          proxies = {'http': proxy_url, 'https': proxy_url}
                          headers = {
                              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                              'Accept': '*/*'
                          }
                          
                          response = requests.head(
                              stream['url'],
                              proxies=proxies,
                              timeout=TIMEOUT_SECONDS,
                              headers=headers
                          )
                          
                          return {
                              'stream': stream,
                              'status': 'working' if response.status_code < 400 else 'failed',
                              'code': response.status_code,
                              'method': 'proxy'
                          }
                  
                  except Exception as e:
                      return {
                          'stream': stream, 
                          'status': 'error', 
                          'error': str(e)[:50], 
                          'method': proxy_url.split('://')[0]
                      }

              async def process_streams(self, streams):
                  """Main processing function"""
                  if not streams:
                      print("No streams to process")
                      return
                  
                  # Classify streams
                  regular_streams = []
                  geo_streams = []
                  
                  for stream in streams:
                      skip, reason = self.should_skip(stream)
                      if skip:
                          self.skipped.append({'stream': stream, 'reason': reason})
                          continue
                      
                      if self.is_geo_blocked(stream):
                          geo_streams.append(stream)
                      else:
                          regular_streams.append(stream)
                  
                  print(f"Stream classification:")
                  print(f"  Regular: {len(regular_streams)}")
                  print(f"  Geo-blocked: {len(geo_streams)}")
                  print(f"  Skipped: {len(self.skipped)}")
                  
                  # Check regular streams directly (fast)
                  if regular_streams:
                      print(f"\nChecking {len(regular_streams)} regular streams...")
                      await self.check_regular_streams(regular_streams)
                  
                  # Check geo-blocked streams with proxies
                  if geo_streams and USE_PROXIES and self.working_proxies:
                      print(f"\nChecking {len(geo_streams)} geo-blocked streams with proxies...")
                      await self.check_geo_streams(geo_streams)
                  elif geo_streams:
                      print(f"\nSkipping {len(geo_streams)} geo-blocked streams (no proxies)")
                      for stream in geo_streams:
                          self.geo_failed.append({
                              'stream': stream,
                              'status': 'skipped',
                              'reason': 'No proxies available'
                          })

              async def check_regular_streams(self, streams):
                  """Check regular streams quickly with async"""
                  connector = aiohttp.TCPConnector(limit=30)
                  
                  async with aiohttp.ClientSession(connector=connector) as session:
                      # Process in batches
                      batch_size = 20
                      for i in range(0, len(streams), batch_size):
                          batch = streams[i:i + batch_size]
                          
                          tasks = [self.check_stream_direct(session, stream) for stream in batch]
                          results = await asyncio.gather(*tasks, return_exceptions=True)
                          
                          for result in results:
                              if isinstance(result, dict):
                                  if result['status'] == 'working':
                                      self.regular_working.append(result)
                                  else:
                                      self.regular_failed.append(result)
                          
                          # Brief pause between batches
                          if i + batch_size < len(streams):
                              await asyncio.sleep(1)

              async def check_geo_streams(self, streams):
                  """Check geo-streams using proxies"""
                  if not self.working_proxies:
                      return
                  
                  for i, stream in enumerate(streams[:50]):  # Limit geo checks
                      print(f"  Geo-check {i+1}/{min(len(streams), 50)}: {stream['name'][:30]}...")
                      
                      success = False
                      for proxy in self.working_proxies[:3]:  # Try first 3 proxies
                          try:
                              result = await self.check_stream_via_proxy(stream, proxy)
                              
                              if result['status'] == 'working':
                                  self.geo_working.append(result)
                                  print(f"    Working via {result['method']}")
                                  success = True
                                  break
                              
                              await asyncio.sleep(0.5)  # Brief delay between proxy attempts
                          except:
                              continue
                      
                      if not success:
                          self.geo_failed.append({
                              'stream': stream,
                              'status': 'failed',
                              'reason': 'All proxies failed'
                          })
                      
                      await asyncio.sleep(1)  # Delay between streams

              def generate_report(self):
                  """Generate final report"""
                  total_regular = len(self.regular_working) + len(self.regular_failed)
                  total_geo = len(self.geo_working) + len(self.geo_failed)
                  total_checked = total_regular + total_geo
                  total_working = len(self.regular_working) + len(self.geo_working)
                  
                  report = "# Enhanced Stream Check Report\n\n"
                  report += f"**Generated:** {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S')} UTC\n"
                  report += f"**Configuration:** VODs={CHECK_VODS}, PPV={CHECK_PPV}, FAST={CHECK_FAST}, Proxies={USE_PROXIES}\n\n"
                  
                  report += "## Summary\n\n"
                  report += f"| Metric | Count | Percentage |\n"
                  report += f"|--------|-------|------------|\n"
                  report += f"| **Total Checked** | {total_checked} | 100.0% |\n"
                  report += f"| **Working Streams** | {total_working} | {(total_working/total_checked*100):.1f}% |\n"
                  report += f"| **Regular Streams** | {total_regular} | {(total_regular/total_checked*100) if total_checked > 0 else 0:.1f}% |\n"
                  report += f"| **Geo-blocked Streams** | {total_geo} | {(total_geo/total_checked*100) if total_checked > 0 else 0:.1f}% |\n"
                  report += f"| **Skipped Streams** | {len(self.skipped)} | - |\n\n"
                  
                  if USE_PROXIES and self.working_proxies:
                      report += f"## Proxy Performance\n\n"
                      report += f"- **Working Proxies Found:** {len(self.working_proxies)}\n"
                      report += f"- **Geo-blocked Streams Recovered:** {len(self.geo_working)}\n"
                      report += f"- **Proxy Success Rate:** {(len(self.geo_working)/total_geo*100) if total_geo > 0 else 0:.1f}%\n\n"
                  
                  report += f"## Performance\n\n"
                  report += f"- **Regular Streams:** {len(self.regular_working)}/{total_regular} working ({(len(self.regular_working)/total_regular*100) if total_regular > 0 else 0:.1f}%)\n"
                  if total_geo > 0:
                      report += f"- **Geo-blocked Streams:** {len(self.geo_working)}/{total_geo} working ({(len(self.geo_working)/total_geo*100):.1f}%)\n"
                  
                  if len(self.skipped) > 0:
                      report += f"\n## Skipped Streams ({len(self.skipped)})\n\n"
                      skip_reasons = {}
                      for item in self.skipped:
                          reason = item['reason']
                          skip_reasons[reason] = skip_reasons.get(reason, 0) + 1
                      
                      for reason, count in skip_reasons.items():
                          report += f"- **{reason}:** {count}\n"
                  
                  report += f"\n---\n*Enhanced check completed with {'proxy support' if USE_PROXIES else 'direct connections only'}*\n"
                  
                  return report

              async def run(self):
                  """Main execution function"""
                  start_time = time.time()
                  print("Starting enhanced stream check...")
                  
                  # Parse M3U
                  streams = self.parse_m3u('channel playlist.m3u')
                  if not streams:
                      print("No streams found, exiting")
                      return
                  
                  # Setup proxies if enabled
                  if USE_PROXIES:
                      print("Setting up proxy infrastructure...")
                      self.get_free_proxies()
                      if SETUP_TOR:
                          self.setup_tor()
                      
                      if not self.working_proxies:
                          print("Warning: No working proxies found")
                  
                  # Process all streams  
                  await self.process_streams(streams)
                  
                  # Generate and save report
                  report = self.generate_report()
                  
                  with open('proxy_report.md', 'w', encoding='utf-8') as f:
                      f.write(report)
                  
                  # Summary
                  duration = time.time() - start_time
                  total_working = len(self.regular_working) + len(self.geo_working)
                  total_checked = len(self.regular_working) + len(self.regular_failed) + len(self.geo_working) + len(self.geo_failed)
                  
                  print(f"\nCompleted in {duration:.1f} seconds")
                  print(f"Results: {total_working}/{total_checked} working")
                  if USE_PROXIES and self.working_proxies:
                      print(f"Proxy recovery: {len(self.geo_working)} geo-blocked streams working")
                  
                  print("Report saved to proxy_report.md")

          # Execute the enhanced checker
          checker = ProxyStreamChecker()
          asyncio.run(checker.run())
          EOF

      - name: Commit Report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          
          if [ -f "proxy_report.md" ]; then
            echo "Report generated successfully"
            ls -la proxy_report.md
            
            git add proxy_report.md
            if ! git diff --staged --quiet; then
              COMMIT_MSG="Enhanced stream check"
              if [[ "${{ github.event.inputs.use_proxies }}" == "true" ]]; then
                COMMIT_MSG="$COMMIT_MSG with proxy support"
              fi
              COMMIT_MSG="$COMMIT_MSG - $(date -u '+%Y-%m-%d %H:%M UTC')"
              
              git commit -m "$COMMIT_MSG"
              
              # Push with retry
              for i in {1..3}; do
                if git push; then
                  echo "Report pushed successfully"
                  break
                else
                  if [ $i -lt 3 ]; then
                    sleep 2
                    git pull --rebase
                  else
                    echo "Failed to push after 3 attempts"
                    exit 1
                  fi
                fi
              done
            else
              echo "No changes to commit"
            fi
          else
            echo "Report file not found!"
            exit 1
          fi
