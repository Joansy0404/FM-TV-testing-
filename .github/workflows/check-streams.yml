              COMMIT_MSG="$COMMIT_MSG - ${WORKING} working, ${DURATION}"
            fi
            
            COMMIT_MSG="$COMMIT_MSG - $(date -u '+%m/%d %H:%M UTC')"
            
            echo "📝 Committing: $COMMIT_MSG"
            git commit -m "$COMMIT_MSG"
            
            echo "🔍 Debug: Commit created successfully"
            git log -1 --oneline
            
            # Enhanced push with detailed retry logic
            echo "📤 Pushing to remote..."
            for attempt in {1..5}; do
              echo "Push attempt $attempt/5..."
              
              if git push origin main; then
                echo "✅ Successfully pushed on attempt $attempt"
                break
              else
                EXIT_CODE=$?
                echo "❌ Push failed with exit code $EXIT_CODE"
                
                if [ $attempt -lt 5 ]; then
                  echo "🔄 Waiting 5 seconds before retry..."
                  sleep 5
                  
                  echo "🔄 Syncing before retry..."
                  git fetch origin main
                  
                  # Check if we need to rebase
                  if ! git merge-base --is-ancestor origin/main HEAD; then
                    echo "🔄 Rebasing on latest changes..."
                    git rebase origin/main || {
                      echo "⚠️ Rebase failed, resetting and pulling..."
                      git rebase --abort
                      git reset --hard HEAD~1
                      git pull origin main
                      git add report.md
                      git commit -m "$COMMIT_MSG"
                    }
                  fi
                else
                  echo "❌ All push attempts failed"
                  echo "🔍 Final git status:"
                  git status
                  echo "🔍 Remote info:"
                  git remote -v
                  echo "🔍 Branch info:"
                  git branch -vv
                  exit 1
                fi
              fi
            done
            
          else
            echo "ℹ️ No changes detected to commit"
          fi
          
          echo "✅ Commit process completed successfully"
