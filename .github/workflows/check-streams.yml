name: IPTV Stream Checker - Enhanced with Robust Validation

on:
  workflow_dispatch:
    inputs:
      check_vods:
        description: 'Check VOD files (URLs ending with #.mkv)'
        required: false
        default: false
        type: boolean
      check_ppv:
        description: 'Check PPV channels (may be offline)'
        required: false
        default: false
        type: boolean
      check_fast:
        description: 'Check FAST channels (Free Ad-Supported TV)'
        required: false
        default: false
        type: boolean
      timeout_seconds:
        description: 'Timeout per stream (seconds)'
        required: false
        default: '10'
        type: string
      extended_timeout:
        description: 'Extended timeout for failed streams (seconds)'
        required: false
        default: '15'
        type: string
      sample_size:
        description: 'Sample size (0=all streams)'
        required: false
        default: '100'
        type: string
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  iptv-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: IPTV Stream Validation Check
        env:
          CHECK_VODS: ${{ github.event.inputs.check_vods || 'false' }}
          CHECK_PPV: ${{ github.event.inputs.check_ppv || 'false' }}
          CHECK_FAST: ${{ github.event.inputs.check_fast || 'false' }}
          TIMEOUT_SECONDS: ${{ github.event.inputs.timeout_seconds || '10' }}
          EXTENDED_TIMEOUT: ${{ github.event.inputs.extended_timeout || '15' }}
          SAMPLE_SIZE: ${{ github.event.inputs.sample_size || '100' }}
        run: |
          python - << 'EOF'
          import requests
          import os
          import re
          import time
          import random
          from datetime import datetime, timezone

          # Configuration
          CHECK_VODS = os.getenv('CHECK_VODS', 'false').lower() == 'true'
          CHECK_PPV = os.getenv('CHECK_PPV', 'false').lower() == 'true'
          CHECK_FAST = os.getenv('CHECK_FAST', 'false').lower() == 'true'
          TIMEOUT_SECONDS = int(os.getenv('TIMEOUT_SECONDS', '10'))
          EXTENDED_TIMEOUT = int(os.getenv('EXTENDED_TIMEOUT', '15'))
          SAMPLE_SIZE = int(os.getenv('SAMPLE_SIZE', '100'))

          print(f"IPTV Stream Validation Starting...")
          print(f"Config: VODs={CHECK_VODS}, PPV={CHECK_PPV}, FAST={CHECK_FAST}")
          print(f"Timeouts: {TIMEOUT_SECONDS}s initial, {EXTENDED_TIMEOUT}s extended")

          class IPTVStreamChecker:
              def __init__(self):
                  self.start_time = time.time()
                  self.results = {
                      'working': [],
                      'geoblocked': [],
                      'failed': [],
                      'skipped': []
                  }
                  self.min_data_threshold = 1024 * 500  # 500KB minimum like IPTV checker

              def classify_stream_type(self, stream):
                  """Classify stream type"""
                  url = stream['url']
                  name = stream['name'].lower()
                  group = stream['group'].lower()
                  
                  if url.endswith('#.mkv'):
                      return 'VOD'
                  elif any(x in group for x in ['uk events', 'usa events', 'events']):
                      return 'PPV'
                  elif 'fast' in group:
                      return 'FAST'
                  else:
                      return 'Channel'

              def should_test_stream(self, stream):
                  """Check if stream should be tested"""
                  stream_type = self.classify_stream_type(stream)
                  
                  if stream_type == 'VOD' and not CHECK_VODS:
                      return False
                  elif stream_type == 'PPV' and not CHECK_PPV:
                      return False
                  elif stream_type == 'FAST' and not CHECK_FAST:
                      return False
                  
                  return True

              def check_stream_robust(self, url, timeout, retries=3):
                  """
                  Robust stream checking based on IPTV checker methodology
                  Tests with actual content download and validation
                  """
                  headers = {
                      'User-Agent': 'IPTVChecker 1.0'  # Using same UA as IPTV checker
                  }
                  
                  initial_timeout = 5
                  max_timeout = timeout

                  def attempt_check(current_timeout):
                      accumulated_data = 0
                      stable_connection = True
                      
                      for attempt in range(retries):
                          try:
                              with requests.get(url, stream=True, 
                                              timeout=(initial_timeout, current_timeout), 
                                              headers=headers) as resp:
                                  
                                  # Check for rate limiting
                                  if resp.status_code == 429:
                                      print(f"    Rate limit, retrying...")
                                      time.sleep(2)
                                      continue
                                  
                                  # Check for geo-blocking indicators (from IPTV checker)
                                  elif resp.status_code in [403, 451, 426]:
                                      return 'Geoblocked'
                                  
                                  # Check for success
                                  elif resp.status_code == 200:
                                      content_type = resp.headers.get('Content-Type', '')
                                      
                                      # Validate content type (from IPTV checker logic)
                                      if (('video/mp2t' in content_type) or 
                                          ('.ts' in url) or 
                                          ('application/vnd.apple.mpegurl' in content_type) or
                                          ('application/x-mpegurl' in content_type.lower())):
                                          
                                          # Read and validate actual stream content
                                          for chunk in resp.iter_content(1024 * 1024):  # 1MB chunks
                                              if not chunk:
                                                  stable_connection = False
                                                  break

                                              accumulated_data += len(chunk)
                                              if accumulated_data >= self.min_data_threshold:
                                                  return 'Alive'

                                          if not stable_connection:
                                              return 'Dead'
                                      else:
                                          return 'Dead'
                                  
                                  # Check for other potential geo-block indicators
                                  elif resp.status_code in [401, 423]:
                                      return 'Geoblocked'
                                  else:
                                      return 'Dead'
                                      
                          except requests.ConnectionError:
                              return 'Dead'
                          except requests.Timeout:
                              return 'Dead'
                          except Exception as e:
                              continue

                      return 'Dead'

                  # First attempt with normal timeout
                  status = attempt_check(timeout)

                  # If dead, retry with extended timeout (like IPTV checker)
                  if status == 'Dead' and EXTENDED_TIMEOUT > timeout:
                      print(f"    Retrying with extended timeout ({EXTENDED_TIMEOUT}s)...")
                      status = attempt_check(EXTENDED_TIMEOUT)

                  return status

              def parse_m3u(self, file_path):
                  """Parse M3U file"""
                  if not os.path.exists(file_path):
                      return []
                      
                  streams = []
                  try:
                      with open(file_path, 'r', encoding='utf-8', errors='ignore') as f:
                          lines = f.readlines()
                  except:
                      return []
                      
                  for i in range(len(lines)):
                      line = lines[i].strip()
                      if line.startswith('#EXTINF'):
                          try:
                              group_match = re.search(r'group-title="([^"]*)"', line)
                              group = group_match.group(1) if group_match else "No Group"
                              name = line.split(',')[-1].strip() if ',' in line else "Unknown"
                              
                              if i + 1 < len(lines):
                                  url = lines[i + 1].strip()
                                  if url and not url.startswith('#') and 'http' in url:
                                      streams.append({
                                          'name': name,
                                          'url': url,
                                          'group': group
                                      })
                          except:
                              continue
                  
                  return streams

              def run_validation(self):
                  """Run IPTV validation on streams"""
                  # Parse M3U
                  all_streams = self.parse_m3u('channel playlist.m3u')
                  if not all_streams:
                      print("No streams found!")
                      return

                  # Filter streams to test
                  test_streams = [s for s in all_streams if self.should_test_stream(s)]
                  
                  # Apply sample size limit
                  if SAMPLE_SIZE > 0 and len(test_streams) > SAMPLE_SIZE:
                      test_streams = random.sample(test_streams, SAMPLE_SIZE)
                  
                  print(f"Testing {len(test_streams)} streams (from {len(all_streams)} total)")
                  
                  # Count by type
                  type_counts = {'Channel': 0, 'VOD': 0, 'PPV': 0, 'FAST': 0}
                  for stream in test_streams:
                      stream_type = self.classify_stream_type(stream)
                      type_counts[stream_type] += 1
                  
                  print("Stream types to test:")
                  for stream_type, count in type_counts.items():
                      if count > 0:
                          print(f"  {stream_type}: {count}")
                  
                  # Test streams
                  tested = 0
                  for stream in test_streams:
                      tested += 1
                      stream_type = self.classify_stream_type(stream)
                      
                      print(f"[{tested}/{len(test_streams)}] Testing: {stream['name'][:40]}... ({stream_type})")
                      
                      # Use robust checking method
                      status = self.check_stream_robust(stream['url'], TIMEOUT_SECONDS)
                      
                      # Categorize results
                      stream_result = {
                          'name': stream['name'],
                          'type': stream_type,
                          'group': stream['group'],
                          'url': stream['url'],
                          'status': status
                      }
                      
                      if status == 'Alive':
                          self.results['working'].append(stream_result)
                          print(f"  ✅ Working")
                      elif status == 'Geoblocked':
                          self.results['geoblocked'].append(stream_result)
                          print(f"  🔒 Geo-blocked")
                      else:
                          self.results['failed'].append(stream_result)
                          print(f"  ❌ Failed")
                      
                      # Brief pause
                      time.sleep(0.1)

              def generate_report(self):
                  """Generate comprehensive report"""
                  duration = time.time() - self.start_time
                  
                  total_tested = (len(self.results['working']) + 
                                len(self.results['geoblocked']) + 
                                len(self.results['failed']))
                  
                  working_count = len(self.results['working'])
                  geo_count = len(self.results['geoblocked'])
                  failed_count = len(self.results['failed'])
                  
                  success_rate = (working_count / total_tested * 100) if total_tested > 0 else 0
                  
                  report = f"# IPTV Stream Validation Report\n\n"
                  report += f"**Generated:** {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}  \n"
                  report += f"**Duration:** {duration:.1f}s ({duration/60:.1f}m)  \n"
                  report += f"**Method:** Robust content validation (IPTV Checker methodology)  \n"
                  report += f"**Sample:** {total_tested} streams tested  \n\n"
                  
                  # Summary
                  report += "## Summary\n\n"
                  report += f"- **✅ Working:** {working_count} streams ({success_rate:.1f}%)\n"
                  report += f"- **🔒 Geo-blocked:** {geo_count} streams ({(geo_count/total_tested*100) if total_tested > 0 else 0:.1f}%)\n"
                  report += f"- **❌ Failed:** {failed_count} streams ({(failed_count/total_tested*100) if total_tested > 0 else 0:.1f}%)\n"
                  report += f"- **📊 Total tested:** {total_tested} streams\n\n"
                  
                  # Performance
                  if duration > 0:
                      rate = total_tested / duration
                      report += f"**Performance:** {rate:.1f} streams/second with content validation\n\n"
                  
                  # Stream type breakdown
                  type_stats = {}
                  for category in ['working', 'geoblocked', 'failed']:
                      for stream in self.results[category]:
                          stream_type = stream['type']
                          if stream_type not in type_stats:
                              type_stats[stream_type] = {'working': 0, 'geoblocked': 0, 'failed': 0, 'total': 0}
                          type_stats[stream_type][category] += 1
                          type_stats[stream_type]['total'] += 1
                  
                  if type_stats:
                      report += "## Stream Type Analysis\n\n"
                      report += "| Type | Working | Geo-blocked | Failed | Total | Success Rate |\n"
                      report += "|------|---------|-------------|--------|-------|-------------|\n"
                      
                      for stream_type, stats in type_stats.items():
                          success = (stats['working'] / stats['total'] * 100) if stats['total'] > 0 else 0
                          report += f"| {stream_type} | {stats['working']} | {stats['geoblocked']} | {stats['failed']} | {stats['total']} | {success:.1f}% |\n"
                      
                      report += "\n"
                  
                  # Sample working streams
                  if self.results['working']:
                      report += "## Sample Working Streams\n\n"
                      report += "| Channel | Type | Group |\n"
                      report += "|---------|------|---------|\n"
                      
                      for stream in self.results['working'][:15]:
                          name = stream['name'][:35].replace('|', '\\|')
                          stream_type = stream['type']
                          group = stream['group'][:25].replace('|', '\\|')
                          report += f"| {name} | {stream_type} | {group} |\n"
                      
                      report += "\n"
                  
                  # Geo-blocked streams
                  if self.results['geoblocked']:
                      report += "## Geo-blocked Streams\n\n"
                      report += "| Channel | Type | Group |\n"
                      report += "|---------|------|---------|\n"
                      
                      for stream in self.results['geoblocked'][:10]:
                          name = stream['name'][:35].replace('|', '\\|')
                          stream_type = stream['type']
                          group = stream['group'][:25].replace('|', '\\|')
                          report += f"| {name} | {stream_type} | {group} |\n"
                      
                      report += "\n"
                  
                  # Sample failed streams
                  if self.results['failed']:
                      report += "## Sample Failed Streams\n\n"
                      report += "| Channel | Type | Group |\n"
                      report += "|---------|------|---------|\n"
                      
                      for stream in self.results['failed'][:10]:
                          name = stream['name'][:35].replace('|', '\\|')
                          stream_type = stream['type']
                          group = stream['group'][:25].replace('|', '\\|')
                          report += f"| {name} | {stream_type} | {group} |\n"
                      
                      report += "\n"
                  
                  # Methodology notes
                  report += "## Validation Methodology\n\n"
                  report += "This checker uses robust IPTV validation techniques:\n\n"
                  report += f"- **Content Validation:** Downloads {self.min_data_threshold // 1024}KB of actual stream data\n"
                  report += f"- **Content-Type Checking:** Validates IPTV-specific MIME types\n"
                  report += f"- **Retry Logic:** {TIMEOUT_SECONDS}s initial timeout, {EXTENDED_TIMEOUT}s extended\n"
                  report += f"- **Geo-blocking Detection:** Identifies HTTP 403, 451, 426 status codes\n"
                  report += f"- **Rate Limit Handling:** Automatic retry with delays\n"
                  report += f"- **Streaming Verification:** Tests actual data flow, not just HTTP responses\n\n"
                  
                  report += "## Configuration\n\n"
                  content_types = []
                  if CHECK_VODS: content_types.append("VODs")
                  if CHECK_PPV: content_types.append("PPV")
                  if CHECK_FAST: content_types.append("FAST")
                  if not content_types: content_types.append("Channels only")
                  
                  report += f"- **Content Types:** {', '.join(content_types)}\n"
                  report += f"- **Timeouts:** {TIMEOUT_SECONDS}s initial, {EXTENDED_TIMEOUT}s extended\n"
                  report += f"- **Sample Size:** {SAMPLE_SIZE if SAMPLE_SIZE > 0 else 'All streams'}\n"
                  report += f"- **Validation Threshold:** {self.min_data_threshold // 1024}KB minimum data\n\n"
                  
                  report += "---\n"
                  report += f"*IPTV validation completed in {duration:.1f} seconds*  \n"
                  report += f"*Uses proven IPTV Checker methodology for accurate results*\n"
                  
                  return report

              def run(self):
                  """Main execution"""
                  print("Starting IPTV Stream Validation...")
                  
                  # Run validation
                  self.run_validation()
                  
                  # Generate report
                  print("\nGenerating validation report...")
                  report = self.generate_report()
                  
                  try:
                      with open('report.md', 'w', encoding='utf-8') as f:
                          f.write(report)
                      print("Report generated successfully!")
                  except Exception as e:
                      print(f"Error writing report: {e}")
                      # Fallback
                      with open('report.md', 'w', encoding='utf-8') as f:
                          f.write(f"# IPTV Validation Report\nError: {e}\n")
                  
                  # Final summary
                  duration = time.time() - self.start_time
                  total = (len(self.results['working']) + 
                          len(self.results['geoblocked']) + 
                          len(self.results['failed']))
                  working = len(self.results['working'])
                  
                  print(f"\nIPTV Validation Complete:")
                  print(f"Duration: {duration:.1f}s ({duration/60:.1f}m)")
                  print(f"Results: {working}/{total} working ({(working/total*100) if total > 0 else 0:.1f}%)")
                  print(f"Geo-blocked: {len(self.results['geoblocked'])}")

          # Run the IPTV checker
          checker = IPTVStreamChecker()
          checker.run()
          EOF

      - name: Commit IPTV validation report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          
          if [[ -f "report.md" ]]; then
            git pull origin main --rebase || true
            git add report.md
            if ! git diff --staged --quiet; then
              git commit -m "IPTV validation report - $(date -u '+%m/%d %H:%M UTC')"
              git push origin main
            fi
          fi
