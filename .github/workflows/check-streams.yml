name: Stream Checker with Detailed Diagnostics

on:
  workflow_dispatch:
    inputs:
      check_vods:
        description: 'Check VOD files'
        required: false
        default: false
        type: boolean
      check_ppv:
        description: 'Check PPV channels'
        required: false
        default: false
        type: boolean
      check_fast:
        description: 'Check FAST channels'
        required: false
        default: false
        type: boolean
      use_proxies:
        description: 'Use proxies for geo-blocked content'
        required: false
        default: true
        type: boolean
      timeout_seconds:
        description: 'Timeout per stream (seconds)'
        required: false
        default: '8'
        type: string
      sample_size:
        description: 'Test sample size (0=all, 100=random 100)'
        required: false
        default: '50'
        type: string
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  diagnostic-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install requests aiohttp asyncio

      - name: Stream Checker with Detailed Diagnostics
        env:
          CHECK_VODS: ${{ github.event.inputs.check_vods || 'false' }}
          CHECK_PPV: ${{ github.event.inputs.check_ppv || 'false' }}
          CHECK_FAST: ${{ github.event.inputs.check_fast || 'false' }}
          USE_PROXIES: ${{ github.event.inputs.use_proxies || 'true' }}
          TIMEOUT_SECONDS: ${{ github.event.inputs.timeout_seconds || '8' }}
          SAMPLE_SIZE: ${{ github.event.inputs.sample_size || '50' }}
        run: |
          python - << 'EOF'
          import requests
          import asyncio
          import aiohttp
          import random
          import time
          import os
          import re
          import base64
          import json
          from datetime import datetime, timezone
          from urllib.parse import urlparse

          # Config
          CHECK_VODS = os.getenv('CHECK_VODS', 'false').lower() == 'true'
          CHECK_PPV = os.getenv('CHECK_PPV', 'false').lower() == 'true'
          CHECK_FAST = os.getenv('CHECK_FAST', 'false').lower() == 'true'
          USE_PROXIES = os.getenv('USE_PROXIES', 'true').lower() == 'true'
          TIMEOUT_SECONDS = int(os.getenv('TIMEOUT_SECONDS', '8'))
          SAMPLE_SIZE = int(os.getenv('SAMPLE_SIZE', '50'))

          class DiagnosticStreamChecker:
              def __init__(self):
                  self.start_time = time.time()
                  self.diagnostic_results = []
                  self.url_analysis = {}
                  self.test_methods = {
                      'head_request': [],
                      'get_request': [],
                      'range_request': [],
                      'with_different_headers': []
                  }

              def extract_real_provider_info(self, stream_url):
                  """Extract provider info and analyze URL structure"""
                  analysis = {
                      'original_url': stream_url,
                      'is_wrapped': False,
                      'wrapping_service': None,
                      'real_provider': None,
                      'url_structure': {},
                      'decoding_success': False
                  }
                  
                  try:
                      # Check for wrapped URL
                      if 'alt.xtream-ie.org' in stream_url and '/fast' in stream_url:
                          analysis['is_wrapped'] = True
                          analysis['wrapping_service'] = 'alt.xtream-ie.org'
                          
                          # Try to decode
                          pattern = r'/1([^/]+)/fast'
                          match = re.search(pattern, stream_url)
                          
                          if match:
                              try:
                                  encoded_payload = match.group(1)
                                  decoded_payload = encoded_payload.replace('%3D', '=')
                                  json_str = base64.b64decode(decoded_payload).decode('utf-8')
                                  payload_data = json.loads(json_str)
                                  original_url = payload_data.get('url', '')
                                  
                                  if original_url:
                                      analysis['decoding_success'] = True
                                      analysis['decoded_url'] = original_url
                                      analysis['stream_id'] = payload_data.get('id')
                                      
                                      parsed = urlparse(original_url)
                                      analysis['real_provider'] = parsed.netloc.lower()
                                      analysis['url_structure'] = {
                                          'scheme': parsed.scheme,
                                          'domain': parsed.netloc,
                                          'path': parsed.path,
                                          'query': parsed.query,
                                          'fragment': parsed.fragment
                                      }
                              except Exception as e:
                                  analysis['decoding_error'] = str(e)
                      else:
                          # Direct URL
                          parsed = urlparse(stream_url)
                          analysis['real_provider'] = parsed.netloc.lower()
                          analysis['url_structure'] = {
                              'scheme': parsed.scheme,
                              'domain': parsed.netloc,
                              'path': parsed.path,
                              'query': parsed.query,
                              'fragment': parsed.fragment
                          }
                  
                  except Exception as e:
                      analysis['analysis_error'] = str(e)
                  
                  return analysis

              def parse_m3u_with_analysis(self, file_path):
                  """Parse M3U and analyze URL patterns"""
                  if not os.path.exists(file_path):
                      return [], {}
                      
                  streams = []
                  url_patterns = {}
                  
                  try:
                      with open(file_path, 'r', encoding='utf-8', errors='ignore') as f:
                          lines = f.readlines()
                  except:
                      return [], {}
                      
                  for i in range(len(lines)):
                      line = lines[i].strip()
                      if line.startswith('#EXTINF'):
                          try:
                              group_match = re.search(r'group-title="([^"]*)"', line)
                              group = group_match.group(1) if group_match else "No Group"
                              name = line.split(',')[-1].strip() if ',' in line else "Unknown"
                              
                              if i + 1 < len(lines):
                                  url = lines[i + 1].strip()
                                  if url and not url.startswith('#') and 'http' in url:
                                      # Analyze URL
                                      url_analysis = self.extract_real_provider_info(url)
                                      
                                      # Track URL patterns
                                      domain = url_analysis.get('real_provider', 'unknown')
                                      if domain not in url_patterns:
                                          url_patterns[domain] = 0
                                      url_patterns[domain] += 1
                                      
                                      streams.append({
                                          'name': name,
                                          'url': url,
                                          'group': group,
                                          'url_analysis': url_analysis
                                      })
                          except:
                              continue
                  
                  return streams, url_patterns

              def classify_stream_type(self, stream):
                  """Classify stream type"""
                  url = stream['url']
                  name = stream['name'].lower()
                  group = stream['group'].lower()
                  
                  if url.endswith('#.mkv'):
                      return 'VOD'
                  elif any(x in group for x in ['uk events', 'usa events', 'events']):
                      return 'PPV'
                  elif 'fast' in group:
                      return 'FAST'
                  else:
                      return 'Channel'

              def should_test_stream(self, stream):
                  """Check if stream should be tested"""
                  stream_type = self.classify_stream_type(stream)
                  
                  if stream_type == 'Channel':
                      return True
                  elif stream_type == 'VOD' and CHECK_VODS:
                      return True
                  elif stream_type == 'PPV' and CHECK_PPV:
                      return True
                  elif stream_type == 'FAST' and CHECK_FAST:
                      return True
                  
                  return False

              async def test_stream_multiple_methods(self, stream):
                  """Test stream with multiple HTTP methods to diagnose issues"""
                  url = stream['url']
                  url_analysis = stream['url_analysis']
                  
                  results = {
                      'stream_name': stream['name'][:50],
                      'stream_type': self.classify_stream_type(stream),
                      'url_analysis': url_analysis,
                      'test_results': {}
                  }
                  
                  # Test 1: Simple HEAD request
                  results['test_results']['head_request'] = await self.test_head_request(url)
                  
                  # Test 2: Simple GET request
                  results['test_results']['get_request'] = await self.test_get_request(url)
                  
                  # Test 3: GET with Range header
                  results['test_results']['range_request'] = await self.test_range_request(url)
                  
                  # Test 4: Different User-Agent headers
                  results['test_results']['browser_headers'] = await self.test_browser_headers(url)
                  results['test_results']['vlc_headers'] = await self.test_vlc_headers(url)
                  
                  # Test 5: If wrapped URL, test original URL directly
                  if url_analysis.get('decoding_success') and url_analysis.get('decoded_url'):
                      original_url = url_analysis['decoded_url']
                      results['test_results']['original_url_test'] = await self.test_head_request(original_url)
                  
                  return results

              async def test_head_request(self, url):
                  """Test with HEAD request"""
                  try:
                      timeout = aiohttp.ClientTimeout(total=TIMEOUT_SECONDS)
                      async with aiohttp.ClientSession(timeout=timeout) as session:
                          start_time = time.time()
                          async with session.head(url) as response:
                              response_time = time.time() - start_time
                              return {
                                  'method': 'HEAD',
                                  'status_code': response.status,
                                  'response_time': response_time,
                                  'headers': dict(response.headers),
                                  'success': response.status < 400
                              }
                  except Exception as e:
                      return {
                          'method': 'HEAD',
                          'error': str(e),
                          'success': False
                      }

              async def test_get_request(self, url):
                  """Test with simple GET request"""
                  try:
                      timeout = aiohttp.ClientTimeout(total=TIMEOUT_SECONDS)
                      async with aiohttp.ClientSession(timeout=timeout) as session:
                          start_time = time.time()
                          async with session.get(url) as response:
                              response_time = time.time() - start_time
                              try:
                                  # Try to read some content
                                  content = await asyncio.wait_for(response.read(2048), timeout=3)
                                  content_length = len(content)
                                  has_content = content_length > 100
                              except:
                                  content_length = 0
                                  has_content = False
                              
                              return {
                                  'method': 'GET',
                                  'status_code': response.status,
                                  'response_time': response_time,
                                  'content_length': content_length,
                                  'has_content': has_content,
                                  'headers': dict(response.headers),
                                  'success': response.status < 400 and has_content
                              }
                  except Exception as e:
                      return {
                          'method': 'GET',
                          'error': str(e),
                          'success': False
                      }

              async def test_range_request(self, url):
                  """Test with Range header"""
                  try:
                      headers = {'Range': 'bytes=0-1023'}
                      timeout = aiohttp.ClientTimeout(total=TIMEOUT_SECONDS)
                      async with aiohttp.ClientSession(timeout=timeout) as session:
                          start_time = time.time()
                          async with session.get(url, headers=headers) as response:
                              response_time = time.time() - start_time
                              try:
                                  content = await asyncio.wait_for(response.read(1024), timeout=3)
                                  content_length = len(content)
                              except:
                                  content_length = 0
                              
                              return {
                                  'method': 'GET_RANGE',
                                  'status_code': response.status,
                                  'response_time': response_time,
                                  'content_length': content_length,
                                  'supports_range': response.status == 206,
                                  'success': response.status in [200, 206] and content_length > 0
                              }
                  except Exception as e:
                      return {
                          'method': 'GET_RANGE',
                          'error': str(e),
                          'success': False
                      }

              async def test_browser_headers(self, url):
                  """Test with browser-like headers"""
                  try:
                      headers = {
                          'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                          'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
                          'Accept-Language': 'en-US,en;q=0.5',
                          'Accept-Encoding': 'gzip, deflate',
                          'Connection': 'keep-alive'
                      }
                      timeout = aiohttp.ClientTimeout(total=TIMEOUT_SECONDS)
                      async with aiohttp.ClientSession(timeout=timeout) as session:
                          async with session.head(url, headers=headers) as response:
                              return {
                                  'method': 'HEAD_BROWSER',
                                  'status_code': response.status,
                                  'success': response.status < 400
                              }
                  except Exception as e:
                      return {
                          'method': 'HEAD_BROWSER',
                          'error': str(e),
                          'success': False
                      }

              async def test_vlc_headers(self, url):
                  """Test with VLC-like headers"""
                  try:
                      headers = {
                          'User-Agent': 'VLC/3.0.16',
                          'Accept': '*/*'
                      }
                      timeout = aiohttp.ClientTimeout(total=TIMEOUT_SECONDS)
                      async with aiohttp.ClientSession(timeout=timeout) as session:
                          async with session.head(url, headers=headers) as response:
                              return {
                                  'method': 'HEAD_VLC',
                                  'status_code': response.status,
                                  'success': response.status < 400
                              }
                  except Exception as e:
                      return {
                          'method': 'HEAD_VLC',
                          'error': str(e),
                          'success': False
                      }

              def generate_diagnostic_report(self, all_streams, url_patterns, test_results):
                  """Generate comprehensive diagnostic report"""
                  duration = time.time() - self.start_time
                  
                  report = f"# Stream Testing Diagnostic Report\n\n"
                  report += f"**Generated:** {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}  \n"
                  report += f"**Duration:** {duration:.1f}s ({duration/60:.1f}m)  \n"
                  report += f"**Purpose:** Comprehensive diagnostic analysis for troubleshooting  \n"
                  report += f"**Sample Size:** {len(test_results)} streams tested  \n\n"
                  
                  # M3U Analysis
                  report += "## M3U File Analysis\n\n"
                  report += f"- **Total streams in M3U:** {len(all_streams)}\n"
                  report += f"- **Tested sample:** {len(test_results)} streams\n\n"
                  
                  # URL Pattern Analysis
                  report += "### URL Pattern Distribution\n\n"
                  report += "| Provider/Domain | Stream Count | Percentage |\n"
                  report += "|-----------------|--------------|------------|\n"
                  
                  total_patterns = sum(url_patterns.values())
                  sorted_patterns = sorted(url_patterns.items(), key=lambda x: x[1], reverse=True)
                  
                  for domain, count in sorted_patterns[:15]:
                      percentage = (count / total_patterns * 100) if total_patterns > 0 else 0
                      report += f"| {domain[:35]} | {count} | {percentage:.1f}% |\n"
                  
                  report += "\n"
                  
                  # URL Structure Analysis
                  wrapped_count = sum(1 for s in all_streams if s['url_analysis'].get('is_wrapped'))
                  direct_count = len(all_streams) - wrapped_count
                  
                  report += "### URL Structure Analysis\n\n"
                  report += f"- **Wrapped URLs (via alt.xtream-ie.org):** {wrapped_count} ({(wrapped_count/len(all_streams)*100):.1f}%)\n"
                  report += f"- **Direct URLs:** {direct_count} ({(direct_count/len(all_streams)*100):.1f}%)\n"
                  
                  # Decoding success rate for wrapped URLs
                  if wrapped_count > 0:
                      successful_decoding = sum(1 for s in all_streams 
                                              if s['url_analysis'].get('is_wrapped') and s['url_analysis'].get('decoding_success'))
                      report += f"- **Successful base64 decoding:** {successful_decoding}/{wrapped_count} ({(successful_decoding/wrapped_count*100):.1f}%)\n"
                  
                  report += "\n"
                  
                  # Testing Method Analysis
                  report += "## HTTP Testing Method Analysis\n\n"
                  
                  method_success = {}
                  method_counts = {}
                  
                  for result in test_results:
                      for method_name, method_result in result['test_results'].items():
                          if method_name not in method_success:
                              method_success[method_name] = 0
                              method_counts[method_name] = 0
                          
                          method_counts[method_name] += 1
                          if method_result.get('success', False):
                              method_success[method_name] += 1
                  
                  report += "| Testing Method | Success Count | Total Tested | Success Rate |\n"
                  report += "|----------------|---------------|--------------|-------------|\n"
                  
                  for method in ['head_request', 'get_request', 'range_request', 'browser_headers', 'vlc_headers', 'original_url_test']:
                      if method in method_counts:
                          success_count = method_success[method]
                          total_count = method_counts[method]
                          success_rate = (success_count / total_count * 100) if total_count > 0 else 0
                          method_display = method.replace('_', ' ').title()
                          report += f"| {method_display} | {success_count} | {total_count} | {success_rate:.1f}% |\n"
                  
                  report += "\n"
                  
                  # Detailed Sample Results
                  report += "## Sample Stream Test Results\n\n"
                  
                  # Show first 10 results in detail
                  for i, result in enumerate(test_results[:10]):
                      report += f"### Stream {i+1}: {result['stream_name']}\n"
                      report += f"**Type:** {result['stream_type']}  \n"
                      report += f"**URL Analysis:**\n"
                      
                      url_analysis = result['url_analysis']
                      report += f"- Wrapped: {url_analysis.get('is_wrapped', False)}\n"
                      if url_analysis.get('is_wrapped'):
                          report += f"- Decoding Success: {url_analysis.get('decoding_success', False)}\n"
                          if url_analysis.get('real_provider'):
                              report += f"- Real Provider: {url_analysis['real_provider']}\n"
                      
                      report += f"\n**Test Results:**\n"
                      test_results_data = result['test_results']
                      
                      for method, method_result in test_results_data.items():
                          success_icon = "✅" if method_result.get('success') else "❌"
                          report += f"- {method.replace('_', ' ').title()}: {success_icon}"
                          
                          if 'status_code' in method_result:
                              report += f" (HTTP {method_result['status_code']})"
                          if 'error' in method_result:
                              report += f" - Error: {method_result['error'][:50]}"
                          if 'content_length' in method_result:
                              report += f" - Content: {method_result['content_length']} bytes"
                          
                          report += "\n"
                      
                      report += "\n"
                  
                  # Error Pattern Analysis
                  error_patterns = {}
                  status_codes = {}
                  
                  for result in test_results:
                      for method_result in result['test_results'].values():
                          if 'error' in method_result:
                              error_type = type(method_result['error']).__name__
                              error_patterns[error_type] = error_patterns.get(error_type, 0) + 1
                          
                          if 'status_code' in method_result:
                              code = method_result['status_code']
                              status_codes[code] = status_codes.get(code, 0) + 1
                  
                  if error_patterns:
                      report += "## Error Pattern Analysis\n\n"
                      report += "| Error Type | Count |\n"
                      report += "|------------|-------|\n"
                      
                      for error_type, count in sorted(error_patterns.items(), key=lambda x: x[1], reverse=True):
                          report += f"| {error_type} | {count} |\n"
                      
                      report += "\n"
                  
                  if status_codes:
                      report += "## HTTP Status Code Distribution\n\n"
                      report += "| Status Code | Count | Meaning |\n"
                      report += "|-------------|-------|----------|\n"
                      
                      status_meanings = {
                          200: "OK - Success",
                          206: "Partial Content - Range request success", 
                          403: "Forbidden - Likely geo-blocked",
                          404: "Not Found - Stream doesn't exist",
                          500: "Internal Server Error",
                          502: "Bad Gateway",
                          503: "Service Unavailable",
                          504: "Gateway Timeout"
                      }
                      
                      for code, count in sorted(status_codes.items()):
                          meaning = status_meanings.get(code, "Unknown")
                          report += f"| {code} | {count} | {meaning} |\n"
                      
                      report += "\n"
                  
                  # Recommendations
                  report += "## Diagnostic Recommendations\n\n"
                  
                  # Calculate success rates
                  head_success = method_success.get('head_request', 0) / max(method_counts.get('head_request', 1), 1) * 100
                  get_success = method_success.get('get_request', 0) / max(method_counts.get('get_request', 1), 1) * 100
                  
                  if head_success > get_success:
                      report += "- **HEAD requests perform better than GET** - Consider using HEAD requests for faster checking\n"
                  elif get_success > head_success:
                      report += "- **GET requests perform better than HEAD** - Streams may require content download for validation\n"
                  
                  if method_success.get('browser_headers', 0) > method_success.get('vlc_headers', 0):
                      report += "- **Browser headers perform better** - Consider using browser-like User-Agent strings\n"
                  elif method_success.get('vlc_headers', 0) > method_success.get('browser_headers', 0):
                      report += "- **VLC headers perform better** - Media player headers are preferred by servers\n"
                  
                  # Check if original URL testing helps
                  if 'original_url_test' in method_success and method_success['original_url_test'] > 0:
                      original_success = method_success['original_url_test'] / max(method_counts.get('original_url_test', 1), 1) * 100
                      wrapped_success = method_success.get('head_request', 0) / max(method_counts.get('head_request', 1), 1) * 100
                      
                      if original_success > wrapped_success:
                          report += "- **Original URLs perform better than wrapped URLs** - Consider testing unwrapped URLs directly\n"
                  
                  if sum(method_success.values()) == 0:
                      report += "- **No streams successful with any method** - Check if streams are actually functional\n"
                      report += "- **Manual verification needed** - Test a few URLs manually in VLC or browser\n"
                      report += "- **Consider network/firewall issues** - GitHub Actions may have network restrictions\n"
                  
                  report += f"\n---\n"
                  report += f"*Diagnostic analysis completed - Use this data to optimize stream testing methodology*\n"
                  
                  return report

              async def run(self):
                  """Run comprehensive diagnostic analysis"""
                  print("Starting comprehensive diagnostic analysis...")
                  
                  # Parse M3U with analysis
                  all_streams, url_patterns = self.parse_m3u_with_analysis('channel playlist.m3u')
                  if not all_streams:
                      print("No streams found")
                      return
                  
                  print(f"Found {len(all_streams)} total streams")
                  print(f"URL patterns: {len(url_patterns)} unique providers")
                  
                  # Select test sample
                  test_streams = [s for s in all_streams if self.should_test_stream(s)]
                  
                  if SAMPLE_SIZE > 0 and len(test_streams) > SAMPLE_SIZE:
                      test_streams = random.sample(test_streams, SAMPLE_SIZE)
                  
                  print(f"Testing {len(test_streams)} streams with comprehensive diagnostics...")
                  
                  # Run diagnostic tests
                  test_results = []
                  for i, stream in enumerate(test_streams):
                      print(f"Testing {i+1}/{len(test_streams)}: {stream['name'][:40]}...")
                      result = await self.test_stream_multiple_methods(stream)
                      test_results.append(result)
                  
                  # Generate diagnostic report
                  print("Generating comprehensive diagnostic report...")
                  report = self.generate_diagnostic_report(all_streams, url_patterns, test_results)
                  
                  with open('report.md', 'w', encoding='utf-8') as f:
                      f.write(report)
                  
                  # Summary
                  duration = time.time() - self.start_time
                  print(f"\nDiagnostic analysis complete:")
                  print(f"Duration: {duration:.1f}s")
                  print(f"Streams analyzed: {len(test_streams)}")
                  print(f"Report generated with detailed diagnostics")

          # Run diagnostic checker
          checker = DiagnosticStreamChecker()
          asyncio.run(checker.run())
          EOF

      - name: Commit diagnostic report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          
          if [[ -f "report.md" ]]; then
            git pull origin main --rebase || true
            git add report.md
            if ! git diff --staged --quiet; then
              git commit -m "Stream diagnostic analysis - $(date -u '+%m/%d %H:%M UTC')"
              git push origin main
            fi
          fi
