                      with open('report.md', 'w', encoding='utf-8') as f:
                          f.write(fallback)
                  
                  # Final summary
                  duration = time.time() - self.start_time
                  total_working = sum(counts['working'] for counts in self.by_type.values())
                  total_checked = sum(counts['checked'] for counts in self.by_type.values())
                  geo_recovered = len(self.results_by_category['working_via_proxy'])
                  
                  print(f"\n" + "="*70)
                  print(f"🔍 COMPREHENSIVE ANALYSIS COMPLETE")
                  print(f"="*70)
                  print(f"Duration: {duration:.1f}s ({duration/60:.1f}m)")
