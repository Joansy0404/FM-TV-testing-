name: VPN Stream Test (UK/US Alternating)

on:
  workflow_dispatch:
    inputs:
      sample_size:
        description: 'Sample size (0=all streams, 100=sample)'
        required: false
        default: '0'
        type: string
      check_vods:
        description: 'Check VOD files (URLs ending with #.mkv)'
        required: false
        default: false
        type: boolean
      check_ppv:
        description: 'Check PPV channels (may be offline)'
        required: false
        default: false
        type: boolean
      check_fast:
        description: 'Check FAST channels (Free Ad-Supported TV)'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '15 1,7,13,19 * * *'  # Every 6 hours

permissions:
  contents: write

jobs:
  vpn-stream-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -version

      - name: Determine which country to test
        run: |
          if [ -f "report.md" ]; then
            LAST_COUNTRY=$(grep -oP "Last tested: \K(UK|US)" report.md | head -1 || echo "US")
          else
            LAST_COUNTRY="US"
          fi
          
          if [ "$LAST_COUNTRY" = "UK" ]; then
            COUNTRY_CODE="us"
            COUNTRY_NAME="United States"
          else
            COUNTRY_CODE="uk"
            COUNTRY_NAME="United Kingdom"
          fi
          
          echo "COUNTRY_CODE=$COUNTRY_CODE" >> $GITHUB_ENV
          echo "COUNTRY_NAME=$COUNTRY_NAME" >> $GITHUB_ENV
          echo "Testing $COUNTRY_NAME (premium servers)"

      - name: Start VPN
        run: |
          echo "Starting ${{ env.COUNTRY_NAME }} VPN..."
          docker network create vpn-network || true
          
          docker run -d \
            --name gluetun \
            --cap-add=NET_ADMIN \
            --device /dev/net/tun \
            --network vpn-network \
            -p 8888:8888 \
            -e VPN_SERVICE_PROVIDER=protonvpn \
            -e OPENVPN_USER="${{ secrets.VPN_USER }}" \
            -e OPENVPN_PASSWORD="${{ secrets.VPN_PASSWORD }}" \
            -e SERVER_COUNTRIES="${{ env.COUNTRY_NAME }}" \
            -e SERVER_FEATURES=p2p \
            -e FREE_ONLY=off \
            -e LOG_LEVEL=info \
            -e HTTPPROXY=on \
            -e HTTPPROXY_LISTENING_ADDRESS=:8888 \
            qmcgaw/gluetun:latest
          
          echo "Waiting for VPN..."
          for i in {1..24}; do
            sleep 15
            if curl -x localhost:8888 -s --connect-timeout 10 https://ipinfo.io/json > /tmp/vpn.json 2>/dev/null; then
              COUNTRY=$(cat /tmp/vpn.json | jq -r '.country' 2>/dev/null || echo "Unknown")
              IP=$(cat /tmp/vpn.json | jq -r '.ip' 2>/dev/null || echo "Unknown")
              echo "Attempt $i: $COUNTRY - $IP"
              if [[ "$COUNTRY" != "null" && "$COUNTRY" != "Unknown" ]]; then
                echo "VPN_READY=true" >> $GITHUB_ENV
                echo "CONNECTED_IP=$IP" >> $GITHUB_ENV
                break
              fi
            fi
          done

      - name: Test Streams
        env:
          SAMPLE_SIZE: ${{ github.event.inputs.sample_size || '0' }}
          CHECK_VODS: ${{ github.event.inputs.check_vods || 'false' }}
          CHECK_PPV: ${{ github.event.inputs.check_ppv || 'false' }}
          CHECK_FAST: ${{ github.event.inputs.check_fast || 'false' }}
          VPN_READY: ${{ env.VPN_READY }}
          COUNTRY_CODE: ${{ env.COUNTRY_CODE }}
          CONNECTED_IP: ${{ env.CONNECTED_IP }}
        run: |
          python << 'ENDPY'
          import requests, os, re, time, random, subprocess, json
          from datetime import datetime, timezone

          SAMPLE_SIZE = int(os.getenv('SAMPLE_SIZE', '0'))
          CHECK_VODS = os.getenv('CHECK_VODS', 'false').lower() == 'true'
          CHECK_PPV = os.getenv('CHECK_PPV', 'false').lower() == 'true'
          CHECK_FAST = os.getenv('CHECK_FAST', 'false').lower() == 'true'
          VPN_READY = os.getenv('VPN_READY', 'false').lower() == 'true'
          COUNTRY = os.getenv('COUNTRY_CODE', 'uk').upper()
          CONNECTED_IP = os.getenv('CONNECTED_IP', 'Unknown')

          class VPNStreamTester:
              def __init__(self):
                  self.start_time = time.time()
                  self.results = {}
                  self.history = self.load_history()

              def load_history(self):
                  history = {'tests': []}
                  try:
                      if os.path.exists('report.md'):
                          with open('report.md', 'r') as f:
                              content = f.read()
                              match = re.search(r'<!-- HISTORY\n(.*?)\n-->', content, re.DOTALL)
                              if match:
                                  history = json.loads(match.group(1))
                  except: pass
                  return history

              def parse_m3u(self, path):
                  streams = []
                  try:
                      with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                          lines = f.readlines()
                      for i in range(len(lines)):
                          if lines[i].startswith('#EXTINF'):
                              group = re.search(r'group-title="([^"]*)"', lines[i])
                              name = lines[i].split(',')[-1].strip() or f"Stream {len(streams)+1}"
                              if i+1 < len(lines):
                                  url = lines[i+1].strip()
                                  if url and 'http' in url:
                                      streams.append({
                                          'name': name,
                                          'url': url,
                                          'group': group.group(1) if group else "Unknown"
                                      })
                  except Exception as e:
                      print(f"Parse error: {e}")
                  return streams

              def classify_stream(self, s):
                  if s['url'].endswith('#.mkv'): return 'VOD'
                  g, n = s['group'].lower(), s['name'].lower()
                  if 'ppv' in g or 'events' in g or 'boxing' in n or 'ufc' in n: return 'PPV'
                  if 'fast' in g: return 'FAST'
                  return 'Channel'

              def should_skip(self, s):
                  t = self.classify_stream(s)
                  if t == 'VOD' and not CHECK_VODS: return True
                  if t == 'PPV' and not CHECK_PPV: return True
                  if t == 'FAST' and not CHECK_FAST: return True
                  return False

              def test_stream_ffprobe(self, url, proxy=None):
                  cmd = ['ffprobe', '-v', 'error']
                  if proxy: cmd.extend(['-http_proxy', proxy])
                  cmd.extend(['-show_entries', 'format=duration', '-of', 'default=noprint_wrappers=1:nokey=1', '-timeout', '8000000', url])
                  try:
                      result = subprocess.run(cmd, capture_output=True, text=True, timeout=10)
                      return result.returncode == 0
                  except: return False

              def test_location(self, name, use_vpn=False):
                  print(f"\n{'='*50}\n{name}\n{'='*50}")
                  proxy = 'http://localhost:8888' if use_vpn else None
                  
                  session = requests.Session()
                  if proxy: session.proxies = {'http': proxy, 'https': proxy}
                  
                  try:
                      info = session.get('https://ipinfo.io/json', timeout=10).json()
                      print(f"Testing from: {info.get('country')} - {info.get('ip')}")
                  except Exception as e:
                      print(f"Location check failed: {e}")
                      if use_vpn: return None
                  
                  all_streams = self.parse_m3u('channel playlist.m3u')
                  print(f"Found {len(all_streams)} total streams")
                  
                  filtered = [s for s in all_streams if not self.should_skip(s)]
                  print(f"After filtering: {len(filtered)} streams to test")
                  
                  if SAMPLE_SIZE > 0 and len(filtered) > SAMPLE_SIZE:
                      random.seed(42)
                      filtered = random.sample(filtered, SAMPLE_SIZE)
                      print(f"Sampled: {SAMPLE_SIZE} streams")
                  
                  working, failed = [], []
                  for i, s in enumerate(filtered):
                      print(f"[{i+1}/{len(filtered)}] {s['name'][:40]}...", end=' ')
                      if self.test_stream_ffprobe(s['url'], proxy):
                          working.append(s['name'])
                          print("✅")
                      else:
                          failed.append(s['name'])
                          print("❌")
                      time.sleep(0.2)
                      if (i+1) % 20 == 0:
                          print(f"  Progress: {len(working)}/{i+1} ({len(working)/(i+1)*100:.1f}%)")
                  
                  rate = (len(working)/len(filtered)*100) if filtered else 0
                  print(f"\n{name}: {len(working)}/{len(filtered)} ({rate:.1f}%)")
                  return {'working': working, 'failed': failed, 'rate': rate}

              def generate_report(self):
                  now = datetime.now(timezone.utc)
                  entry = {
                      'date': now.strftime('%Y-%m-%d %H:%M UTC'),
                      'country': COUNTRY,
                      'ip': CONNECTED_IP,
                      'config': f"VODs:{CHECK_VODS},PPV:{CHECK_PPV},FAST:{CHECK_FAST}",
                      'results': {k: {'rate': v['rate'], 'working': len(v['working']), 'total': len(v['working'])+len(v['failed'])} for k,v in self.results.items()}
                  }
                  self.history['tests'].append(entry)
                  if len(self.history['tests']) > 50:
                      self.history['tests'] = self.history['tests'][-50:]
                  
                  r = f"# VPN Stream Test - Historical Tracking\n\n"
                  r += f"**Last tested:** {COUNTRY}\n"
                  r += f"**Last update:** {now.strftime('%Y-%m-%d %H:%M UTC')}\n"
                  r += f"**Config:** VODs: {'✅' if CHECK_VODS else '❌'}, PPV: {'✅' if CHECK_PPV else '❌'}, FAST: {'✅' if CHECK_FAST else '❌'}\n"
                  r += f"**Total tests:** {len(self.history['tests'])}\n\n"
                  
                  r += "## Latest Results\n\n| Location | Working | Total | Success Rate |\n|----------|---------|-------|-------------|\n"
                  for k, v in self.results.items():
                      name = "Direct" if k == 'direct' else f"{COUNTRY} VPN (Premium)"
                      total = len(v['working']) + len(v['failed'])
                      r += f"| {name} | {len(v['working'])} | {total} | **{v['rate']:.1f}%** |\n"
                  
                  r += "\n## Historical Analysis\n\n"
                  uk = [t for t in self.history['tests'] if t['country'] == 'UK']
                  us = [t for t in self.history['tests'] if t['country'] == 'US']
                  
                  if uk:
                      avg = sum(t['results'].get('vpn', {}).get('rate', 0) for t in uk) / len(uk)
                      r += f"**UK VPN Average** ({len(uk)} tests): {avg:.1f}%\n"
                  if us:
                      avg = sum(t['results'].get('vpn', {}).get('rate', 0) for t in us) / len(us)
                      r += f"**US VPN Average** ({len(us)} tests): {avg:.1f}%\n"
                  
                  if uk and us:
                      uk_avg = sum(t['results'].get('vpn', {}).get('rate', 0) for t in uk) / len(uk)
                      us_avg = sum(t['results'].get('vpn', {}).get('rate', 0) for t in us) / len(us)
                      r += f"\n**Recommendation:** "
                      r += f"UK VPN performs better (+{uk_avg-us_avg:.1f}%)\n" if uk_avg > us_avg else f"US VPN performs better (+{us_avg-uk_avg:.1f}%)\n"
                  
                  r += "\n## Recent History\n\n| Date | Country | Config | Success Rate |\n|------|---------|--------|-------------|\n"
                  for t in self.history['tests'][-10:]:
                      rate = t['results'].get('vpn', {}).get('rate', 0)
                      r += f"| {t['date']} | {t['country']} | {t.get('config', 'N/A')} | {rate:.1f}% |\n"
                  
                  r += f"\n<!-- HISTORY\n{json.dumps(self.history, indent=2)}\n-->\n"
                  return r

              def run(self):
                  print(f"Starting: {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')}")
                  print(f"Config: SAMPLE_SIZE={SAMPLE_SIZE}, VODs={CHECK_VODS}, PPV={CHECK_PPV}, FAST={CHECK_FAST}")
                  
                  direct = self.test_location("Direct Connection", use_vpn=False)
                  if direct: self.results['direct'] = direct
                  
                  if VPN_READY:
                      vpn = self.test_location(f"{COUNTRY} VPN (Premium)", use_vpn=True)
                      if vpn: self.results['vpn'] = vpn
                  else:
                      print("\nVPN not ready - skipping")
                  
                  report = self.generate_report()
                  with open('report.md', 'w') as f:
                      f.write(report)
                  
                  dur = (time.time() - self.start_time) / 60
                  print(f"\n{'='*50}\nComplete - Duration: {dur:.1f} min\n{'='*50}")
                  for k, v in self.results.items():
                      name = "Direct" if k == 'direct' else f"{COUNTRY} VPN"
                      total = len(v['working']) + len(v['failed'])
                      print(f"{name:20}: {len(v['working'])}/{total} ({v['rate']:.1f}%)")

          VPNStreamTester().run()
          ENDPY

      - name: Cleanup
        if: always()
        run: |
          docker stop gluetun || true
          docker rm gluetun || true
          docker network rm vpn-network || true

      - name: Commit results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          
          if [[ -f "report.md" ]]; then
            git add report.md
            git pull origin main --rebase || true
            if ! git diff --staged --quiet; then
              RATE=$(grep -oE "\*\*[0-9.]+%" report.md | grep -oE "[0-9.]+" | head -1 || echo "0")
              git commit -m "${{ env.COUNTRY_CODE }} VPN: ${RATE}% (premium) - $(date -u '+%m/%d %H:%M')"
              git push origin main
            fi
          fi
